id: mann-2010-apre
title: The effect of autoregulatory progressive resistance exercise vs. linear periodization on strength improvement in college athletes
authors: [Mann JB, Thyfault JP, Ivey PA, Sayers SP]
year: 2010
venue: Journal of Strength and Conditioning Research 24(7):1718-1723
doi: 10.1519/JSC.0b013e3181def4a6
pmid: '20543732'
url: https://pubmed.ncbi.nlm.nih.gov/20543732/
design: cohort
population: Division I college football players (2.65 +/- 0.8 training years); 6 wk preseason
sample: {studies: null, participants: 23}
read_level: abstract
findings:
- claim: APRE (load adjusted from reps achieved in a to-failure set) improved bench press and estimated squat 1RM more than linear periodization.
  effect: Bench 1RM +93.4 +/- 103 N vs -0.40 +/- 49.6 N (p = 0.02); est. squat +192.7 vs +37.2 N (p = 0.05); 225-lb reps +3.17 vs -0.09
  grade: speculative
limitations: [Non-randomised (two different preseasons); 6 weeks; estimated squat 1RM; APRE included sets to failure.]
topics: [programming/autoregulation]
