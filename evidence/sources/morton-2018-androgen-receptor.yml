id: morton-2018-androgen-receptor
title: "Muscle Androgen Receptor Content but Not Systemic Hormones Is Associated With Resistance Training-Induced Skeletal Muscle Hypertrophy in Healthy, Young Men"
authors: [Morton RW, Sato K, Gallaugher MPB, Oikawa SY, McNicholas PD, Fujita S, Phillips SM]
year: 2018
venue: "Front Physiol 9:1373"
doi: "10.3389/fphys.2018.01373"
pmid: "30356739"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6189473/
design: cohort
population: "Resistance-trained young men, 12 weeks of resistance training; hormone models in 49, intramuscular analyses in the 10 highest and 10 lowest responders"
sample: {studies: null, participants: 49}
read_level: abstract
findings:
  - claim: "Neither circulating nor intramuscular hormones predicted hypertrophy, but muscle androgen-receptor content was higher at all time points in the highest responders and was linearly related to hypertrophy."
    effect: "No hormone differed between HIR and LOR (n = 10 each); AR content vs change in LBM P < 0.01, type 1 CSA P < 0.05, type 2 CSA P < 0.01"
    grade: contested
limitations:
  - "Extreme-group comparison (10 vs 10) from one training period; associational; contradicted for AR changes by bergamasco-2024-androgen-receptor."
topics: [frontiers/individual-response, frontiers/genetics-omics, hypertrophy/mechanisms]
