id: pope-2000-army-stretching
title: A randomized trial of preexercise stretching for prevention of lower-limb injury
authors:
- Pope RP
- Herbert RD
- Kirwan JD
- Graham BJ
year: 2000
venue: Med Sci Sports Exerc 32(2):271-277
doi: 10.1097/00005768-200002000-00004
pmid: '10694106'
url: https://pubmed.ncbi.nlm.nih.gov/10694106/
design: rct
population: 1538 male army recruits, 12 weeks of training; one 20-s static stretch for six leg muscle groups in
  each warm-up vs no stretching
sample:
  studies: null
  participants: 1538
read_level: abstract
findings:
- claim: Pre-exercise stretching did not meaningfully reduce lower-limb injury risk; fitness, age and enlistment
    date predicted injury.
  effect: All injuries HR 0.95 (95% CI 0.77 to 1.18); soft tissue HR 0.83 (0.63 to 1.09); bone HR 1.22 (0.86 to
    1.76)
  grade: established
limitations:
- Military recruits; low stretch dose (20 s per muscle).
topics:
- injury/stretching
cited_in:
