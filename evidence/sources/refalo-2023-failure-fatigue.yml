id: refalo-2023-failure-fatigue
title: Influence of Resistance Training Proximity-to-Failure, Determined by Repetitions-in-Reserve, on Neuromuscular Fatigue in Resistance-Trained Males and Females
authors: [Refalo MC, Helms ER, Hamilton DL, Fyfe JJ]
year: 2023
venue: Sports Medicine - Open 9(1):10
doi: 10.1186/s40798-023-00554-y
pmid: '36752989'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9908800/
design: crossover
population: Resistance-trained males (12) and females (12); failure vs 1 RIR vs 3 RIR sessions
sample: {studies: null, participants: 24}
read_level: full-text
findings:
- claim: Acute neuromuscular fatigue and discomfort rise roughly linearly as sets approach failure, with recovery largely complete by 48 h.
  effect: 'Velocity loss at 4 min: FAIL -25% vs 1-RIR -13% vs 3-RIR -8%; at 24 h FAIL -3%, 1-RIR -3%, 3-RIR +2%; differences gone at 48 h'
  grade: promising
limitations:
- Acute study; single session per condition.
topics: [strength/proximity-to-failure, recovery/fatigue]
cited_in: [research/theses/strength-and-mobility/chapters/03-dose-response.md, research/theses/strength-and-mobility/notes/dose-response.md, research/theses/strength-and-mobility/notes/programming-and-periodization.md]
checked:
  date: 2026-11-24
  by: verification pass
  notes: "Ch3 verification: Europe PMC full text; 24 trained (12 M, 12 F), six bench sets at 75% 1RM; velocity loss at 4 min -25/-13/-8%, at 24 h -3/-3/+2%, resolved by 48 h. Confirmed. The authors conclude the relation between proximity to failure and acute fatigue is linear; they do not call it disproportionate. | Earlier check by chapter 3 literature researcher: Abstract results confirmed in Europe PMC full text."
