id: willems-2017-grip-gwas
title: Large-scale GWAS identifies multiple loci for hand grip strength providing biological insights into muscular fitness
authors: [Willems SM, Wright DJ, Day FR, Trajanoska K, Joshi PK, Morris JA, Matteini AM, Garton FC, Grarup N, Oskolkov N, Thalamuthu A, Mangino M, et al]
year: 2017
venue: Nat Commun 8:16015
