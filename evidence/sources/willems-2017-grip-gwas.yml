findings:
- claim: Even in 195,180 people, only 16 loci reached genome-wide significance for grip strength, illustrating that baseline strength is highly polygenic with small per-variant effects.
  effect: 16 loci at P < 5e-8 (e.g. ACTG1, PEX14, TGFA, SYT1)
  grade: established
limitations: ['Baseline grip strength, not training response.']
