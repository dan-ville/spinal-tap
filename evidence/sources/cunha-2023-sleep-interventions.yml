id: cunha-2023-sleep-interventions
title: "The Impact of Sleep Interventions on Athletic Performance: A Systematic Review"
authors: [Cunha LA, Costa JA, Marques EA, Brito J, Lastella M, Figueiredo P]
year: 2023
venue: "Sports Medicine - Open 9:58"
doi: "10.1186/s40798-023-00599-z"
pmid: "37462808"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10354314/
design: systematic-review
population: "Athletes in individual and team sports; sleep interventions 2011-2021"
sample: {studies: 25, participants: null}
read_level: abstract
findings:
  - claim: "Sleep extension and naps were the most studied and most effective interventions for improving sleep and subsequent performance."
    effect: "Qualitative synthesis of 25 intervention studies"
    grade: promising
  - claim: "Sleep hygiene education, removing electronic devices and cold water immersion showed no effect on sleep or performance, on few studies."
    effect: "Qualitative synthesis"
    grade: speculative
limitations:
  - "Limited high-quality evidence; few strength outcomes; heterogeneous interventions; no meta-analysis."
