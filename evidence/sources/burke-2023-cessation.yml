id: burke-2023-cessation
title: Two Days Versus Four Days of Training Cessation Following a Step-Taper in Powerlifters
authors: [Burke BI, Carroll KM, Travis SK, Stone ME, Stone MH]
year: 2023
venue: Journal of Strength and Conditioning Research 37(12):e625-e632
doi: 10.1519/JSC.0000000000004564
pmid: '37639652'
url: https://pubmed.ncbi.nlm.nih.gov/37639652/
design: rct
population: Powerlifters (22 y); 6-wk peaking program with 1-wk step taper then 2 or 4 days off
sample: {studies: null, participants: 12}
read_level: abstract
findings:
- claim: After a one-week step taper, 2 days off raised bench and total slightly, whereas 4 days off raised deadlift but lowered bench.
  effect: '2D: bench p = 0.032, g = 0.10; total p = 0.014, g = 0.11; 4D: deadlift p = 0.019, g = 0.11; bench p = 0.003, g = -0.13'
  grade: speculative
limitations: [n = 6 per group; effects trivial in size (g ~0.1).]
topics: [programming/taper]
