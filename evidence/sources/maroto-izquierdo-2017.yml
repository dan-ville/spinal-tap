id: maroto-izquierdo-2017
title: 'Skeletal muscle functional and structural adaptations after eccentric overload flywheel resistance training:
  a systematic review and meta-analysis.'
authors:
- Maroto-Izquierdo S
- García-López D
- Fernandez-Gonzalo R
- Moreira OC
- González-Gallego J
- de Paz JA
year: 2017
venue: J Sci Med Sport 20(10):943-951
doi: 10.1016/j.jsams.2017.03.004
pmid: '28385560'
url: https://pubmed.ncbi.nlm.nih.gov/28385560/
design: meta-analysis
population: RCTs of flywheel eccentric-overload training in athletes and healthy adults
sample:
  studies: 9
  participants: 276
read_level: abstract
findings:
- claim: Flywheel eccentric-overload training outperformed conventional weight-stack training across strength, power,
    hypertrophy, jump and speed outcomes.
  effect: Pooled SMD 0.63 (95% CI 0.49 to 0.76) across outcomes; no significant heterogeneity
  grade: contested
limitations:
- Only 9 studies, outcomes pooled together (92 effect sizes); comparators often not volume or effort matched.
topics:
- hypertrophy/flywheel
