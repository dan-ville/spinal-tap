id: gao-2023-sequence
title: 'Effects of concurrent training sequence on VO2max and lower limb strength performance: A systematic review and meta-analysis'
authors:
- Gao J
- Yu L
year: 2023
venue: Front Physiol 14:1072679
doi: 10.3389/fphys.2023.1072679
pmid: '36776981'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9908959/
design: meta-analysis
population: 19 RCTs, 482 participants (285 men, 197 women), same-session S-E vs E-S
sample:
  studies: 19
  participants: 482
read_level: full-text
findings:
- claim: Strength-before-endurance produced slightly larger lower-limb strength gains than the reverse; VO2max and lower-limb
    power did not differ by order.
  effect: Strength SMD 0.19 (95% CI 0.02 to 0.37), p=0.032; VO2max SMD 0.02 (95% CI -0.21 to 0.25); power p=0.523
  grade: promising
limitations:
- Strength advantage concentrated in older adults, women, programmes >8 wk and 2x/wk; includes clinical and older populations;
  a corrigendum was issued (PMID 37215175).
topics:
- concurrent/sequence
cited_in:
- research/theses/strength-and-mobility/chapters/09-concurrent-training.md
- research/theses/strength-and-mobility/notes/concurrent-training.md
