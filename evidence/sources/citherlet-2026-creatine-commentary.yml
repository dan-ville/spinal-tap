findings:
  - claim: "Xu 2024 pooled multiple non-independent cognitive subtests from the same participants as independent effect sizes, a unit-of-analysis error that inflates precision; the same error affected Prokopidis 2023, whose reanalysis lost the overall memory effect except in older adults."
    effect: "E.g. Alves 2013a/b at least seven memory subtests each, McMorris 2006 and 2007b four each, Pires 2020 four; EFSA 2024 health-claim opinion reportedly drew no conclusions from Xu 2024 for this reason"
