findings:
- claim: There is no clear evidence that any specific strategy produces longitudinal (serial) growth of human muscle;
    animal work suggests loading at long muscle lengths is decisive, and combining stretch with activation is promising
    but untested.
  effect: Narrative synthesis
  grade: speculative
limitations:
- Narrative; pre-dates human microendoscopy evidence of serial sarcomere addition (andrews-2025-multiscale).
