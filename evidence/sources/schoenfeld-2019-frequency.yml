id: schoenfeld-2019-frequency
title: How many times per week should a muscle be trained to maximize muscle hypertrophy? A systematic review and meta-analysis of studies examining the effects of resistance training frequency
authors: [Schoenfeld BJ, Grgic J, Krieger J]
year: 2019
venue: Journal of Sports Sciences 37(11):1286-1295
doi: 10.1080/02640414.2018.1555906
pmid: '30558493'
url: https://pubmed.ncbi.nlm.nih.gov/30558493/
design: meta-analysis
population: Trained and untrained adults
sample: {studies: 25, participants: null}
read_level: abstract
findings:
- claim: With weekly volume equated, training frequency did not meaningfully affect hypertrophy; without equation, higher frequency helped modestly through added volume.
  effect: No significant volume-equated difference; ES 0.07 (95% CI -0.08 to 0.21) for direct measures as quoted by Pelland 2026
  grade: established
limitations:
- Pooled frequencies above 3/wk and treated multiple sites per trial as separate effects (per Boutagy 2026).
- 'Secondary sources disagree on the volume-equated estimate: Pelland 2026 quotes ES 0.07 (95% CI -0.08 to 0.21) for direct measures, Boutagy 2026 quotes 0.07 (95% CI -0.02 to 0.17) for 13 volume-equated studies. Probably different subgroups; the primary paper was not read, so treat both CIs as unverified.'
topics: [hypertrophy/frequency]
cited_in: [research/theses/strength-and-mobility/chapters/03-dose-response.md, research/theses/strength-and-mobility/notes/dose-response.md]
checked:
  date: 2026-11-24
  by: verification pass
  notes: "Ch3 verification: PubMed abstract re-read; conclusion confirmed. The quoted CI is secondary, and Pelland and Boutagy quote different CIs (see limitations). Primary full text not obtained. | Earlier check by chapter 3 literature researcher: Effect size quoted from Pelland 2026 (secondary)."
