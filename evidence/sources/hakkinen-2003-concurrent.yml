id: hakkinen-2003-concurrent
title: Neuromuscular adaptations during concurrent strength and endurance training versus strength training
authors:
- Häkkinen K
- Alen M
- Kraemer WJ
- Gorostiaga E
- Izquierdo M
- Rusko H
- Mikkola J
- Häkkinen A
- Valkeinen H
