- Romu S
- Erola V
- Ahtiainen J
- Paavolainen L
year: 2003
venue: Eur J Appl Physiol 89(1):42-52
doi: 10.1007/s00421-002-0751-9
pmid: '12627304'
url: https://pubmed.ncbi.nlm.nih.gov/12627304/
design: rct
population: Men ~37 y, 21 wk; SE 2+2 d/wk (n=11) vs S 2 d/wk (n=16)
sample:
  studies: null
  participants: 27
read_level: abstract
findings:
- claim: Low-frequency concurrent training (2 strength + 2 endurance days per week) did not reduce 1RM, isometric force or
    quadriceps CSA gains, but abolished the RFD gain and the rise in early (0-500 ms) EMG seen with strength training alone.
  effect: 1RM +21% (S) vs +22% (SE); isometric +22% vs +21%; RFD increased only in S (p<0.01); early iEMG increased only in
    S
  grade: promising
limitations:
- Non-randomised group sizes; middle-aged previously untrained men; single site.
topics:
