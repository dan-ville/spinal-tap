id: dupuy-2018-recovery
title: "An Evidence-Based Approach for Choosing Post-exercise Recovery Techniques to Reduce Markers of Muscle Damage, Soreness, Fatigue, and Inflammation: A Systematic Review With Meta-Analysis"
authors: [Dupuy O, Douzi W, Theurot D, Bosquet L, Dugue B]
year: 2018
venue: "Frontiers in Physiology 9:403"
doi: "10.3389/fphys.2018.00403"
pmid: "29755363"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5932411/
design: meta-analysis
population: "RCTs, crossovers and repeated-measures studies of post-exercise recovery techniques"
sample: {studies: 99, participants: null}
read_level: full-text
findings:
  - claim: "Massage was the most effective technique for reducing soreness and perceived fatigue; compression, immersion, contrast water and cryotherapy also reduced soreness."
    effect: "DOMS reductions g -2.26 to -0.40 across effective methods"
    grade: promising
  - claim: "Recovery techniques overall produced small reductions in creatine kinase and inflammatory markers."
    effect: "CK SMD -0.37 (95% CI -0.58 to -0.16); IL-6 -0.36 (-0.60 to -0.12); CRP -0.38 (-0.59 to -0.14)"
    grade: promising
limitations:
  - "Outcomes are soreness, fatigue and blood markers, not performance or long-term adaptation; blinding impossible."
