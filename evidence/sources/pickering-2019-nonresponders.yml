findings:
- claim: Non-response appears specific to an outcome and a dose; it is mitigated by longer training, more outcomes measured, and higher volume or intensity, so 'did not respond to this programme' is more accurate than 'non-responder'.
  effect: Narrative synthesis (cites Churchward-Venne 2015, Montero and Lundby 2017)
  grade: promising
limitations:
- Opinion piece; first author was an employee of a genetic-testing company (DNAFit), declared in the paper.
