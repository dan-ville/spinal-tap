id: petre-2018
title: 'Effects of Flywheel Training on Strength-Related Variables: a Meta-analysis.'
authors:
- Petré H
- Wernstål F
- Mattsson CM
year: 2018
venue: Sports Med Open 4(1):55
doi: 10.1186/s40798-018-0169-5
pmid: '30547232'
url: https://pubmed.ncbi.nlm.nih.gov/30547232/
design: meta-analysis
population: Experimental flywheel training studies, 4-24 wk
sample:
  studies: 20
  participants: null
read_level: full-text
findings:
- claim: Flywheel training increased muscle size, strength and power, but the reported effects are mostly pre-to-post
    changes within flywheel groups rather than comparisons with conventional training.
  effect: 'Within-group ES: CSA 0.59; volume/mass 0.59; maximal strength 1.33; power 1.19'
  grade: promising
limitations:
- Only one included study had a conventional-training comparator; PEDro-rated quality; heterogeneous protocols.
