id: havers-2025-ai-plans
title: A professional assessment of training plans for muscle hypertrophy and maximal strength developed by generative artificial intelligence
authors: [Havers T, Jelonnek C, Masur L, Isenmann E, Sperlich B, Geisler S, Düking P]
year: 2025
venue: Biol Sport 42(4):353-366
doi: 10.5114/biolsport.2026.152350
pmid: '41048240'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12492345/
design: other
population: Plans from GPT-3.5 (ChatGPT and Copilot) and Google Gemini for a fictional advanced trainee, rated by 10 experienced coaches on 27 criteria
sample: {studies: null, participants: 10}
read_level: full-text
findings:
- claim: LLM-generated hypertrophy and strength plans were of moderate quality, differed little between the two goals, and need expert supervision because they cannot individualise.
  effect: 1-5 Likert ratings mostly moderate; Gemini better on 2/27 hypertrophy criteria, Copilot better on 1/27 strength criteria (p < 0.05)
  grade: promising
- claim: The expert raters themselves barely agreed, which limits the evaluation method.
  effect: Fleiss' kappa -0.051 to 0.001 (all p > 0.05)
  grade: promising
limitations: [Models accessed April 2024 (since superseded); single prompt; no outcome trial.]
topics: [technology/ai-coaching]
cited_in: [research/theses/strength-and-mobility/chapters/11-frontiers.md]
