id: knowles-2024-sleep-transcriptome
title: "The interactive effect of sustained sleep restriction and resistance exercise on skeletal muscle transcriptomics in young females"
authors: [Knowles OE, Soria M, Saner NJ, Trewin AJ, Alexander SE, Roberts SSH, Hiam D, Garnham AP, Drinkwater EJ, Aisbett B, Lamon S]
year: 2024
venue: "Physiological Genomics 56(7):506-518"
doi: "10.1152/physiolgenomics.00010.2024"
pmid: "38766755"
url: https://pubmed.ncbi.nlm.nih.gov/38766755/
design: crossover
population: "Resistance-trained women, 18-35 y; nine nights of 5-h time in bed vs normal sleep with four resistance sessions"
sample: {studies: null, participants: 10}
read_level: abstract
findings:
  - claim: "Sleep restriction alone did not change the muscle transcriptome, but it altered the transcriptomic response to resistance exercise."
