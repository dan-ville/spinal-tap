checked: {date: 2026-11-24, by: "verification pass", notes: "Abstract re-read: 60 studies (646 creatine, 651 controls); global lower-limb ES 0.235 (0.125 to 0.346); meta-regression found no link with population or supplementation characteristics. Confirmed. Note: creatine vs placebo with or without training (training was a covariate), outcomes at T1; not a creatine-plus-RT-only analysis."}
