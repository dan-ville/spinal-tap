id: davis-2020-massage
title: "Effect of sports massage on performance and recovery: a systematic review and meta-analysis"
authors: [Davis HL, Alabed S, Chico TJA]
year: 2020
venue: "BMJ Open Sport and Exercise Medicine 6(1):e000614"
doi: "10.1136/bmjsem-2019-000614"
pmid: "32426160"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7228568/
design: meta-analysis
population: "Randomised studies of manual massage in athletes and active people"
sample: {studies: 29, participants: 1012}
read_level: full-text
findings:
  - claim: "Massage did not improve strength, jump, sprint, endurance or fatigue."
    effect: "Strength SMD 0.17 (95% CI -0.08 to 0.42), 12 studies, n = 346, I2 23%"
    grade: established
  - claim: "Massage produced small improvements in soreness and flexibility."
    effect: "DOMS SMD 1.13 (0.44 to 1.82), 10 studies, n = 311, I2 86% (~13% improvement)"
    grade: promising
limitations:
  - "Unblinded comparisons; small trials; high heterogeneity for DOMS; a correction was issued (PMID 33981450)."
topics: [recovery/massage]
cited_in: [research/theses/strength-and-mobility/chapters/10-recovery-and-nutrition.md, research/theses/strength-and-mobility/notes/recovery-and-nutrition.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Full text (Europe PMC XML) re-read: 29 studies, 1,012 participants; no effect on strength, jump, sprint, endurance or fatigue; DOMS SMD 1.13 (0.44 to 1.82), 10 studies, n = 311, I2 86%, heterogeneity driven by one outlier. Confirmed."}
