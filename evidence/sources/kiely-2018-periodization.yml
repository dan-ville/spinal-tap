findings:
- claim: Periodization theory rests on Selye's general adaptation syndrome and homeostasis, a stress model that stress science has since abandoned; responses to stress are individual, context-specific and shaped by psycho-emotional appraisal, not a predictable dose-driven biological sequence.
  effect: Conceptual argument (history of stress science; allostasis; Mason's work showing GAS dissipates when psychological concomitants are removed)
  grade: contested
- claim: Persistence of periodization doctrine is better explained by path dependence (cultural inheritance) than by evidence; planning should be adaptive and responsive.
  effect: Conceptual argument
  grade: speculative
limitations: ['Argument, not data; proponents (Cunanan 2018, Stone 2021) contest the reading of Selye.']
