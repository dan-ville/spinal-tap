id: swinton-2024-dose-response
title: 'Dose-Response Modelling of Resistance Exercise Across Outcome Domains in Strength and Conditioning: A Meta-analysis'
authors: [Swinton PA, Schoenfeld BJ, Murphy A]
year: 2024
venue: Sports Medicine 54(6):1579-1594
doi: 10.1007/s40279-024-02006-3
pmid: '38652410'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11239729/
design: meta-analysis
population: Healthy trained and untrained adults 14-60 y in resistance-only or resistance-dominant interventions, 1962-2018
sample: {studies: 295, participants: 6710}
read_level: full-text
findings:
- claim: Across 295 studies, gains in maximal strength rose monotonically with load (%1RM), with an inflection near 70% 1RM after which additional load added less.
  effect: Non-linear spline of %1RM; best model included duration, average sets and outcome x intensity interaction; strength profile 'monotonic' with inflection ~70% 1RM
  grade: established
- claim: Average sets per session had a small positive association with effect size; adding sessions per week did not improve model performance.
  effect: Sets slope SMD 0.05 (95% CrI 0.03 to 0.07); frequency smooth term ELPD-LOO difference +3.4 (se 2.0), i.e. no improvement
  grade: promising
- claim: Training status and sex did not improve prediction of outcomes.
  effect: ELPD-LOO difference +0.2 (training status), +2.9 (sex)
  grade: promising
limitations:
- Uncontrolled pre-post effect sizes from heterogeneous designs; %1RM often estimated from reps; data end 2018.
- Outcome domains are maximal strength, power, jump, change of direction and sprint; no hypertrophy outcomes. Only 12% of groups were female-only, so the sex test has limited power.
topics: [strength/load, strength/volume, strength/frequency, frontiers/sex-differences]
cited_in: [research/theses/strength-and-mobility/chapters/03-dose-response.md, research/theses/strength-and-mobility/chapters/11-frontiers.md]
