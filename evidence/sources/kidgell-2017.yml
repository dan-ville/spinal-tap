id: kidgell-2017
title: 'Corticospinal responses following strength training: a systematic review and meta-analysis.'
authors:
- Kidgell DJ
- Bonanno DR
- Frazer AK
- Howatson G
- Pearce AJ
year: 2017
venue: Eur J Neurosci 46(11):2648-2661
doi: 10.1111/ejn.13710
pmid: '28921683'
url: https://pubmed.ncbi.nlm.nih.gov/28921683/
design: meta-analysis
population: Healthy untrained adults in strength-training studies with TMS
sample:
  studies: 19
  participants: null
read_level: abstract
findings:
- claim: Strength training reduced short-interval intracortical inhibition and silent-period duration,
    with only a borderline increase in corticospinal excitability and no change in motor threshold.
  effect: Strength SMD 0.84 (95% CI 0.55 to 1.13); SICI SMD -1.00 (-1.84 to -0.17); cSP SMD -0.66 (-1.00
    to -0.32); CSE SMD 0.27 (0.00 to 0.54); motor threshold SMD -0.12 (-0.49 to 0.25)
  grade: promising
limitations:
- Downs and Black quality index; small, heterogeneous trials; untrained participants.
- "Same research group as siddique-2020 with overlapping primary studies; the two meta-analyses are not independent."
- "Later meta-analyses disagree on SICI and corticospinal excitability (gomez-feria-2023, li-2026-corticospinal)."
topics:
- strength/corticospinal
- strength/neural-adaptations
cited_in:
- research/theses/strength-and-mobility/chapters/02-neuromuscular-basis-of-strength.md
checked:
  date: '2026-11-24'
  by: verification pass
  notes: "Abstract re-read; all numbers confirmed. Newer meta-analyses qualify the conclusion: gomez-feria-2023 (multivariate) found no significant SICI effect and a corticospinal excitability increase after metronome-paced training; li-2026-corticospinal found increased corticospinal excitability (SMD 0.59). | Prior check: chapter 2 researcher 2026-11-24"
