id: kokkonen-2007-chronic-stretching
title: Chronic static stretching improves exercise performance
authors:
- Kokkonen J
- Nelson AG
- Eldredge C
- Winchester JB
year: 2007
venue: Med Sci Sports Exerc 39(10):1825-1831
doi: 10.1249/mss.0b013e3181238a2b
pmid: '17909411'
url: https://pubmed.ncbi.nlm.nih.gov/17909411/
design: rct
population: 38 sedentary volunteers; 10 weeks of 40-min lower-body static stretching 3 x/week vs control
sample:
  studies: null
  participants: 38
read_level: abstract
findings:
- claim: Ten weeks of stretching alone in inactive people improved flexibility, jump, sprint, 1RM and strength endurance.
  effect: Flexibility +18.1%; knee flexion 1RM +15.3%; knee extension 1RM +32.4%; vertical jump +6.7%; 20-m sprint
    +1.3%
  grade: contested
limitations:
- Untrained participants; untested allocation details; effects large relative to later meta-analyses (Warneke 2024
  calls such gains 'unreasonably high').
