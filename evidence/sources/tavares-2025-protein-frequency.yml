id: tavares-2025-protein-frequency
title: "Effects of daily protein intake frequency during 8 weeks of resistance training on lean mass and strength adaptations: a randomized non-controlled clinical trial"
authors: [Tavares H, Roschel H, Felicio V, Nobrega A, Hevia-Larrain V, Goncalves LS, Barros TA, Costa AS, Nascimento E]
year: 2025
venue: "Journal of Sports Medicine and Physical Fitness 65(10):1337-1345"
doi: "10.23736/S0022-4707.25.16698-X"
pmid: "40673785"
url: https://pubmed.ncbi.nlm.nih.gov/40673785/
design: rct
population: "Young resistance-trained men; 8 wk RT; three vs five protein meals (>0.24 g/kg each) with similar daily protein"
sample: {studies: null, participants: 18}
read_level: abstract
findings:
  - claim: "Three or five protein meals a day produced similar gains in lean mass, muscle CSA and 1RM when daily protein was matched."
    effect: "Lean mass +1.15 +/- 1.54 kg (3x) vs +0.63 +/- 1.32 kg (5x); VL CSA +3.41 vs +2.53 cm2; knee-extension 1RM +19.1 vs +16.0 kg; no between-group differences"
    grade: speculative
limitations:
  - "32 randomised, 18 completed; underpowered; 8 weeks."
topics: [nutrition/protein]
