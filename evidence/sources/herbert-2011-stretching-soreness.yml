id: herbert-2011-stretching-soreness
title: Stretching to prevent or reduce muscle soreness after exercise
authors:
- Herbert RD
- de Noronha M
- Kamper SJ
year: 2011
venue: Cochrane Database Syst Rev (7):CD004577
doi: 10.1002/14651858.CD004577.pub3
pmid: '21735398'
url: https://pubmed.ncbi.nlm.nih.gov/21735398/
design: systematic-review
population: Randomised studies of stretching before or after exercise with soreness outcomes
sample:
  studies: 12
  participants: null
read_level: abstract
findings:
- claim: Stretching before or after exercise produced no clinically meaningful reduction in delayed-onset muscle
    soreness.
  effect: Pre-exercise MD -0.52/100 (95% CI -11.30 to 10.26); post-exercise -1.04/100 (-6.88 to 4.79); large trial
    peak soreness -3.80/100 (-5.17 to -2.43); quality low to moderate
  grade: established
limitations:
- Mostly small lab studies plus one large field trial.
topics:
- injury/stretching
