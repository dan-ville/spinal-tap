id: bohm-2014-strain-rate-duration
title: "Human Achilles tendon plasticity in response to cyclic strain: effect of rate and duration"
authors: [Bohm S, Mersmann F, Tettke M, Kraft M, Arampatzis A]
year: 2014
venue: "J Exp Biol 217(Pt 22):4010-4017"
doi: "10.1242/jeb.112268"
pmid: "25267851"
url: https://pubmed.ncbi.nlm.nih.gov/25267851/
design: rct
population: "Young adults; 14 wk, 4x/week; reference protocol (~6.5% strain, 3 s load/3 s rest) vs high strain rate (jumps) or long duration (12 s) on contralateral leg; controls"
sample: {studies: null, participants: 39}
read_level: abstract
findings:
  - claim: "Repeated 3-s high-strain contractions increased stiffness and modulus more than 12-s contractions of equal strain and volume; high-rate (jump) loading produced only trends."
    effect: "Reference: stiffness +57%, CSA +4.2%, modulus +51%; long duration: +25%, +5.3%, +17%; high rate: stiffness P=0.08, CSA P=0.09; control no change"
    grade: promising
limitations:
  - "Small groups (14, 12, 13); healthy young adults; one tendon."
topics: [connective-tissue/tendon, connective-tissue/loading-parameters]
