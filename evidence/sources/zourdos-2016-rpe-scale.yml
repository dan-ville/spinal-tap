id: zourdos-2016-rpe-scale
title: Novel Resistance Training-Specific Rating of Perceived Exertion Scale Measuring Repetitions in Reserve
authors: [Zourdos MC, Klemp A, Dolan C, Quiles JM, Schau KA, Jo E, Helms E, Esgro B, Duncan S, Garcia Merino S, Blanco R]
year: 2016
venue: Journal of Strength and Conditioning Research 30(1):267-275
doi: 10.1519/JSC.0000000000001049
pmid: '26049792'
url: https://pubmed.ncbi.nlm.nih.gov/26049792/
design: cross-sectional
population: Experienced (5.2 y) and novice (0.4 y) squatters
sample: {studies: null, participants: 29}
read_level: abstract
findings:
- claim: The RIR-based RPE scale (RPE 10 = 0 RIR, 9 = 1 RIR, ...) tracks bar velocity closely, supporting its use to regulate daily load.
  effect: Velocity-RPE correlation r = -0.88 (experienced) and r = -0.77 (novice); experienced lifters slower and higher RPE at 1RM (p = 0.023)
  grade: established
limitations: ['Validation against velocity, not against actual reps to failure at low RPEs.']
topics: [methods/rpe-rir, programming/autoregulation]
