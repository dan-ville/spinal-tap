checked:
  date: '2026-11-24'
  by: verification pass
  notes: 'Ch5 verification: PubMed abstract re-read (published numbers confirmed). SportRxiv preprint read in full
    in two versions: v1 (2024-10-07) scaled the length slope to a 50% contrast and reported SMD 0.10/0.15/0.20 with
    42.7/29.4/18.6% in ROPE; v3 (2024-10-12) rescaled to the 21.8% average contrast and reports 0.04/0.07/0.09 with
    82.7/77.68/59.02% in ROPE. 11 of 12 studies untrained confirmed (v3). The "trivial" verdict is per 21.8% contrast;
    larger contrasts are extrapolated to larger effects. | Prior check: chapter 5 literature researcher 2026-11-24;
    Published numbers from PubMed abstract; ROPE percentages and included-study list from SportRxiv preprint full
    text (doi 10.51224/SRXIV.464, version 11 Oct 2024).'
