id: coffey-2017-concurrent-review
title: 'Concurrent exercise training: do opposites distract?'
authors:
- Coffey VG
- Hawley JA
year: 2017
venue: J Physiol 595(9):2883-2896
doi: 10.1113/JP272270
pmid: '27506998'
url: https://pubmed.ncbi.nlm.nih.gov/27506998/
design: narrative-review
population: Review of human molecular and training studies
sample:
  studies: null
  participants: null
read_level: full-text
findings:
- claim: Divergent exercise produces similar signalling and gene-expression responses in untrained or recreationally active
    people, and the molecular specificity of the response sharpens with training history.
  effect: Narrative review
  grade: promising
- claim: Multiple integrated effectors, rather than a single AMPK-mTOR switch, likely generate any interference effect.
  effect: Narrative review
  grade: promising
limitations:
- Narrative review; authors state chronic studies give 'robust evidence' for attenuation of hypertrophy and strength, a position
  later meta-analyses (Schumann 2022) do not support for whole-muscle size.
