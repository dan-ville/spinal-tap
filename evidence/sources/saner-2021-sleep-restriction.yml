id: saner-2021-sleep-restriction
title: "Exercise mitigates sleep-loss-induced changes in glucose tolerance, mitochondrial function, sarcoplasmic protein synthesis, and diurnal rhythms"
authors: [Saner NJ, Lee MJ, Kuang J, Pitchford NW, Roach GD, Garnham A, Genders AJ, Stokes T, Schroder EA, Huo Z, Esser KA, Phillips SM, Bishop DJ, Bartlett JD]
year: 2021
venue: "Molecular Metabolism 43:101110"
doi: "10.1016/j.molmet.2020.101110"
pmid: "33137489"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7704425/
design: rct
population: "Healthy young men; five nights of 8 h (NS), 4 h (SR) or 4 h time in bed plus three HIIE sessions (SR+EX); n = 8 per group"
sample: {studies: null, participants: 24}
read_level: full-text
findings:
  - claim: "Five nights of 4-h sleep lowered sarcoplasmic (mitochondria-enriched) protein synthesis, mitochondrial respiration and glucose tolerance; doing high-intensity interval exercise during the restriction prevented these changes."
    effect: "SarcPS FSR 1.11 +/- 0.25 %/day (SR) vs 1.77 +/- 0.22 (SR+EX); SR lower than NS and SR+EX (P < 0.001); mitochondrial respiration -15.9 +/- 12.4 pmol O2/s/mg in SR"
    grade: promising
limitations:
  - "Measured sarcoplasmic, not myofibrillar, synthesis; HIIE not resistance exercise; men only; small groups."
topics: [recovery/sleep]
cited_in: [research/theses/strength-and-mobility/chapters/10-recovery-and-nutrition.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Full text (Europe PMC XML) and abstract re-read: SarcPS 1.11 +/- 0.25 %/day (SR) vs 1.77 +/- 0.22 (SR+EX); the paper measured the sarcoplasmic fraction throughout. Confirmed. | Earlier note (chapter 10 literature researcher): Secondary sources describe this as myofibrillar synthesis; the paper measured sarcoplasmic synthesis"}
