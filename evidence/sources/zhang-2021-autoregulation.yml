id: zhang-2021-autoregulation
title: 'Auto-Regulation Method vs. Fixed-Loading Method in Maximum Strength Training for Athletes: A Systematic Review and Meta-Analysis'
authors: [Zhang X, Li H, Bi S, Luo Y, Cao Y, Zhang G]
year: 2021
venue: Frontiers in Physiology 12:651112
doi: 10.3389/fphys.2021.651112
pmid: '33776802'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7994759/
design: meta-analysis
population: Athletes (college football players, powerlifters, other trained men; one female study); 5-10 wk
sample: {studies: 8, participants: null}
read_level: full-text
findings:
- claim: Autoregulated loading improved maximal strength more than fixed loading in athletes.
  effect: SMD 0.64 (95% CI 0.43 to 0.85), P < 0.001; I2 = 0%; fixed-effect; 17 reports from 8 studies
  grade: contested
- claim: Among methods, only APRE separated from fixed loading; RPE and VBT subgroups did not.
  effect: APRE SMD 0.78 (0.54 to 1.02); RPE SMD 0.17 (-0.33 to 0.67), P = 0.50; VBT SMD 0.43 (-0.24 to 1.10), P = 0.21
  grade: contested
- claim: Longer interventions (>=8 wk) showed larger advantages than shorter ones.
  effect: <8 wk SMD 0.32 (0.00 to 0.64); >=8 wk SMD 0.87 (0.60 to 1.14)
  grade: speculative
limitations: ['Only 4 of 8 studies were RCTs; two APRE studies were non-randomised (Mann 2010, Mann thesis) and drive the APRE result.', 'Multiple outcomes from the same participants pooled as independent reports under a fixed-effect model, inflating precision.', No blinding in any study; PEDro 4-6; several 1RMs estimated from formulas.]
topics: [programming/autoregulation]
cited_in: [research/theses/strength-and-mobility/chapters/04-programming-and-periodization.md, research/theses/strength-and-mobility/notes/programming-and-periodization.md]
