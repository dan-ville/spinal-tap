id: jukic-2023-velocity-loss
title: 'The Acute and Chronic Effects of Implementing Velocity Loss Thresholds During Resistance Training: A Systematic Review, Meta-Analysis, and Critical Evaluation of the Literature'
authors: [Jukic I, Castilla AP, Ramos AG, Van Hooren B, McGuigan MR, Helms ER]
year: 2023
venue: Sports Medicine 53(1):177-214
doi: 10.1007/s40279-022-01754-4
pmid: '36178597'
url: https://pubmed.ncbi.nlm.nih.gov/36178597/
design: meta-analysis
population: Healthy adults; 18 acute and 19 longitudinal velocity-loss studies
sample: {studies: 37, participants: null}
read_level: full-text
findings:
- claim: The velocity-loss threshold did not influence strength gains, but higher thresholds increased hypertrophy and impaired jump, sprint and velocity outcomes.
  effect: Hypertrophy b = 0.006 per % VL (95% CI 0.001 to 0.012); CMJ b = -0.040 (95% CI -0.079 to -0.001); strength and endurance not influenced
  grade: promising
- claim: The velocity-loss literature rests on few laboratories, mostly Smith-machine squat or bench in young men, and some participant data were reused across papers.
  effect: 846 pooled participants reduced to 735 (656 male, 69 female) after removing duplicate datasets; only 5 studies included both sexes
  grade: established
limitations: [Velocity loss changes both proximity to failure and volume load; mostly Smith-machine squat/bench studies from few labs., Multilevel meta-regression handled multiple effects per study; still mostly 6-8-wk interventions.]
topics: [strength/proximity-to-failure, hypertrophy/proximity-to-failure, programming/autoregulation, strength/velocity-based-training, technology/velocity-based-training]
cited_in: [research/theses/strength-and-mobility/chapters/03-dose-response.md, research/theses/strength-and-mobility/chapters/04-programming-and-periodization.md, research/theses/strength-and-mobility/notes/dose-response.md, research/theses/strength-and-mobility/notes/frontiers.md, research/theses/strength-and-mobility/notes/programming-and-periodization.md]
