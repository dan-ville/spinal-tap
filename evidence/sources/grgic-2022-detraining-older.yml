id: grgic-2022-detraining-older
title: Use It or Lose It? A Meta-Analysis on the Effects of Resistance Training Cessation (Detraining) on Muscle Size in Older Adults
authors: [Grgic J]
year: 2022
venue: Int J Environ Res Public Health 19(21):14048
doi: 10.3390/ijerph192114048
pmid: '36360927'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9657634/
design: meta-analysis
population: Older adults who trained 9-24 wk then stopped for 12-52 wk
sample: {studies: 6, participants: null}
read_level: abstract
findings:
- claim: Muscle size gained by older adults was lost when training stopped, more so with longer cessation.
  effect: Training d 0.99 (0.63 to 1.36); detraining d -0.83 (-1.30 to -0.36); 12-24 wk -0.60 (-1.21 to 0.01); 31-52 wk -1.11 (-1.75 to -0.47)
  grade: promising
limitations: [Six studies; no comparison with young adults.]
