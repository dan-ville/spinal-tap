id: langberg-1999-peritendinous-collagen
title: "Type I collagen synthesis and degradation in peritendinous tissue after exercise determined by microdialysis in humans"
authors: [Langberg H, Skovgaard D, Petersen LJ, Bulow J, Kjaer M]
year: 1999
venue: "J Physiol 521(Pt 1):299-306"
doi: "10.1111/j.1469-7793.1999.00299.x"
pmid: "10562353"
url: https://pubmed.ncbi.nlm.nih.gov/10562353/
design: mechanistic
population: "Trained runners; 3 h (36 km) run; peritendinous microdialysis at the Achilles"
sample: {studies: null, participants: 7}
read_level: abstract
findings:
  - claim: "A collagen synthesis marker fell immediately after prolonged running and then rose threefold in peritendinous tissue by 72 h, consistent with delayed net formation."
    effect: "Peritendinous PICP 55 +/- 10 (rest) to 165 +/- 40 ug/L at 72 h; blood PICP +25%; ICTP fell transiently in tendon tissue only"
    grade: promising
limitations:
  - "Peritendinous tissue, not tendon proper; n=7; endurance exercise."
  - "Does not show increased early degradation: ICTP (degradation marker) fell transiently in peritendinous tissue; the early dip is in synthesis (PICP). Should not be cited as support for an early degradation peak."
topics: [connective-tissue/tendon, connective-tissue/time-course]
