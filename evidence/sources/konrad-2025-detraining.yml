checked:
  date: '2026-11-24'
  by: verification pass
  notes: 'Ch7 verification: spot check: pre-to-detraining ES 0.55 (0.33 to 0.77) confirmed from abstract; chapter
    7 notes misquote it as 0.47. | Prior check: verification pass 2026-11-24; Ch6 verification: full text (PMC12638565)
    re-read; 13 studies, 556 participants, pre-post 0.93 (0.54 to 1.31) GRADE high, post-detraining -0.41 (-0.73 to
    -0.09), pre-detraining 0.55 (0.33 to 0.77), inactive -0.52 (p = 0.04), active n.s. (p = 0.09) confirmed. At least
    6 of 13 studies were in children or adolescents (mean ages 5.9-16.5 y). The inactive subgroup''s printed CI (-0.97
    to -0.39) is inconsistent with p = 0.04. ''Active participants maintained ROM'' rests on a non-significant decrease
    (p = 0.09), i.e. absence of evidence. | Prior check: chapter 6 literature researcher 2026-11-24; Full text read;
    effects transcribed from results/tables.'
