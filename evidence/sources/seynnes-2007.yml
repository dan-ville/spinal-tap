id: seynnes-2007
title: Early skeletal muscle hypertrophy and architectural changes in response to high-intensity resistance
  training.
authors:
- Seynnes OR
- de Boer M
- Narici MV
year: 2007
venue: J Appl Physiol 102(1):368-373
doi: 10.1152/japplphysiol.00789.2006
pmid: '17053104'
url: https://pubmed.ncbi.nlm.nih.gov/17053104/
design: other
population: Young healthy volunteers; 35 days flywheel leg extension
sample:
  studies: null
  participants: 7
read_level: abstract
findings:
- claim: Quadriceps CSA increased detectably after 20 days of training, fascicle length after 10 days,
    and MVC rose about 39% by day 35.
  effect: CSA +3.5-5.2% at day 20, +6.5-7.4% at day 35; fascicle length +9.9%, pennation +7.7%; MVC +38.9%
  grade: promising
limitations:
- n = 7; no control; early CSA increases may include oedema (damas-2016).
topics:
- strength/time-course
- strength/morphology
