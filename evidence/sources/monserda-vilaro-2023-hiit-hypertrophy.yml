id: monserda-vilaro-2023-hiit-hypertrophy
title: 'Effects of Concurrent Resistance and Endurance Training Using Continuous or Intermittent Protocols on Muscle Hypertrophy:
  Systematic Review With Meta-Analysis'
authors:
- Monserdà-Vilaró A
- Balsalobre-Fernández C
- Hoffman JR
- Alix-Fages C
- Jiménez SL
year: 2023
venue: J Strength Cond Res 37(3):688-709
doi: 10.1519/JSC.0000000000004304
pmid: '36508686'
url: https://pubmed.ncbi.nlm.nih.gov/36508686/
design: meta-analysis
population: Randomised and non-randomised trials reporting fibre or whole-muscle CSA after RT vs CT
sample:
  studies: 25
  participants: null
read_level: abstract
findings:
- claim: Whole-muscle hypertrophy did not differ between RT and any form of concurrent training.
  effect: SMD < 0.03 for all comparisons
  grade: promising
- claim: Fibre hypertrophy was smaller with concurrent training only when HIIT was included, not with continuous endurance
    training.
  effect: 'RT vs CT with HIIT: SMD > 0.33; HIIT+continuous SMD > 0.27; continuous only SMD < 0.16'
  grade: speculative
limitations:
- Abstract reports thresholds rather than CIs; includes non-randomised studies; fibre-level effect conflicts with Lundberg
  2022 (running/type I) on which endurance type matters.
topics:
- concurrent/hypertrophy
- concurrent/hiit
