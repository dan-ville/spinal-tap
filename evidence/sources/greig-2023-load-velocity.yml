id: greig-2023-load-velocity
title: 'The Predictive Validity of Individualised Load-Velocity Relationships for Predicting 1RM: A Systematic Review and Individual Participant Data Meta-analysis'
authors: [Greig L, Aspe RR, Hall A, Comfort P, Cooper K, Swinton PA]
year: 2023
venue: Sports Med 53(9):1693-1708
doi: 10.1007/s40279-023-01854-9
pmid: '37493929'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10432349/
design: meta-analysis
population: Resistance-trained participants in studies comparing measured and load-velocity-predicted 1RM (squat, bench, deadlift, Olympic lifts)
sample: {studies: 26, participants: 434}
read_level: full-text
findings:
- claim: Individualised load-velocity relationships predict 1RM with moderate validity, an error of roughly 10% of 1RM.
  effect: SEE% 9.8 (95% CI 7.4 to 12.2); bench press SEE 8.5 kg (5.4 to 11.6); squat SEE 18.6 kg (7.5 to 29.8), SEE% 12.3 (3.3 to 21.4), 'poor'; deadlift SEE 13.3 kg (9.5 to 17.1), SEE% 8 (5.9 to 10.2)
  grade: promising
- claim: Predictions systematically overestimate 1RM regardless of modelling choice (number of loads, group vs individual minimum velocity threshold).
  effect: Mean overestimate 4.5 kg (1.5 to 7.4), 3.7% of 1RM (0.5 to 6.9)
  grade: promising
- claim: Prediction error grows with relative strength.
  effect: Bench press error +0.98 kg (0.4 to 1.6) per 0.1 unit increase in 1RM/body mass (bench press only; too few data for squat and deadlift)
  grade: promising
limitations:
- 137 models from 26 studies; 20 studies (434 participants) in meta-analysis; raw data for only 8 studies, rest digitised; PROBAST risk of bias low to high.
topics: [technology/velocity-based-training]
cited_in: [research/theses/strength-and-mobility/chapters/11-frontiers.md]
