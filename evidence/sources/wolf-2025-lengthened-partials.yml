id: wolf-2025-lengthened-partials
title: Lengthened partial repetitions elicit similar muscular adaptations as full range of motion repetitions during
  resistance training in trained individuals.
authors:
- Wolf M
- Androulakis Korakakis P
- Piñero A
- Mohan AE
- Hermann T
- Augustin F
- Sapuppo M
- Lin B
- Coleman M
- Burke R
- Nippard J
- Swinton PA
- Schoenfeld BJ
year: 2025
venue: PeerJ 13:e18904
doi: 10.7717/peerj.18904
pmid: '39959841'
url: https://pubmed.ncbi.nlm.nih.gov/39959841/
design: rct
population: Resistance-trained adults; within-subject upper-body lengthened partials vs full ROM, 8 wk, ultrasound
sample:
  studies: null
  participants: 30
read_level: full-text
findings:
- claim: In trained lifters, lengthened partial repetitions and full ROM produced equivalent elbow-flexor and elbow-extensor
    growth, with Bayes factors moderately favouring no difference.
  effect: 'Group differences (positive favours full ROM): elbow flexor 45% -0.23 mm (95% CrI -1.4 to 0.94), BF 0.19;
    55% -0.08 mm (-1.1 to 0.90), BF 0.16; elbow extensor 45% 0.40 mm (-1.1 to 1.9), BF 0.20; 55% 0.82 mm (-0.44 to
    2.1), BF 0.39'
  grade: promising
- claim: Lat pulldown 10RM gains were similar whether tested in full or partial ROM.
  effect: 10RM full -1.2 kg (-3.7 to 1.3), BF 0.30; 10RM partial -0.79 kg (-3.9 to 2.3), BF 0.23
  grade: promising
limitations:
- Within-subject (shared systemic and nutritional factors); 8 weeks; ultrasound at two sites; muscles trained were
  the full-ROM 'lengthened' muscles, so both arms reached long lengths.
topics:
