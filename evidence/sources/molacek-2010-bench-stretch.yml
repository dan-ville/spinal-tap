id: molacek-2010-bench-stretch
title: Effects of low- and high-volume stretching on bench press performance in collegiate football players
authors:
- Molacek ZD
- Conley DS
- Evetovich TK
- Hinnerichs KR
year: 2010
venue: J Strength Cond Res 24(3):711-716
doi: 10.1519/JSC.0b013e3181c7c242
pmid: '20145564'
url: https://pubmed.ncbi.nlm.nih.gov/20145564/
design: crossover
population: Resistance-trained NCAA Division II football players, men, 19.9 y (n = 15; bench 1RM ~130 kg)
sample:
  studies: null
  participants: 15
read_level: abstract
findings:
- claim: Low- or high-volume static or PNF stretching of the chest, shoulders and triceps, integrated into a 1RM dynamic
    warm-up, did not change bench press 1RM.
  effect: 1RM no stretch 129.7 +/- 3.3 kg; low-volume PNF 128.9; high-volume PNF 128.3; low-volume static 129.7; high-volume
    static 128.2 kg (all p > 0.05)
  grade: promising
limitations:
- n = 15; stretch volumes given only as 2 vs 5 sets; the printed SDs (~3 kg) look like standard errors.
topics:
- flexibility/acute-performance
