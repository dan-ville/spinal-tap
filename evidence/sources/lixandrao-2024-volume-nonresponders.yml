id: lixandrao-2024-volume-nonresponders
title: Higher resistance training volume offsets muscle hypertrophy nonresponsiveness in older individuals
authors: [Lixandrão ME, Bamman M, Vechin FC, Conceicao MS, Telles G, Longobardi I, Damas F, Lavin KM, Drummer DJ, McAdam JS, Dungan CM, Leitão AE, et al]
year: 2024
venue: J Appl Physiol (1985) 136(2):421-429
doi: 10.1152/japplphysiol.00670.2023
pmid: '38174375'
url: https://pubmed.ncbi.nlm.nih.gov/38174375/
design: rct
population: Older adults 68 +/- 4 y (41 M, 44 F); one leg 1 set, other leg 4 sets of knee extension, 8-15RM, 2x/wk for 10 wk
sample: {studies: null, participants: 85}
read_level: abstract
findings:
- claim: Most older adults did not show hypertrophy beyond MRI error with a single set, but these 'non-responders' did grow and gain strength when the contralateral leg did four sets.
  effect: 51 of 85 non-responders to 1 set (<= 2 x TE = 3.27%); time x set interaction P < 0.05 for qCSA and 1RM in non-responders; responders tended to benefit more from 4 sets (P = 0.08)
  grade: promising
limitations:
- Responder classification from one leg and one period; single isolation exercise; non-responder group defined post hoc on the 1-set leg, so regression to the mean could exaggerate the 4-set advantage.
- The non-responder 'rescue' is a group-level time x set interaction; the follow-up (lixandrao-2025-molecular) defines low responders whose hypertrophy was blunted at both 1 and 4 sets, so not every 1-set non-responder grew with more volume.
topics: [frontiers/individual-response, frontiers/ageing, hypertrophy/volume]
cited_in: [research/theses/strength-and-mobility/chapters/11-frontiers.md]
checked:
  date: 2026-11-24
