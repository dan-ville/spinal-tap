id: knowles-2018-sleep-strength
title: "Inadequate sleep and muscle strength: Implications for resistance training"
authors: [Knowles OE, Drinkwater EJ, Urwin CS, Lamon S, Aisbett B]
year: 2018
venue: "Journal of Science and Medicine in Sport 21(9):959-968"
doi: "10.1016/j.jsams.2018.01.012"
pmid: "29422383"
url: https://pubmed.ncbi.nlm.nih.gov/29422383/
design: systematic-review
population: "Healthy adults exposed to sleep deprivation (no sleep) or restriction (reduced sleep) before resistance exercise"
sample: {studies: 17, participants: null}
read_level: abstract
findings:
  - claim: "A night of total sleep deprivation had little effect on muscle strength during resistance exercise."
    effect: "Qualitative synthesis; no pooled estimate"
    grade: promising
  - claim: "Consecutive nights of sleep restriction could reduce force in multi-joint lifts but not single-joint movements."
    effect: "Qualitative synthesis; studies rated moderate or weak quality (EPHPP)"
    grade: promising
  - claim: "Motivation (group training, caffeine) and training before long wake periods were proposed to offset the effect of inadequate sleep."
    effect: "Author recommendation"
    grade: speculative
limitations:
  - "Seventeen studies of moderate or weak quality; no meta-analysis; hormonal findings conflicting."
topics: [recovery/sleep]
cited_in: [research/theses/strength-and-mobility/chapters/10-recovery-and-nutrition.md, research/theses/strength-and-mobility/notes/recovery-and-nutrition.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Abstract (PubMed) re-read: 17 studies rated moderate or weak (EPHPP); deprivation had little effect on strength; consecutive nights of restriction could reduce multi-joint but not single-joint force; motivation (group training) or caffeine suggested as countermeasures. Confirmed. Full text not open access."}
