checked:
  date: '2026-11-24'
  by: verification pass
  notes: "Abstract re-read; numbers confirmed. Decreases in SP and active SICI are reported as positive SMDs. Resting SICI unchanged (SMD 0.26, -0.29 to 0.81, n = 52). Pooled strength SMD 0.67 (0.41 to 0.94). | Prior check: chapter 2 researcher 2026-11-24"
