id: jones-2013-ratio
title: Performance and neuromuscular adaptations following differing ratios of concurrent strength and endurance training
authors:
- Jones TW
- Howatson G
- Russell M
- French DN
year: 2013
venue: J Strength Cond Res 27(12):3342-3351
doi: 10.1519/JSC.0b013e3181b2cf39
pmid: '24270456'
url: https://pubmed.ncbi.nlm.nih.gov/24270456/
design: rct
population: Men with >2 y resistance-training experience; isolated-limb model, 6 wk, 3 d/wk
sample:
  studies: null
  participants: 24
read_level: abstract
findings:
- claim: A 1:1 strength:endurance ratio blunted isokinetic strength and limb-girth gains compared with strength alone, whereas
    a 3:1 ratio did not.
  effect: ST and CT3 > CT1 and CON for MVC (p<=0.05); ST > CT1 for limb girth (p=0.05)
  grade: promising
limitations:
- Small (n~6/group), short, limb girth is a crude hypertrophy index.
