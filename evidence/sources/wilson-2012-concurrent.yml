- research/theses/strength-and-mobility/notes/concurrent-training.md
checked:
  date: '2026-11-24'
  by: verification pass
  notes: "Earlier: chapter 9 literature researcher. Verification pass (ch 9): PubMed abstract re-read; 21 studies, 422 ES, within-group ES and correlations confirmed. Full text not accessed. Schumann 2022 criticises its unit of analysis."
