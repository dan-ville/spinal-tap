id: bohm-2015-tendon-meta
title: "Human tendon adaptation in response to mechanical loading: a systematic review and meta-analysis of exercise intervention studies on healthy adults"
authors: [Bohm S, Mersmann F, Arampatzis A]
year: 2015
venue: "Sports Med Open 1(1):7"
doi: "10.1186/s40798-015-0009-9"
pmid: "27747846"
url: https://pubmed.ncbi.nlm.nih.gov/27747846/
design: meta-analysis
population: "Healthy adults 18-50 y (237 of 264 male, mostly recreationally active); Achilles and patellar tendons; interventions >=8 wk"
sample: {studies: 27, participants: 264}
read_level: full-text
findings:
  - claim: "Chronic loading increased tendon stiffness, Young's modulus and (less) cross-sectional area; stiffness gains track material more than size."
    effect: "Stiffness SMD 0.70 (95% CI 0.51 to 0.88; 37 interventions; I2 30%); modulus SMD 0.69 (0.36 to 1.03; n=17; I2 57%); CSA SMD 0.24 (0.07 to 0.42; n=33; I2 21%)"
    grade: established
  - claim: "Loading intensity moderated stiffness adaptation; contraction type did not."
    effect: ">70% MVC/RM: SMD 0.90 (0.71 to 1.08; 27 interventions; I2 0%) vs lower intensity SMD 0.04 (-0.46 to 0.53; 5 interventions), p<0.00001; at high intensity isometric SMD 0.95 (0.66 to 1.24), concentric-eccentric 0.82 (0.49 to 1.15), eccentric 1.04 (0.37 to 1.72), p>0.5"
    grade: promising
  - claim: "Interventions of >=12 weeks did not produce significantly larger stiffness gains than 8-12 weeks."
    effect: ">=12 wk SMD 0.91 (0.71 to 1.12; n=23) vs 8-12 wk 0.81 (0.33 to 1.29; n=4), p=0.7"
    grade: promising
limitations:
  - "SMDs are pre-post within-group effects; small samples (6-15 per study); 35 of 37 interventions <=14 weeks; few trained participants."
  - "Only 5 low-intensity interventions, so the intensity contrast rests on a small comparator set."
topics: [connective-tissue/tendon, connective-tissue/loading-parameters]
cited_in: [research/theses/strength-and-mobility/chapters/08-connective-tissue.md, research/theses/strength-and-mobility/notes/connective-tissue.md, research/theses/strength-and-mobility/verification/connective-tissue.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Ch8 verification: Full text (PMC4532714) re-read: 27 studies, 37 interventions, 264 participants; stiffness SMD 0.70 (0.51, 0.88), modulus 0.69 (0.36, 1.03), CSA 0.24 (0.07, 0.42); >70% intensity 0.90 (0.71, 1.08; N=27) vs 0.04 (-0.46, 0.53; N=5); isometric 0.95, con-ecc 0.82, ecc 1.04 confirmed. Pre-post within-group SMDs; mean intervention 12.9 +/- 4.5 wk, so the small CSA effect may partly reflect short durations (authors' caveat). | Prior check: chapter 8 literature researcher"}
