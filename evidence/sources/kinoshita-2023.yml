id: kinoshita-2023
title: Triceps surae muscle hypertrophy is greater after standing versus seated calf-raise training.
authors:
- Kinoshita M
- Maeo S
- Kobayashi Y
- Eihara Y
- Ono M
- Sato M
- Sugiyama T
- Kanehisa H
- Isaka T
year: 2023
venue: Front Physiol 14:1272106
doi: 10.3389/fphys.2023.1272106
pmid: '38156065'
url: https://pubmed.ncbi.nlm.nih.gov/38156065/
design: rct
population: Untrained adults; within-subject standing (knee extended) vs seated (knee flexed) calf raise, 12 wk, MRI
sample:
  studies: null
  participants: 14
read_level: full-text
findings:
- claim: Standing calf raises, which lengthen the gastrocnemius, grew it several-fold more than seated calf raises;
    the soleus (monoarticular) grew similarly in both.
  effect: Lateral gastrocnemius +12.4% vs +1.7%; medial +9.2% vs +0.6%; whole triceps surae +5.6% vs +2.1% (p <= 0.011);
    soleus +2.1% vs +2.9% (p = 0.410)
  grade: promising
limitations:
- n = 14 untrained; within-subject; knee flexion also reduces gastrocnemius force capacity, so length and active force
  are confounded.
topics:
- hypertrophy/muscle-length
- hypertrophy/exercise-selection
cited_in:
- research/theses/strength-and-mobility/chapters/05-hypertrophy-methods.md
- research/theses/strength-and-mobility/notes/hypertrophy-methods.md
