id: head-2026-cars-vs-static
title: Comparison of Controlled Articular Rotations and Static Stretching on Hip Internal Rotation Range of Motion
authors:
- Head PL
- Adkins SP
- Brantley R
- Modrall M
year: 2026
venue: Int J Exerc Sci 19(3):3005
doi: 10.70252/IJES2026305
pmid: '42517070'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13405672/
design: rct
population: Young adults (13 men, 15 women), 21-26 y, with limited hip internal rotation (passive IR <= 35 deg); single
  session of CARs vs static stretching; no non-stretching control
sample:
  studies: null
  participants: 28
read_level: full-text
findings:
- claim: A single session of hip controlled articular rotations (CARs) increased passive hip internal-rotation ROM as
    much as static stretching, with the gain still present 15 minutes later.
  effect: Group x time p = 0.193; group p = 0.536; time p < 0.001 (pre to immediately post and pre to 15 min post both
    p < 0.001; post vs 15 min p = 1.00)
  grade: speculative
limitations:
- Acute only (one session, 15-min follow-up); no non-intervention control, so measurement learning cannot be excluded;
  passive goniometric ROM only; small sample; no strength or active-range outcome.
- Not a test of FRC as a system; it is the only peer-reviewed controlled trial of CARs found (2026-11-24). PubMed phrase
  searches for "controlled articular rotations"[tiab] return 0 despite this record being indexed.
topics:
- mobility/practitioner-systems
- flexibility/acute
