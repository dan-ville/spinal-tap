id: weppler-2010-extensibility
title: 'Increasing muscle extensibility: a matter of increasing length or modifying sensation?'
authors:
- Weppler CH
- Magnusson SP
year: 2010
venue: Phys Ther 90(3):438-449
doi: 10.2522/ptj.20090012
pmid: '20075147'
url: https://pubmed.ncbi.nlm.nih.gov/20075147/
design: narrative-review
population: Review of human stretching studies
sample:
  studies: null
  participants: null
read_level: abstract
findings:
- claim: Length increases during a stretch are viscoelastic and transient; increases in extensibility after single
    sessions and 3-8-week programmes are mostly explained by modified sensation (the sensory theory); effects of programmes
    longer than 8 weeks had not been evaluated.
  effect: Narrative synthesis
  grade: promising
limitations:
- Narrative review; predates ultrasound/elastography trials and recent meta-analyses showing small chronic stiffness
  reductions.
