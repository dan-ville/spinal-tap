id: lasevicius-2018-intensity
title: Effects of different intensities of resistance training with equated volume load on muscle strength and hypertrophy
authors:
- Lasevicius T
- Ugrinowitsch C
- Schoenfeld BJ
- Roschel H
- Tavares LD
- De Souza EO
- Laurentino G
- Tricoli V
year: 2018
venue: European Journal of Sport Science 18(6):772-780
doi: 10.1080/17461391.2018.1450898
pmid: '29564973'
url: https://pubmed.ncbi.nlm.nih.gov/29564973/
design: rct
population: Untrained men, within-subject limbs at 20%, 40%, 60%, 80% 1RM with volume load matched; 12 wk, 2x/wk
sample:
  studies: null
  participants: 30
read_level: abstract
findings:
- claim: With volume load matched, 20% 1RM produced roughly half the hypertrophy of 40-80% 1RM, and 80% 1RM was best
    for strength.
  effect: VL CSA +8.9% (20%) vs +20.5%, +20.4%, +19.5% (40/60/80%); elbow flexors +11.4% vs +25.3%, +25.1%, +25.0%
  grade: promising
limitations:
- Untrained men; within-subject design; very low loads only.
- The 20% 1RM condition was the to-failure condition (3 sets to failure); the 40-80% conditions matched its volume
  load and did not train to failure. Do not cite as evidence that low effort halves growth.
topics:
- hypertrophy/load
- strength/load
- hypertrophy/mechanisms
