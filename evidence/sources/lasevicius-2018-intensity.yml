checked:
  date: '2026-11-24'
  by: verification pass
  notes: 'Ch5 verification: PubMed abstract re-read. Notes misdescribe this study: the 20% 1RM limb trained to failure
    (3 sets) and the 40-80% limbs were volume-load matched to it (so not to failure). It shows a load floor (20% to
    failure about half the growth), not that low effort halves growth. | Ch3 verification: PubMed abstract re-read;
    VL CSA +8.9% (20% 1RM) vs +20.5/20.4/19.5% (40/60/80%) and elbow flexors +11.4% vs ~+25% confirmed; volume-load
    matched, within-subject design. | Earlier check by chapter 3 literature researcher'
