id: zhang-2022-vbt-percentage
title: 'Comparison of Velocity and Percentage-based Training on Maximal Strength: Meta-analysis'
authors: [Zhang M, Tan Q, Sun J, Ding S, Yang Q, Zhang Z, Lu J, Liang X, Li D]
year: 2022
venue: International Journal of Sports Medicine 43(12):981-995
doi: 10.1055/a-1790-8546
pmid: '35255509'
url: https://pubmed.ncbi.nlm.nih.gov/35255509/
design: meta-analysis
population: Athletes (n = 93) and non-athletes (n = 46)
sample: {studies: 7, participants: 139}
read_level: abstract
findings:
- claim: VBT produced a small maximal-strength advantage over percentage-based training, significant only in athletes.
  effect: Overall SMD 0.26 (95% CI 0.03 to 0.49), I2 = 0; athletes SMD 0.35 (0.06 to 0.64), p = 0.02
  grade: contested
limitations: [Seven studies; overlaps with Liao 2021 and Orange 2022 yet reaches a different conclusion (different inclusion and models).]
