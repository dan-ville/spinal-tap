id: lecce-2026-preprint
title: Unilateral resistance training induces greater rate coding adaptations in high-threshold motor
  units during maximal voluntary contractions
authors:
- Lecce E
- Amoruso P
- Del Vecchio A
- Casolo A
- Felici F
- Farina D
- Bazzucchi I
year: 2026
