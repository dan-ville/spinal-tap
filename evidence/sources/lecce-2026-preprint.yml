pmid: null
url: https://doi.org/10.64898/2026.06.26.734811
design: preprint
population: Adults, 4 weeks of unilateral elbow-flexor training
sample:
  studies: null
  participants: null
read_level: abstract
findings:
- claim: Tracking motor units during maximal contractions, unilateral training increased MVC in the trained
    limb and the untrained limb, with higher discharge rates and faster fibre conduction velocity in both
    limbs that were strongly associated with force gains.
  effect: trained limb +16%, untrained limb +8%; R2 > 0.7 for associations with force gains
  grade: speculative
- claim: Discharge-rate increases during MVCs were largest in higher-threshold (higher conduction velocity)
    motor units.
  effect: non-uniform adaptation across the pool, as reported in the abstract
  grade: speculative
limitations:
- Not peer reviewed; sample size not stated in the abstract.
- First method to track units during MVCs; needs replication.
