id: lundberg-2022-fiber-concurrent
title: 'The Effects of Concurrent Aerobic and Strength Training on Muscle Fiber Hypertrophy: A Systematic Review and Meta-Analysis'
authors:
- Lundberg TR
- Feuerbacher JF
- Sünkeler M
- Schumann M
year: 2022
venue: Sports Med 52:2391-2403
doi: 10.1007/s40279-022-01688-x
pmid: '35476184'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9474354/
design: meta-analysis
population: Healthy adults; concurrent vs identical strength training >=4 wk, biopsy fibre CSA (153 CT, 147 ST)
sample:
  studies: 15
  participants: 300
read_level: full-text
findings:
- claim: Concurrent training produced a small attenuation of muscle fibre hypertrophy (type I and II combined).
  effect: SMD -0.23 (95% CI -0.46 to -0.00), p=0.050; I2 = 58.6%
  grade: promising
- claim: The attenuation was mainly in type I fibres and was not significant for type II fibres.
  effect: Type I SMD -0.34 (95% CI -0.72 to 0.04); type II SMD -0.13 (95% CI -0.39 to 0.12)
  grade: promising
- claim: Running-based, but not cycling-based, aerobic training attenuated type I fibre hypertrophy.
  effect: Running type I SMD -0.81 (95% CI -1.26 to -0.36); based on 3 running studies
  grade: speculative
limitations:
- Fibre CSA from biopsies is noisy; only 3 running studies; borderline overall p; fibre-level effects did not translate into
  whole-muscle differences in the parent review.
topics:
- concurrent/interference
- concurrent/hypertrophy
- concurrent/moderators
cited_in:
- research/theses/strength-and-mobility/chapters/09-concurrent-training.md
checked:
  date: '2026-11-24'
  by: verification pass
  notes: "Earlier: chapter 9 literature researcher. Verification pass (ch 9): Europe PMC full text re-read. Overall -0.23 (-0.46 to -0.00, p=0.050), I2 58.6%; type I -0.34 (-0.72 to 0.04, n.s.); type II -0.13 (-0.39 to 0.12); running type I -0.81 (-1.26 to -0.36), 3 studies, confirmed. Type I vs II difference not significant; 'mainly type I' is the authors' reading of point estimates."
