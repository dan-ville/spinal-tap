id: takeuchi-2023-muscle-stiffness
title: 'Long-term static stretching can decrease muscle stiffness: A systematic review and meta-analysis'
authors:
- Takeuchi K
- Nakamura M
- Konrad A
- Mizuno T
year: 2023
venue: Scand J Med Sci Sports 33(8):1294-1306
doi: 10.1111/sms.14402
pmid: '37231582'
url: https://pubmed.ncbi.nlm.nih.gov/37231582/
design: meta-analysis
population: Healthy participants in >=2-week static stretching interventions with muscle stiffness outcomes
sample:
  studies: 10
  participants: null
read_level: abstract
findings:
- claim: Three to 12 weeks of static stretch training moderately decreased muscle stiffness versus control, with
    no relation to total stretching duration.
  effect: ES = -0.749, p < 0.001, I2 = 56.2%; meta-regression on total duration p = 0.881
  grade: promising
limitations:
- Only 10 studies; mixed stiffness measures (MTJ displacement, shear modulus); mostly plantar flexors and hamstrings.
topics:
- flexibility/mechanisms
- flexibility/stiffness
