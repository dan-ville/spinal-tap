  date: 2026-11-24
  by: verification pass
  notes: "Ch3 verification: PubMed abstract re-read; strength ES -0.09 (-0.22 to 0.05), non-equated -0.32 (-0.57 to -0.07), hypertrophy 0.22 (-0.11 to 0.55), trained-subgroup hypertrophy 0.15 (0.03-0.26), 15 studies, all young adults. Confirmed. Full text is on PMC (PMC9068575). | Earlier check by chapter 3 literature researcher"
