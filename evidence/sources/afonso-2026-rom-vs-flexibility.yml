findings:
- claim: 'Range of motion and flexibility are distinct: ROM includes non-modifiable factors (bone, joint shape, body
    contact) and neural control, while flexibility is the trainable soft-tissue component; conflating them misdiagnoses
    ''flexibility deficits''.'
  effect: Conceptual
  grade: convention
- claim: 'Flexibility training need not mean stretching: strength training performed to long muscle lengths improves
    ROM comparably, and stretching has effects beyond flexibility.'
  effect: Conceptual, citing afonso-2021 and alizadeh-2023
  grade: promising
limitations:
- Opinion piece by stretching researchers.
