id: schoenfeld-2016-frequency
title: 'Effects of Resistance Training Frequency on Measures of Muscle Hypertrophy: A Systematic Review and Meta-Analysis'
authors: [Schoenfeld BJ, Ogborn D, Krieger JW]
year: 2016
venue: Sports Medicine 46(11):1689-1697
doi: 10.1007/s40279-016-0543-8
pmid: '27102172'
url: https://pubmed.ncbi.nlm.nih.gov/27102172/
design: meta-analysis
population: Adults without disease, mostly untrained
sample: {studies: 10, participants: null}
read_level: abstract
findings:
- claim: Training a muscle twice rather than once weekly, volume equated, was associated with more hypertrophy.
  effect: Higher vs lower frequency ES 0.49 +/- 0.08 vs 0.30 +/- 0.07, P = 0.002
  grade: contested
limitations:
- Superseded by the authors' 2019 update with more studies, which found no meaningful volume-equated effect.
