id: heinemeier-2013-tendon-14c
title: "Lack of tissue renewal in human adult Achilles tendon is revealed by nuclear bomb (14)C"
authors: [Heinemeier KM, Schjerling P, Heinemeier J, Magnusson SP, Kjaer M]
year: 2013
venue: "FASEB J 27(5):2074-2079"
doi: "10.1096/fj.12-225599"
pmid: "23401563"
url: https://pubmed.ncbi.nlm.nih.gov/23401563/
design: mechanistic
population: "Forensic Achilles tendon core samples (n=28) and skeletal muscle (n=4); donors born 1945-1983"
sample: {studies: null, participants: 28}
read_level: full-text
findings:
  - claim: "The collagen of the adult Achilles tendon core is essentially not renewed after height growth; its 14C content reflects atmospheric levels during roughly the first 17 years of life, whereas muscle turns over continuously."
    effect: "Tendon 14C matched atmosphere decades before sampling; muscle matched ~2 years before sampling"
    grade: established
  - claim: "Earlier estimates of human tendon collagen synthesis (~1%/day from tracer biopsies, implying a ~2-month half-life) conflict with this; the authors attribute the gap to newly made protein that is degraded before incorporation into fibrils, and possibly to higher turnover in the tendon periphery than the core."
    effect: "Tracer-based ~1%/d (half-life ~2 mo) vs racemisation-based half-life approaching 200 y (cited)"
    grade: promising
limitations:
  - "Core samples only, from forensic donors with unknown training history; does not exclude peripheral or non-collagenous turnover; cannot resolve training-induced turnover in athletes."
topics: [connective-tissue/tendon, connective-tissue/time-course]
cited_in: [research/theses/strength-and-mobility/chapters/08-connective-tissue.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Ch8 verification: Full text (PMC3633810) re-read. 28 forensic Achilles core samples, 4 muscle. Tendon 14C matched the atmosphere a median 8 y after birth; the '17 years' figure is the authors' model (formation during height growth, 0-17 y moving average), not a directly measured age. Core samples only; donors' activity unknown; three samples deviated (possible high turnover). Animal work (eLife 2020, rat Achilles) shows faster turnover in the interfascicular matrix than in fascicles. | Prior check: chapter 8 literature researcher"}
