id: bischof-2024-collagen-meta
title: "Impact of Collagen Peptide Supplementation in Combination with Long-Term Physical Training on Strength, Musculotendinous Remodeling, Functional Recovery, and Body Composition in Healthy Adults: A Systematic Review with Meta-analysis"
authors: [Bischof K, Moitzi AM, Stafilidis S, Konig D]
year: 2024
venue: "Sports Med 54(11):2865-2888"
doi: "10.1007/s40279-024-02079-0"
pmid: "39060741"
url: https://pubmed.ncbi.nlm.nih.gov/39060741/
design: meta-analysis
population: "Healthy adults >17 y; RCTs of daily collagen peptides >=8 wk with training"
sample: {studies: 19, participants: 768}
read_level: full-text
findings:
  - claim: "Collagen peptides with training increased tendon CSA but not tendon mechanical properties (stiffness and modulus pooled in one analysis); certainty very low."
    effect: "Tendon morphology SMD 0.67 (95% CI 0.16 to 1.19; 4 studies, 114 participants); tendon mechanical properties SMD 0.05 (-0.38 to 0.48; 4 studies, 111), Egger p=0.01; GRADE very low for both"
    grade: contested
  - claim: "Small effects on fat-free mass and maximal strength were also pooled."
    effect: "FFM SMD 0.48 (0.22 to 0.74; GRADE moderate); maximal strength SMD 0.19 (low)"
    grade: contested
limitations:
  - "Senior author co-authored several included collagen trials; few tendon studies; doses 5-15 g; search Dec 2023 (before several 2024-2025 trials)."
  - "The tendon CSA effect was fragile: excluding Jerger 2023 made it non-significant (p=0.058). Predates the positive 2024-2025 trials (Lee 2025, Nulty 2025)."
topics: [connective-tissue/collagen-supplement]
cited_in: [research/theses/strength-and-mobility/chapters/08-connective-tissue.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Ch8 verification: Full text (PMC11561013) re-read; Table 3: tendon morphology 0.672 (p=0.011), mechanical properties 0.049 (p=0.822), Egger p=0.011; text CI -0.38 to 0.48. Stiffness and Young's modulus were pooled together as 'mechanical properties'. | Prior check: chapter 8 literature researcher"}
