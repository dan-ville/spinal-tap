findings:
- claim: Individual responses should be judged with true-score confidence intervals built from the typical error (from test-retest data) and compared with a pre-specified smallest worthwhile change, rather than by raw pre-post differences.
  effect: Framework; typical-error multiples tabulated for different CI widths and sample sizes
  grade: established
limitations:
- Addresses measurement error but not within-subject variation in response to repeated interventions.
