id: trommelen-2023-protein-dose
title: "The anabolic response to protein ingestion during recovery from exercise has no upper limit in magnitude and duration in vivo in humans"
authors: [Trommelen J, van Lieshout GAA, Nyakayiru J, Holwerda AM, Smeets JSJ, Hendriks FK, van Kranenburg JMX, Zorenc AH, Senden JM, Goessens JPB, Gijsen AP, van Loon LJC]
year: 2023
venue: "Cell Reports Medicine 4(12):101324"
doi: "10.1016/j.xcrm.2023.101324"
pmid: "38118410"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10772463/
design: rct
population: "Healthy recreationally active young men (18-40 y); 60-min whole-body resistance exercise then 0, 25 or 100 g intrinsically labelled milk protein; 12 per group"
sample: {studies: null, participants: 36}
read_level: full-text
findings:
  - claim: "Ingesting 100 g of milk protein after whole-body resistance exercise produced a larger and longer (>12 h) muscle protein synthetic response than 25 g."
    effect: "12-h MPS 100PRO > 25PRO > 0PRO; myofibrillar synthesis ~20% higher at 0-4 h and ~40% higher at 4-12 h with 100 vs 25 g"
    grade: promising
  - claim: "More dietary amino acids were built into muscle with the larger dose, although a smaller fraction of the dose."
    effect: "25 g: 18% of ingested protein incorporated by 12 h (about 4.5 g); 100 g: 13 g (13%), still rising linearly at 12 h"
    grade: promising
  - claim: "Amino acid oxidation and whole-body protein breakdown changed little, contradicting the idea that protein beyond ~20-25 g is simply oxidised."
    effect: "Negligible effect on whole-body breakdown and oxidation; whole-body net balance rose dose-dependently"
    grade: promising
limitations:
  - "Acute tracer study (one meal, 12 h); no long-term hypertrophy outcome."
  - "Milk protein is 80% slow-digesting casein; a fast protein might plateau sooner."
  - "Young men after a whole-body session; responses still rising at 12 h, so the comparison has no tested ceiling."
topics: [nutrition/protein, nutrition/muscle-protein-synthesis]
cited_in: [research/theses/strength-and-mobility/chapters/10-recovery-and-nutrition.md, research/theses/strength-and-mobility/notes/recovery-and-nutrition.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Full text re-read. Confirmed: 36 recreationally active men (exercise 1-3 sessions/week; not resistance-trained); MyoPS ~20% higher 0-4 h and ~40% higher 4-12 h with 100 vs 25 g; incorporation 18% of 25 g vs 13 g (13%) of 100 g. Precision: amino acid oxidation DID rise with 100 g, but the rise was negligible relative to whole-body protein synthesis; whole-body breakdown was little affected. One author (G.A.A. van Loon) is a FrieslandCampina (dairy) employee."}
