id: colenso-semple-2025-mps
title: Menstrual cycle phase does not influence muscle protein synthesis or whole-body myofibrillar proteolysis in response to resistance exercise
authors: [Colenso-Semple LM, McKendry J, Lim C, Atherton PJ, Wilkinson DJ, Smith K, Phillips SM]
year: 2025
venue: J Physiol 603(5):1109-1121
doi: 10.1113/JP287342
pmid: '39630025'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11870050/
design: crossover
population: Healthy eumenorrheic women 18-30 y, no hormonal contraception for >= 6 months; phase confirmed by tracking, urinary LH tests and serum hormones
sample: {studies: null, participants: 12}
read_level: full-text
findings:
- claim: Resistance exercise raised myofibrillar protein synthesis equally in the late follicular and mid-luteal phases, with no phase effect on protein breakdown or circulating metabolome.
  effect: MyoPS follicular 1.33 +/- 0.27 (control) vs 1.52 +/- 0.27 %/d (exercise); luteal 1.28 +/- 0.27 vs 1.46 +/- 0.25 %/d; exercise P < 0.001, phase P = 0.213, interaction P = 0.299; MPB phase P = 0.24
  grade: promising
limitations:
- n = 12; 6-day D2O measurement windows, not long-term hypertrophy; untrained or recreationally active women.
topics: [frontiers/menstrual-cycle, hypertrophy/mechanisms]
