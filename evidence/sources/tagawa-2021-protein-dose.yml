id: tagawa-2021-protein-dose
title: "Dose-response relationship between protein intake and muscle mass increase: a systematic review and meta-analysis of randomized controlled trials"
authors: [Tagawa R, Watanabe D, Ito K, Ueda K, Nakayama K, Sanbongi C, Miyachi M]
year: 2021
venue: "Nutrition Reviews 79(1):66-75"
doi: "10.1093/nutrit/nuaa104"
pmid: "33300582"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7727026/
design: meta-analysis
population: "Adults in RCTs of protein intake, with and without resistance training (sedentary to trained)"
sample: {studies: 105, participants: 5402}
read_level: full-text
findings:
  - claim: "Lean mass rose with protein intake along a curve that flattened above about 1.3 g/kg/day but did not plateau."
    effect: "Per +0.1 g/kg/day: +0.39 kg (95% CI 0.36 to 0.41) below 1.3 g/kg/day and +0.12 kg (0.11 to 0.14) above it"
    grade: promising
limitations:
  - "Pools untrained, sedentary and older populations; authors employed by a dairy company (Meiji); lean mass mostly by DXA/BIA."
topics: [nutrition/protein]
cited_in: [research/theses/strength-and-mobility/chapters/10-recovery-and-nutrition.md, research/theses/strength-and-mobility/notes/recovery-and-nutrition.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Full text (Europe PMC XML) read: 105 articles, 5,402 participants; +0.39 kg (0.36 to 0.41) and +0.12 kg (0.11 to 0.14) LBM per 0.1 g/kg/day below and above 1.3 g/kg/day (multivariate spline, model 2); the decline above 1.3 'was markedly suppressed by resistance training'; five authors are Meiji Co employees. Confirmed. A companion strength meta-analysis (Tagawa 2022, Sports Med Open, PMID 36057893) found strength gains with RT rose 0.72% per 0.1 g/kg/day up to ~1.5 g/kg/day and then plateaued. | Earlier note (chapter 10 literature researcher): Online 2020, print 2021"}
