id: lundberg-2024-vo2max-recovery
title: Relationship between maximal oxygen uptake, within-set fatigue and between-set recovery during resistance exercise
  in resistance-trained men and women
authors:
- Lundberg TR
- Larsson G
- Alstermark R
year: 2024
venue: BMC Sports Sci Med Rehabil 16:45
doi: 10.1186/s13102-024-00830-8
pmid: '38347629'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10863198/
design: cross-sectional
population: Resistance-trained men and women (14 + 14), 27 y
sample:
  studies: null
  participants: 28
read_level: full-text
findings:
- claim: VO2max was only weakly related to within-set fatigue and between-set recovery in squats (3 sets to failure, 90 s
    rest) and isokinetic knee extensions.
  effect: 'VO2max as covariate: P 0.312-0.998; R 0.005-0.604'
  grade: promising
limitations:
- Cross-sectional, n=28; narrow VO2max range in a lifting population; short protocols.
topics:
- conditioning/aerobic
- conditioning/recovery
cited_in:
- research/theses/strength-and-mobility/chapters/09-concurrent-training.md
- research/theses/strength-and-mobility/notes/concurrent-training.md
checked:
  date: '2026-11-24'
  by: verification pass
  notes: "Earlier: chapter 9 literature researcher. Verification pass (ch 9): Europe PMC full text re-read; n=28 (14+14), squats 3 x to failure at 70% 1RM, 90 s rest; P 0.312-0.998, R up to 0.604, confirmed. With n=14 per sex, R ~0.6 non-significant means underpowered, not 'no relation'. Contrary earlier data: Ratamess 2014 (PMID 24714546), VO2max correlated with squat reps at short rest (r=0.43-0.57)."
