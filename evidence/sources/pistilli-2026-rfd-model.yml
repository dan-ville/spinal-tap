findings:
- claim: A simulation predicts large acute reductions in maximal RFD after aerobic exercise in weightlifters.
  effect: Model-predicted maximal RFD reduction ~70% after <10 min aerobic exercise, ~80% after >10 min
  grade: speculative
limitations:
- Theoretical model, not measured data; predicted magnitudes far exceed measured acute losses (e.g. -17% peak RFD 10 min after
  HIIT in Petré 2024).
