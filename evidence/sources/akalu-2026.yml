design: rct
population: Resistance-training-naive adults; single session, three arms
sample:
  studies: null
  participants: 36
read_level: abstract
findings:
- claim: A single bout of metronome-paced training acutely raised corticospinal excitability and reduced
    intracortical inhibition, whereas self-paced training raised ipsilateral MEP ratio and startle-cued
    early RFD, interpreted as acute reticulospinal engagement.
  effect: MP-RT CSE +50% at 5 min, +72% at 30 min; SP-RT ICAR +48%, startle RFD0-50 +60% at 30 min (P
    = 0.039)
  grade: speculative
limitations:
- Acute responses, not training adaptations; indirect reticulospinal measures; 12 per group.
