id: schoenfeld-2017-volume
title: 'Dose-response relationship between weekly resistance training volume and increases in muscle mass: A systematic review and meta-analysis'
authors: [Schoenfeld BJ, Ogborn D, Krieger JW]
year: 2017
venue: Journal of Sports Sciences 35(11):1073-1082
doi: 10.1080/02640414.2016.1210197
pmid: '27433992'
url: https://pubmed.ncbi.nlm.nih.gov/27433992/
design: meta-analysis
population: Healthy adults, trained and untrained
sample: {studies: 15, participants: null}
read_level: abstract
findings:
- claim: Each additional weekly set per muscle was associated with greater hypertrophy in a graded dose-response.
  effect: Each additional set associated with ES increase of 0.023, corresponding to +0.37% gain (P = 0.002); 34 treatment groups from 15 studies
  grade: established
- claim: Higher- vs lower-volume groups within studies differed by about 4 percentage points of growth.
  effect: ES difference 0.241 (percentage-gain difference 3.9%), P = 0.03; three-level categories (<5, 5-9, 10+ sets) trend P = 0.074
  grade: promising
limitations:
- Few studies above 10 sets/week at the time; mixed training status; percentage gains derived from mixed measures.
topics: [hypertrophy/volume]
cited_in: [research/theses/strength-and-mobility/chapters/03-dose-response.md, research/theses/strength-and-mobility/notes/dose-response.md]
checked:
  date: 2026-11-24
  by: verification pass
