doi: 10.1152/ajpcell.00692.2024
pmid: '39545617'
url: https://pubmed.ncbi.nlm.nih.gov/39545617/
design: cohort
population: Physically active adults immobilised 6 wk after Achilles tendon rupture
sample:
  studies: null
  participants: 6
read_level: abstract
findings:
- claim: Myonuclei were not lost from gastrocnemius fibres after 6 weeks of immobilisation, consistent with myonuclear
    permanence in humans; volume per myonucleus fell 20%.
  effect: Myonuclear domain -20% (P = 0.008); no myonuclear loss
  grade: promising
limitations:
- n = 6; injury model, not training/detraining.
