id: refalo-2025-failure-perception
title: The Effect of Proximity-To-Failure on Perceptual Responses to Resistance Training
authors: [Refalo MC, Helms ER, Hamilton DL, Fyfe JJ]
year: 2025
venue: European Journal of Sport Science 25(3):e12266
doi: 10.1002/ejsc.12266
pmid: '39960821'
url: https://pubmed.ncbi.nlm.nih.gov/39960821/
design: rct
population: Same trained cohort as Refalo 2024 (12 males, 6 females), 8 wk
sample: {studies: null, participants: 18}
read_level: abstract
findings:
- claim: Training to failure was more uncomfortable and less pleasant than stopping at 1-2 RIR, at equal hypertrophy.
  effect: Perceived discomfort 5.1 (HDI 4.2-6.0) FAIL vs 4.1 (3.2-5.1) RIR; session RPE 5.4 vs 4.3; feeling scale 0.3 vs 1.2
  grade: promising
limitations:
- Small sample; perceptual scales.
topics: [hypertrophy/proximity-to-failure, adherence/perception]
