id: oborn-2025
title: 'The effect of blood flow restricted exercise on measures of health and physical fitness across all populations:
  An umbrella review and meta-meta-analysis.'
authors:
- Oborn C
- Nelson MJ
- Davison K
- Murray J
- Green K
- Shahid J
- Bennett H
year: 2025
venue: Sports Med Health Sci 7(6):419-431
doi: 10.1016/j.smhs.2025.02.011
pmid: '41496806'
url: https://pubmed.ncbi.nlm.nih.gov/41496806/
design: umbrella-review
population: Meta-analyses of BFR exercise across populations
sample:
  studies: 47
  participants: null
read_level: full-text
findings:
- claim: Across meta-analyses, BFR training produced more hypertrophy than low-load training without BFR and similar
    hypertrophy to high-load training, but less strength than high-load training.
  effect: vs low load SMD 0.39 (95% CI 0.23 to 0.54); vs high load -0.13 (-0.30 to 0.05); strength vs high load -0.28
    (p < 0.001)
  grade: established
- claim: Hypertrophy responses were larger in young adults than in athletes, older adults and clinical groups.
  effect: Subgroup analysis (Table 1)
  grade: promising
limitations:
- All included reviews rated low-to-moderate quality (AMSTAR-2); 265 unique studies.
