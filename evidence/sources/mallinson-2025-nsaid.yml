id: mallinson-2025-nsaid
title: "NSAID ingestion augments training-induced muscle hypertrophy and differentially affects muscle mRNA expression, but not strength gains, in trained men"
authors: [Mallinson JE, Taylor T, Constantin-Teodosiu D, Constantin D, Franchi MV, Auer D, Greenhaff PL]
year: 2025
venue: "Journal of Physiology (online ahead of print 2025-10-26)"
doi: "10.1113/JP289542"
pmid: "41139248"
url: https://pubmed.ncbi.nlm.nih.gov/41139248/
design: rct
population: "Resistance-trained young men (24.5 y); placebo (n = 8) vs diclofenac 75 mg/day (n = 9) for 12 wk; 3 x 30 maximal isokinetic knee extensions, 3 d/wk, one leg"
sample: {studies: null, participants: 17}
read_level: abstract
findings:
  - claim: "In trained men, a daily NSAID (diclofenac) during 12 weeks of resistance training increased quadriceps hypertrophy without changing strength gains."
    effect: "Quadriceps CSA at 84 days +8.6 +/- 5.3% (NSAID) vs +3.9 +/- 0.8% (placebo), NSAID vs placebo P = 0.038 (MRI); isometric strength +40-50% in both groups, no group difference"
    grade: speculative
limitations:
  - "Very small groups; unilateral isokinetic training; diclofenac, not ibuprofen; abstract only."
  - "Direction opposite to Lilja 2018 (ibuprofen 1,200 mg/day in untrained adults), so NSAID effects on adaptation are contested."
topics: [recovery/anti-inflammatories]
