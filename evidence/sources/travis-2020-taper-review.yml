id: travis-2020-taper-review
title: 'Tapering and Peaking Maximal Strength for Powerlifting Performance: A Review'
authors: [Travis SK, Mujika I, Gentles JA, Stone MH, Bazyler CD]
year: 2020
venue: Sports (Basel) 8(9):125
doi: 10.3390/sports8090125
pmid: '32917000'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7552788/
design: systematic-review
population: Taper and training-cessation studies in powerlifters, weightlifters, throwers, strongman and strength-trained subjects
sample: {studies: null, participants: null}
read_level: full-text
findings:
- claim: For powerlifting, the evidence supports cutting volume by ~30-70% (smaller cuts of ~30-50% looked better for squat and bench), keeping intensity high (>=85% 1RM) or reducing it in the final days, over a 1-2 week step or exponential taper, followed by 2-7 days of training cessation.
  effect: Synthesis of 7 taper studies (volume cuts 31.6-71.9%; 7-28 days) and 9 cessation studies
  grade: promising
- claim: Short cessation (<=7 days) maintained or improved strength, while cessation >7 days reduced maximal strength.
  effect: Squat +1.7-4.9% (2.0-5.5 kg) and bench +1.4-4.9% (1.3-5.5 kg) after <=7 days; -1 to -4% after >7 days
  grade: promising
limitations: ['Few, small studies in powerlifters (n = 33 across 2 taper studies); TESTEX-rated; no pooling.', 'The <=7-day cessation gains (squat +1.7-4.9%, bench +1.4-4.9%) are within-study pre-post changes after tapers, not isolated effects of cessation; the >7-day 1-4% losses come from few studies (e.g., Hortobagyi 14-day decline not statistically significant).']
topics: [programming/taper, strength/detraining]
cited_in: [research/theses/strength-and-mobility/chapters/04-programming-and-periodization.md, research/theses/strength-and-mobility/notes/programming-and-periodization.md]
