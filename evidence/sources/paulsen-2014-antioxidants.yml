id: paulsen-2014-antioxidants
title: "Vitamin C and E supplementation hampers cellular adaptation to endurance training in humans: a double-blind, randomised, controlled trial"
authors: [Paulsen G, Cumming KT, Holden G, Hallen J, Ronnestad BR, Sveen O, Skaug A, Paur I, Bastani NE, Ostgaard HN, Buer C, Midttun M, Freuchen F, Wiig H, Ulseth ET, Garthe I, Blomhoff R, Benestad HB, Raastad T]
year: 2014
venue: "Journal of Physiology 592(8):1887-1901"
doi: "10.1113/jphysiol.2013.267419"
pmid: "24492839"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4001759/
design: rct
population: "Young men and women; 11 wk endurance training; 1000 mg vitamin C + 235 mg vitamin E vs placebo"
sample: {studies: null, participants: 54}
read_level: abstract
findings:
  - claim: "High-dose vitamins C and E blocked training-induced rises in mitochondrial biogenesis markers without changing VO2max gains, illustrating that reactive oxygen species act as adaptive signals."
    effect: "COX4 +59 +/- 97% (placebo) vs -13 +/- 54% (vitamins); PGC-1alpha +19 +/- 51% vs -13 +/- 29% (P <= 0.03); VO2max +8% both"
    grade: promising
limitations:
  - "Endurance training, not resistance training; molecular markers only."
topics: [recovery/antioxidants]
