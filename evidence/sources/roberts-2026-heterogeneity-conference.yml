  date: 2026-11-24
  by: verification pass
  notes: "Ch11 verification: PMC author manuscript retrieved via NCBI efetch (PMC13322123) and searched. Ribosome biogenesis and satellite cells, rDNA copy number, ECM, FAMuSS 2 of ~500 SNPs, GLI3 1 of >315,000 SNPs in 119 men, >100,000 for a robust PGS, heritability ~30-70+%, chronological age statement: confirmed. Corrected: the hormone-receptor null refers to Roberts/Libardi data on muscle sex-hormone receptor content or DNA binding; other work (morton-2018-androgen-receptor; baseline cytoplasmic AR in bergamasco-2024-androgen-receptor) links baseline AR content to hypertrophy. Practitioner advice is 'not place undue weight' on genetic tests. The summary cites yang-2024-gwas's 47% as support for polygenic scores (with a liberal-threshold caveat), not as overfit. | Earlier check (chapter 11 literature researcher): no notes"
