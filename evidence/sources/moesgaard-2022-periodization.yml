id: moesgaard-2022-periodization
title: 'Effects of Periodization on Strength and Muscle Hypertrophy in Volume-Equated Resistance Training Programs: A Systematic Review and Meta-analysis'
authors: [Moesgaard L, Beck MM, Christiansen L, Aagaard P, Lundbye-Jensen J]
year: 2022
venue: Sports Medicine 52(7):1647-1666
doi: 10.1007/s40279-021-01636-1
pmid: '35044672'
url: https://pubmed.ncbi.nlm.nih.gov/35044672/
design: meta-analysis
population: Healthy adults, trained and untrained, in volume-equated periodized vs non-periodized or LP vs UP trials
sample: {studies: 35, participants: null}
read_level: abstract
findings:
- claim: With volume equated, periodized training produced slightly larger 1RM gains than non-periodized training.
  effect: ES 0.31 (95% CI 0.04 to 0.57); Z = 2.28, P = 0.02
  grade: contested
- claim: Periodization did not change muscle hypertrophy relative to non-periodized training.
  effect: ES 0.13 (95% CI -0.10 to 0.36), P = 0.27
  grade: promising
- claim: Undulating periodization gave larger 1RM gains than linear periodization overall, but only in trained participants.
  effect: UP vs LP ES 0.31 (95% CI 0.02 to 0.61), P = 0.04; trained ES 0.61 (0.00 to 1.22), P = 0.05; untrained ES 0.06 (-0.20 to 0.31), P = 0.67
  grade: speculative
- claim: Hypertrophy did not differ between linear and undulating periodization.
  effect: ES 0.05 (95% CI -0.20 to 0.29), P = 0.72
  grade: promising
limitations:
- Non-periodized comparators are mostly constant-load programs, so the contrast is variation vs monotony, not planned vs unplanned variation (Afonso 2019 critique).
- Trained-only UP advantage rests on a CI touching zero; studies are short (mostly <=12 wk) and small.
- Full text not reachable (publisher host blocked); heterogeneity, risk of bias and study durations not verified here.
- The trained-only UP advantage is not reproduced by the larger Zhang Z 2026 synthesis, whose training-experience subgroups show no LP-UP difference in trained participants (upper body SMD 0.03, -0.34 to 0.40, 12 studies; squat SMD -0.02, -0.22 to 0.18, 15 studies).
topics: [programming/periodization, strength/periodization, hypertrophy/periodization]
cited_in: [research/theses/strength-and-mobility/chapters/04-programming-and-periodization.md, research/theses/strength-and-mobility/notes/programming-and-periodization.md]
