id: sale-1990-concurrent
title: Interaction between concurrent strength and endurance training
authors:
- Sale DG
- MacDougall JD
- Jacobs I
- Garner S
year: 1990
venue: J Appl Physiol 68(1):260-270
doi: 10.1152/jappl.1990.68.1.260
pmid: '2312468'
url: https://pubmed.ncbi.nlm.nih.gov/2312468/
design: rct
population: Young men and women (n=16), within-subject one-leg design, 22 wk
sample:
  studies: null
  participants: 16
read_level: abstract
findings:
- claim: With moderate volumes (3 d/wk) and 'hybrid' protocols (high-rep leg press; 3-min intervals at 90-100% VO2max), concurrent
    training did not interfere with strength or endurance development.
  effect: e.g. leg press 1RM E 20% vs E+S 34%; knee extensor area E 14% vs E+S 21%
  grade: promising
limitations:
- Small, untrained, leg-press 15-20RM strength protocol; within-subject design may allow cross-over effects.
