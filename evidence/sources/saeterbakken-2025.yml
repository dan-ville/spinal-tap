id: saeterbakken-2025
title: 'Task Specificity of Dynamic Resistance Training and Its Transferability to Non-trained Isometric Muscle
  Strength: A Systematic Review with Meta-analysis.'
authors:
- Saeterbakken AH
- Stien N
- Paulsen G
- Behm DG
- Andersen V
- Solstad TEJ
- Prieske O
year: 2025
venue: Sports Med 55(7):1651-1676
doi: 10.1007/s40279-025-02225-2
pmid: '40314751'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12296774/
design: meta-analysis
population: Healthy 16-60 y, untrained and trained; dynamic RT with both dynamic and isometric tests
sample:
  studies: 43
  participants: 1660
read_level: full-text
findings:
- claim: Dynamic resistance training improved dynamic strength about twice as much as non-trained isometric strength.
  effect: Dynamic SMD 0.98 (95% CI 0.91 to 1.06; I2 = 67%); isometric SMD 0.42 (95% CI 0.35 to 0.49; I2 = 4%); 72
    interventions
  grade: established
- claim: The task-specificity gap persisted in resistance-trained participants, who showed the smallest effects
    for both outcomes.
  effect: 'Trained: dynamic SMD 0.75, isometric SMD 0.29'
  grade: promising
- claim: Neither hypertrophy nor changes in muscle activity predicted dynamic or isometric strength gains in meta-regression.
  effect: P >= 0.222
  grade: contested
limitations:
- None of the included studies were designed to compare dynamic and isometric transfer; within-group pre-post SMDs;
  risk-of-bias tool non-standard (Brughelli scale).
- Meta-regression on study-level hypertrophy is weak for detecting individual-level mechanisms.
- "Pre-to-post within-group SMDs; lack of a control group was the most common unmet quality criterion, so absolute SMDs are inflated, though the dynamic-vs-isometric contrast within the same participants is unaffected."
topics:
