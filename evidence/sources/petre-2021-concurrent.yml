id: petre-2021-concurrent
title: 'Development of Maximal Dynamic Strength During Concurrent Resistance and Endurance Training in Untrained, Moderately
  Trained, and Trained Individuals: A Systematic Review and Meta-analysis'
authors:
- Petré H
- Hemmingsson E
- Rosdahl H
- Psilander N
year: 2021
venue: Sports Med 51:991-1010
doi: 10.1007/s40279-021-01426-9
pmid: '33751469'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8053170/
design: meta-analysis
population: Adults 20-38 y (523 men, 227 women); 7 untrained, 10 moderately trained, 10 trained studies; lower-body 1RM
sample:
  studies: 27
  participants: 750
read_level: full-text
findings:
- claim: Concurrent training blunted lower-body 1RM gains in trained individuals but not in untrained or moderately trained
    individuals.
  effect: Trained ES -0.35 (95% CI -0.59 to -0.11), p<0.01; moderately trained -0.20 (95% CI -0.42 to 0.02), p=0.08; untrained
    0.03 (95% CI -0.29 to 0.35)
  grade: contested
- claim: In trained individuals the deficit appeared only when both modes were done in the same session (<20 min apart), not
    when separated by >2 h.
  effect: Same session ES -0.66 (95% CI -1.08 to -0.25), p<0.01; different sessions ES -0.10 (95% CI -0.43 to 0.23), p=0.55
  grade: promising
limitations:
- Studies with several CT arms and one control entered more than once (Schumann 2022 notes this may inflate power).
- Trained category dominated by running (14/15 interventions) and interval training (11/15), confounding status with modality
  and intensity.
- Most studies <12 wk with n<10 per group; PEDro filter only (scores 5-10); no GRADE.
topics:
- concurrent/training-status
- concurrent/moderators
cited_in:
- research/theses/strength-and-mobility/chapters/09-concurrent-training.md
- research/theses/strength-and-mobility/notes/concurrent-training.md
checked:
  date: '2026-11-24'
  by: verification pass
  notes: "Earlier: chapter 9 literature researcher. Verification pass (ch 9): Europe PMC full text re-read. Trained -0.35 (-0.59 to -0.11); moderately trained -0.20 (-0.42 to 0.02); untrained 0.03 (-0.29 to 0.35); trained same-session -0.66 (-1.08 to -0.25) vs >2 h -0.10 (-0.43 to 0.23); trained category 14/15 running and 11/15 interval, all confirmed. 'Trained' = >=3 months of structured (resistance or endurance) training, not strength athletes."
