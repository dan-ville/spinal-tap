pmid: '37015016'
url: https://pubmed.ncbi.nlm.nih.gov/37015016/
design: rct
population: Young women; calf raise full vs initial (dorsiflexed) vs final ROM, 8 wk
sample:
  studies: null
  participants: 42
read_level: abstract
findings:
- claim: Calf raises in the initial, dorsiflexed (long-length) part of the range grew the gastrocnemius about twice
    as much as full ROM or the final (plantarflexed) part.
  effect: Medial gastrocnemius +15.2% (initial) vs +6.7% (full) and +3.4% (final), p <= 0.009; lateral +14.9% vs +7.3%
    (full, p = 0.060) vs +6.2% (final)
  grade: promising
limitations:
- Untrained women; ultrasound thickness; one machine.
