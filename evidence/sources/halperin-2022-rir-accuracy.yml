id: halperin-2022-rir-accuracy
title: 'Accuracy in Predicting Repetitions to Task Failure in Resistance Exercise: A Scoping Review and Exploratory Meta-analysis'
authors: [Halperin I, Malleron T, Har-Nir I, Androulakis-Korakakis P, Wolf M, Fisher J, Steele J]
year: 2022
venue: Sports Medicine 52(2):377-390
doi: 10.1007/s40279-021-01559-x
pmid: '34542869'
url: https://pubmed.ncbi.nlm.nih.gov/34542869/
design: meta-analysis
population: Healthy participants predicting reps to task failure
sample: {studies: 12, participants: 414}
read_level: full-text
findings:
- claim: Lifters underpredict reps to failure by about one rep on average, with better accuracy close to failure and in sets of 12 or fewer reps.
  effect: Underprediction 0.95 reps (95% CI 0.17 to 1.73); heterogeneity I2 ~97.9%; <=12 reps beta 0.06 (0.04 to 0.09) vs >12 reps 0.47 (0.44 to 0.49)
  grade: promising
- claim: Training status did not moderate the accuracy of predicting reps to failure, and between-participant variation in accuracy was small.
  effect: Training status beta = -0.006 reps (95% CI -0.02 to 0.007); between-participant SD 1.45 reps (0.99 to 2.12); upper vs lower body -0.58 reps (-2.32 to 1.16)
  grade: promising
- claim: Accuracy improved slightly when predictions were made closer to failure and in later sets.
  effect: Closer to failure beta = -0.025 (95% CI -0.05 to 0.0014); set number beta = -0.07 reps (-0.14 to -0.005)
  grade: promising
limitations: [Very high heterogeneity; exploratory., 'Pooled 262 effects from 12 clusters; how task failure was explained and confirmed varied between studies, a likely source of the I2 ~98%.', 'Numbers read from the SportRxiv preprint version (June 2021), which matches the published abstract.']
topics: [methods/measurement, strength/proximity-to-failure, methods/rpe-rir, programming/autoregulation]
cited_in: [research/theses/strength-and-mobility/chapters/03-dose-response.md, research/theses/strength-and-mobility/chapters/04-programming-and-periodization.md, research/theses/strength-and-mobility/notes/dose-response.md, research/theses/strength-and-mobility/notes/programming-and-periodization.md]
