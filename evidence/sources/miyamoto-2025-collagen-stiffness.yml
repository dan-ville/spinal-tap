title: "Collagen Peptide Supplementation Enhances Muscle-Tendon Stiffness and Explosive Strength: A 16-wk Randomized Controlled Trial"
authors: [Miyamoto N, Ishihara K, Oshima T, Kawai M, Oritani Y, Iemoto N]
year: 2025
