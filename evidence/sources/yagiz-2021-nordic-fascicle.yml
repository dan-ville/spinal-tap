id: yagiz-2021-nordic-fascicle
title: 'Heterogeneous effects of eccentric training and nordic hamstring exercise on the biceps femoris fascicle length
  based on ultrasound assessment and extrapolation methods: A systematic review of randomised controlled trials with
  meta-analyses'
authors:
- Yagiz G
- Akaras E
- Kubis HP
- Owen JA
year: 2021
venue: PLoS One 16(11):e0259821
doi: 10.1371/journal.pone.0259821
pmid: '34752499'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8577763/
design: meta-analysis
population: RCTs of eccentric hamstring training vs non-training controls in healthy, mostly recreationally active
  or athletic adults
sample:
  studies: 8
  participants: null
read_level: full-text
findings:
- claim: 'The estimated effect of eccentric training on biceps femoris fascicle length depends on the measurement
    method: small with manual linear extrapolation, moderate with panoramic ultrasound, large with trigonometric equations.'
  effect: Eccentric training g = 0.29 (95% CI -0.26 to 0.85) MLE; 0.72 (0.17 to 1.28) panoramic; 2.20 (0.99 to 3.41)
    trigonometric; GRADE very low to low
  grade: promising
- claim: For the Nordic hamstring exercise specifically, only the trigonometric-equation estimate was clearly positive;
    panoramic and manual-extrapolation estimates had confidence intervals spanning zero.
  effect: NHE g = 0.23 (-1.02 to 1.47) MLE; 0.38 (-0.50 to 1.27) panoramic; 1.98 (0.52 to 3.44) trigonometric
  grade: contested
limitations:
- Few trials per method subgroup; low and very low GRADE certainty; recreational populations.
- Earlier pooled estimates (Cuthbert 2020 g >= 2.58, Medeiros 2020 ES 0.97, Gerard 2020 +1.97 cm) mixed methods; Franchi
  et al. showed single-image equations overestimate BF fascicle length versus panoramic imaging.
topics:
