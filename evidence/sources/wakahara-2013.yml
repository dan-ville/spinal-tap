- Fukutani A
- Kawakami Y
- Yanai T
year: 2013
venue: Med Sci Sports Exerc 45(11):2158-65
doi: 10.1249/MSS.0b013e3182995349
pmid: '23657165'
url: https://pubmed.ncbi.nlm.nih.gov/23657165/
design: cohort
population: Young men; 12 wk multijoint elbow-extensor training; MRI T2 after first session and CSA along the muscle
sample:
  studies: null
  participants: 12
read_level: abstract
findings:
- claim: Regions of the triceps most activated (by T2 mapping) in the first session were the regions that grew most
    over 12 weeks, linking nonuniform hypertrophy to regional activation.
  effect: Higher activated area and larger CSA change in middle vs most proximal regions
  grade: promising
limitations:
- Correlational; one exercise; T2 is an indirect activation index.
