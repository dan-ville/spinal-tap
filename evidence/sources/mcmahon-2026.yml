id: mcmahon-2026
title: Moderate Intensity Resistance Training With Partial Range-of-Motion at Long Muscle Lengths Elicits Similar
  Hypertrophy and Architectural Adaptations as High Intensity Resistance Training Using Full Range-of-Motion.
authors:
- McMahon G
- Morse C
- Burden A
- Winwood K
- Onambele-Pearson G
year: 2026
venue: J Strength Cond Res 40(12):1493-1505
doi: 10.1519/JSC.0000000000005561
pmid: '42392615'
url: https://pubmed.ncbi.nlm.nih.gov/42392615/
design: rct
population: 'Adults (training status per full text); knee extensors: shortened partial (0-50 deg, 80% 1RM) vs lengthened
  partial (40-90 deg, 55% 1RM) vs full ROM (80%) vs control, 8 wk'
sample:
  studies: null
  participants: 45
read_level: abstract
findings:
- claim: Lengthened partials at a moderate load grew the vastus lateralis as much as full-ROM heavy training and more
    than shortened partials at distal and proximal sites.
  effect: Delta MT greater for LP and FROM vs SP at 75%; LP > SP at 25%; no LP vs FROM differences (p < 0.05 thresholds)
  grade: promising
- claim: Lengthened partials increased fascicle length more than full ROM or shortened partials.
  effect: Delta Lf LP > FROM at 25% and 75%; LP > SP at all sites
  grade: promising
limitations:
- Loads differed between groups by design; fascicle length by ultrasound, likely extrapolated; about 11 per group.
