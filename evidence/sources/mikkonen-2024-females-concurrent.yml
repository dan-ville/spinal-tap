id: mikkonen-2024-females-concurrent
title: 'Perspectives on Concurrent Strength and Endurance Training in Healthy Adult Females: A Systematic Review'
authors:
- Mikkonen RS
- Ihalainen JK
- Hackney AC
- Häkkinen K
year: 2024
venue: Sports Med 54:673-696
doi: 10.1007/s40279-023-01955-5
pmid: '37948036'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10978686/
design: systematic-review
population: Healthy females 18-50 y, interventions >=8 wk
sample:
  studies: 14
  participants: null
read_level: full-text
findings:
- claim: Concurrent training increased strength and endurance in women, but no included study was designed to test an interference
    effect, and menstrual status and fast-force production were rarely addressed.
  effect: Narrative synthesis of 14 studies; quality low to moderate
  grade: promising
limitations:
- Narrative; single-mode control groups often absent; cannot quantify interference in women.
