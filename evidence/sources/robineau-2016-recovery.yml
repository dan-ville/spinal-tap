id: robineau-2016-recovery
title: Specific Training Effects of Concurrent Aerobic and Strength Exercises Depend on Recovery Duration
authors:
- Robineau J
- Babault N
- Piscione J
- Lacome M
- Bigard AX
year: 2016
venue: J Strength Cond Res 30(3):672-683
doi: 10.1519/JSC.0000000000000798
pmid: '25546450'
url: https://pubmed.ncbi.nlm.nih.gov/25546450/
design: rct
population: Amateur rugby players, 7 wk; groups C-0h, C-6h, C-24h, strength-only, control
sample:
  studies: null
  participants: 58
read_level: abstract
findings:
- claim: Maximal strength gains (bench press, half squat) were lower when aerobic work followed strength immediately (0 h)
    than with 6 h or 24 h between, and 24 h also gave the best VO2peak gains.
  effect: Magnitude-based inference; C-0h < C-6h, C-24h and STR for 1RM gains; VO2peak change C-24h > C-0h and C-6h
  grade: promising
limitations:
- Magnitude-based inference; ~12 per group; strength always performed first; 7 weeks.
topics:
- concurrent/timing
cited_in:
- research/theses/strength-and-mobility/chapters/09-concurrent-training.md
checked:
  date: '2026-11-24'
  by: verification pass
  notes: "Earlier: chapter 9 literature researcher. Verification pass (ch 9): PubMed abstract re-read; confirmed. Note C-6h was still inferior to C-24h/STR for MVC at 180 deg/s and VO2peak change; authors recommend >=6 h. Amateur rugby players with a strength-only arm: a trained-athlete RT-controlled trial besides Gomes."
