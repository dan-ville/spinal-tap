  participants: null
read_level: abstract
findings:
- claim: Strength-trained people generally show greater maximal voluntary activation, lower activity in
    submaximal tasks and lower antagonist co-contraction, though methods vary widely.
  effect: qualitative synthesis of 20 cross-sectional studies
  grade: contested
limitations:
- Surface EMG amplitude in trained people is confounded by muscle size (skarabot-2021-emg); heterogeneous
  processing.
