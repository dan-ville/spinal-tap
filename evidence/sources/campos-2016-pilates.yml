findings:
- claim: In healthy adults, Pilates improved abdominal muscular endurance versus no exercise, but the pooled flexibility
    effect was not significant.
  effect: Abdominal endurance MD 9.53% (95% CI 2.41 to 16.43), p = 0.009; flexibility MD 4.97 (-0.53 to 10.47), p
    = 0.08
  grade: promising
