id: schoenfeld-2019-volume-trained
title: Resistance Training Volume Enhances Muscle Hypertrophy but Not Strength in Trained Men
authors:
- Schoenfeld BJ
- Contreras B
- Krieger J
- Grgic J
- Delcastillo K
- Belliard R
- Alto A
year: 2019
venue: Medicine and Science in Sports and Exercise 51(1):94-103
doi: 10.1249/MSS.0000000000001764
pmid: '30153194'
url: https://pubmed.ncbi.nlm.nih.gov/30153194/
design: rct
population: Resistance-trained young men; 8 wk, 3 sessions/wk, 1 vs 3 vs 5 sets per exercise (~6-9 vs
  18-27 vs 30-45 weekly sets per muscle)
sample:
  studies: null
  participants: 34
read_level: full-text
findings:
- claim: Squat and bench 1RM gains did not differ between 1, 3 and 5 sets per exercise; the 13-min-per-session
    group gained as much strength.
  effect: Squat 1RM group difference P = 0.22, BF10 < 1; bench 1RM P = 0.15, BF10 < 1
  grade: promising
- claim: Hypertrophy followed a dose-response, with significantly larger increases at higher volumes for
    elbow flexors, mid-thigh and lateral thigh.
  effect: Significant between-group differences favouring higher volume at 3 of 4 sites (reported as significant
    ANCOVA effects)
  grade: promising
- claim: Higher volume produced more hypertrophy at several sites, but squat and bench 1RM gains did not
    differ between volumes in trained men.
  effect: no between-group 1RM differences; hypertrophy favoured higher volume (elbow flexors, mid- and
    lateral thigh)
  grade: promising
limitations:
- n = 34 after 11 dropouts (underpowered); 8 weeks; very high volume in the 5-set arm may include edema
  in ultrasound measures; replicated in direction but not magnitude by later trials.
- 8 weeks is short for size-driven strength gains to appear; ultrasound; small groups.
