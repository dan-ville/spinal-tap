findings:
- claim: About a third of participants grew more with repetition progression and a fifth with load progression; better
    responders to repetition progression showed larger satellite-cell increases, but myonuclear content, proteolysis
    and ECM markers did not explain responsiveness.
  effect: REPSProg responders mCSA +14.2% vs +3.4%; satellite cells +108.6% vs +48.9% (p = 0.015)
  grade: speculative
limitations:
- Cluster thresholds (2 typical errors) on within-subject data; untrained.
