findings:
- claim: Sex differences in strength emerge around age 15, are larger in upper than lower body and in concentric than eccentric contractions, and stem from greater muscle mass and type II fibre area rather than higher voluntary activation.
  effect: Narrative synthesis
  grade: established
- claim: Both sexes gain size and strength with training, with women often showing larger relative strength improvements depending on age and muscle group.
  effect: Narrative synthesis
  grade: promising
limitations: ['Narrative, single author; no pooled effect sizes.']
