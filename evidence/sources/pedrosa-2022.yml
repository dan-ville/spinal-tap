id: pedrosa-2022
title: Partial range of motion training elicits favorable improvements in muscular adaptations when carried out at
  long muscle lengths.
authors:
- Pedrosa GF
- Lima FV
- Schoenfeld BJ
- Lacerda LT
- Simões MG
