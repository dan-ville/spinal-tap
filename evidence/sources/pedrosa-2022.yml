doi: 10.1080/17461391.2021.1927199
pmid: '33977835'
url: https://pubmed.ncbi.nlm.nih.gov/33977835/
design: rct
population: Untrained women; knee extension full vs initial (long) vs final (short) vs varied partial ROM vs control,
  12 wk
sample:
  studies: null
  participants: 45
read_level: abstract
findings:
- claim: Initial-ROM (long-length) knee-extension partials produced greater regional rectus femoris and vastus lateralis
    hypertrophy than full ROM or final-ROM partials at mid and distal sites; final-ROM partials did not differ from
    control at 60-70% femur length.
  effect: Relative CSA increases greater for INITIAL at 50-70% femur length (exact values in full text, not read)
  grade: promising
limitations:
- Untrained women; small groups (about 9 per arm); ultrasound.
