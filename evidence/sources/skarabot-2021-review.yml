id: skarabot-2021-review
title: The knowns and unknowns of neural adaptations to resistance training.
authors:
- Skarabot J
- Brownstein CG
- Casolo A
- Del Vecchio A
- Ansdell P
year: 2021
venue: Eur J Appl Physiol 121(3):675-685
doi: 10.1007/s00421-020-04567-3
pmid: '33355714'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7892509/
design: narrative-review
population: Mechanistic literature, mostly short-term single-joint isometric training in untrained adults
sample:
  studies: null
  participants: null
read_level: full-text
findings:
- claim: Behavioural evidence for neural adaptation (task specificity without hypertrophy, disproportionate
    early force vs size gains, increased voluntary activation, cross-education, imagined-contraction training)
    is strong, but the site of adaptation is unresolved.
  effect: narrative synthesis
  grade: established
- claim: The most consistent TMS finding after resistance training is reduced intracortical inhibition;
    changes in corticospinal excitability are inconsistent, and direct corticospinal-axon stimulation
    studies show no change in corticomotoneuronal transmission.
  effect: narrative synthesis of TMS, CMEP and lumbar evoked potential studies
  grade: promising
- claim: HD-sEMG decomposition provides direct evidence that motor unit discharge rates rise and recruitment
    thresholds fall with short-term training, but cannot by itself identify whether inputs are cortical,
    reticulospinal, neuromodulatory (persistent inward currents) or afferent.
  effect: narrative synthesis
  grade: established
- claim: 'Stimulation responses are task-specific: changes are seen when the test replicates the trained
    task and intent, which partly explains equivocal TMS literature.'
  effect: narrative synthesis
  grade: promising
limitations:
- Narrative review by a group that also authors many primary HD-sEMG studies.
- Evidence base is largely single-joint isometric training in untrained people.
