id: pinero-2024-cwi
title: "Throwing cold water on muscle growth: A systematic review with meta-analysis of the effects of postexercise cold water immersion on resistance training-induced hypertrophy"
authors: [Pinero A, Burke R, Augustin F, Mohan AE, DeJesus K, Sapuppo M, Weisenthal M, Coleman M, Androulakis-Korakakis P, Grgic J, Swinton PA, Schoenfeld BJ]
year: 2024
venue: "European Journal of Sport Science 24(2):177-189"
doi: "10.1002/ejsc.12074"
pmid: null
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11235606/
design: meta-analysis
population: "Healthy adults, trained and untrained; RT at least 2x/wk for 4-12 wk with post-exercise CWI (mostly 10 C)"
sample: {studies: 8, participants: null}
read_level: full-text
findings:
  - claim: "Cold water immersion immediately after resistance training probably blunts hypertrophy by a small amount."
    effect: "Comparative cSMD -0.22 (95% CrI -0.47 to 0.04); p(<0) = 0.957; p(<-0.1) = 0.834; RT alone SMD 0.36 (0.10 to 0.61) vs CWI+RT 0.14 (-0.08 to 0.36)"
    grade: promising
  - claim: "Training status did not clearly moderate the effect."
    effect: "beta trained:untrained -0.10 (95% CrI -0.65 to 0.43)"
    grade: speculative
limitations:
  - "Only eight studies of fair-to-poor quality; Bayesian credible interval crosses zero; whole-body and limb immersion mixed."
topics: [recovery/cold-water-immersion, hypertrophy/recovery]
cited_in: [research/theses/strength-and-mobility/chapters/10-recovery-and-nutrition.md, research/theses/strength-and-mobility/notes/recovery-and-nutrition.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Full text read via NCBI PMC (efetch). Confirmed: 8 studies; RT SMD 0.36 (0.10 to 0.61); cSMD -0.22 (CrI -0.47 to 0.04), p(<0) 0.957, p(<-0.1) 0.834; meta-regressions (duration, training status, frequency) highly uncertain; only 1 of 8 studies included women."}
