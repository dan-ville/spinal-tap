year: 2025
venue: J Physiol 603(9):2655-2673
doi: 10.1113/JP288104
pmid: '40183698'
url: https://pubmed.ncbi.nlm.nih.gov/40183698/
design: rct
population: Untrained adults; 10 wk RT, 10 wk detraining, 10 wk retraining vs control
sample:
  studies: null
  participants: 30
read_level: abstract
findings:
- claim: Most training-induced proteome changes reversed with detraining, but several proteins (including CBR1 and
    contraction, cytoskeletal and calcium-binding proteins such as calpain-2) remained elevated after 10 weeks off,
    suggesting a proteomic memory.
  effect: 150 proteins altered after RT1 (93% increased); subset retained after detraining
  grade: speculative
limitations:
- Functional consequence for regrowth not shown; untrained participants.
