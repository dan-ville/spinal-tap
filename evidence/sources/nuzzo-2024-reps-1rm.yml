id: nuzzo-2024-reps-1rm
title: 'Maximal Number of Repetitions at Percentages of the One Repetition Maximum: A Meta-Regression and Moderator Analysis of Sex, Age, Training Status, and Exercise'
authors: [Nuzzo JL, Pinto MD, Nosaka K, Steele J]
year: 2024
venue: Sports Med 54(2):303-321
doi: 10.1007/s40279-023-01937-7
pmid: '37792272'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10933212/
design: meta-analysis
population: 952 repetitions-to-failure tests in 452 groups; 66% male, 60% resistance-trained
sample: {studies: 269, participants: 7289}
read_level: abstract
findings:
- claim: Sex, age and training status had little influence on how many repetitions can be done at a given %1RM, so one table serves most people, while the between-individual SD is substantial and the leg press allows more reps than the bench press.
  effect: Natural cubic spline for mean reps and linear model for SD of reps; moderators small
  grade: promising
limitations: [Group-level data; individual variation around the table is large.]
topics: [frontiers/sex-differences, strength/load]
cited_in: [research/theses/strength-and-mobility/chapters/11-frontiers.md]
