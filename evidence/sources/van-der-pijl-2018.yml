read_level: abstract
findings:
- claim: 'Stretch-induced hypertrophy scaled with titin stiffness: reduced-stiffness mice grew less and increased-stiffness
    mice grew more, identifying titin as a mechanosensor.'
  effect: Hemidiaphragm mass +48% in wild type; -20% (reduced stiffness) and +18% (increased stiffness) response
  grade: promising
limitations:
- Mouse passive-stretch model; transfer to human loaded training at long lengths is inferential.
