url: https://pubmed.ncbi.nlm.nih.gov/41961284/
design: other
population: Older (67 y) and younger (26 y) adults, 2 weeks unilateral elbow-flexor training
sample:
  studies: null
  participants: 25
read_level: abstract
findings:
- claim: Two weeks of training produced similar strength gains in young and older adults with shortened
    cortical silent periods in both, decreased corticospinal excitability in the young, and improved startle-cued
    reaction time and RFD, interpreted as greater reticulospinal engagement.
  effect: direction-only results in abstract; older adults central activation ratio increased (P < 0.001)
  grade: speculative
limitations:
- No untrained control group described in abstract; indirect reticulospinal measures; very short training.
- "Corticospinal excitability decreased in younger adults, the opposite of the classic excitability hypothesis."
