id: androulakis-korakakis-2021-powerlifters
title: The Minimum Effective Training Dose Required for 1RM Strength in Powerlifters
authors: [Androulakis-Korakakis P, Michalopoulos N, Fisher JP, Keogh J, Loenneke JP, Helms E, Wolf M, Nuckols G, Steele J]
year: 2021
venue: Frontiers in Sports and Active Living 3:713655
doi: 10.3389/fspor.2021.713655
pmid: '34527944'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8435792/
design: other
population: 'Powerlifting athletes and coaches: interviews (n = 28), survey/interviews (n = 137), two training studies in intermediate-advanced lifters (n = 25), survey (n = 57)'
sample: {studies: 5, participants: 247}
read_level: full-text
findings:
- claim: Triangulating coaches, athletes and two small trials, ~3-6 working sets of 1-5 reps per lift per week at >80% 1RM and RPE 7.5-9.5, over 1-3 sessions, is proposed as a minimum effective dose for 6-12 weeks.
  effect: Recommendation; 80% of athletes and 61% of coaches endorsed 'a few heavy sets per week'
  grade: convention
- claim: Daily-max singles at RPE 9-9.5 alone maintained or slightly raised 1RM, but adding two back-off triples at ~80% of the single made meaningful gains likely.
  effect: 'Pooled daily-max groups: PL total modal increase 19.6 kg (95% HDI 10.7 to 31.6); 77.1% probability of exceeding the elicited meaningful-change ROPE'
  grade: speculative
limitations:
- Training studies tiny (n = 25 across two), 6 weeks, not preregistered, exploratory Bayesian analyses; deadlift estimates imprecise.
topics: [strength/minimum-dose, strength/maintenance]
cited_in: [research/theses/strength-and-mobility/chapters/03-dose-response.md, research/theses/strength-and-mobility/notes/dose-response.md, research/theses/strength-and-mobility/notes/programming-and-periodization.md]
checked:
  date: 2026-11-24
  by: verification pass
  notes: "Ch3 verification: Europe PMC full text; pooled PL total +19.6 kg (95% HDI 10.7-31.6), 77.1% probability above ROPE; ~3-6 working sets of 1-5 reps/wk at >80% 1RM, RPE 7.5-9.5. Confirmed. The daily-max-only group: +11.4 kg (0.8-19.5), only 6.3% probability above ROPE. | Earlier check by chapter 3 literature researcher: Full text from PMC HTML."
