id: saw-2016-subjective
title: "Monitoring the athlete training response: subjective self-reported measures trump commonly used objective measures: a systematic review"
authors: [Saw AE, Main LC, Gastin PB]
year: 2016
venue: "British Journal of Sports Medicine 50(5):281-291"
doi: "10.1136/bjsports-2015-094758"
pmid: "26423706"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4789708/
design: systematic-review
population: "Athletes; studies reporting concurrent subjective and objective well-being measures"
sample: {studies: 56, participants: null}
read_level: full-text
findings:
  - claim: "Subjective measures (e.g., POMS, RESTQ-S, DALDA) tracked acute and chronic training load more sensitively and consistently than objective measures such as blood markers and heart rate, and the two generally did not correlate."
