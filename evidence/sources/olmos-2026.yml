read_level: abstract
findings:
- claim: Six weeks of high-load or combined high+low-load training produced similar 1RM and MVC gains
    despite much larger vastus lateralis growth with the combined programme.
  effect: mCSA +21% (H+L) vs +4% (H); similar 1RM and MVC increases
  grade: promising
- claim: 'Motor unit adaptations differed by programme: high-load raised firing rates of lower-threshold
    units, whereas combined training enlarged higher-threshold unit action potentials and lowered their
    firing rates.'
  effect: direction of MU changes as reported in abstract
  grade: speculative
limitations:
- Untrained men; pseudorandomised; 6 weeks; surface EMG decomposition at 40% MVC.
