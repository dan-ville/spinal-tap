id: burke-2023-creatine-hypertrophy
title: "The Effects of Creatine Supplementation Combined with Resistance Training on Regional Measures of Muscle Hypertrophy: A Systematic Review with Meta-Analysis"
authors: [Burke R, Pinero A, Coleman M, Mohan A, Sapuppo M, Augustin F, Aragon AA, Candow DG, Forbes SC, Swinton P, Schoenfeld BJ]
year: 2023
venue: "Nutrients 15(9):2116"
doi: "10.3390/nu15092116"
pmid: "37432300"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10180745/
design: meta-analysis
population: "Healthy adults (4 studies young 21-26 y, 6 older 57-72 y); RT 6-52 wk; direct imaging (MRI, CT, ultrasound)"
sample: {studies: 10, participants: null}
read_level: full-text
findings:
  - claim: "Measured directly by imaging, creatine added only a very small amount of regional hypertrophy to resistance training."
    effect: "Pooled SMD 0.11 (95% CrI -0.02 to 0.25), 44 outcomes; muscle thickness +0.10 to 0.16 cm (e.g., elbow extensors 0.16 cm, CrI -0.10 to 0.39)"
    grade: promising
  - claim: "The benefit was larger in young than in older adults."
    effect: "Young ES 0.23 (95% CrI 0.01 to 0.44) vs older ES 0.06 (-0.10 to 0.21)"
    grade: promising
limitations:
  - "Only 10 studies, one in women; Bayesian estimates with credible intervals crossing zero for most sites; mostly ultrasound."
  - "Several authors declare creatine-related funding (Candow, Forbes)."
topics: [nutrition/creatine, hypertrophy/supplements]
cited_in: [research/theses/strength-and-mobility/chapters/10-recovery-and-nutrition.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Full text re-read. Confirmed: pooled SMD 0.11 (CrI -0.02 to 0.25); site estimates 0.10-0.16 cm, every one with a CrI crossing zero (e.g. elbow flexors 0.10, -0.13 to 0.32; knee extensors 0.13, -0.07 to 0.37); young ES 0.23 (0.01 to 0.44), older 0.06 (-0.10 to 0.21); young subgroup only 4 studies (mean age 23.5 y). Caveat for the notes: this is not an industry-independent replication; co-authors Candow, Forbes and Schoenfeld (formerly Dymatize advisory board) declare creatine-related ties."}
