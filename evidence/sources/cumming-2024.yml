id: cumming-2024
title: 'Muscle memory in humans: evidence for myonuclear permanence and long-term transcriptional regulation after
  strength training.'
authors:
- Cumming KT
- Reitzner SM
- Hanslien M
- Skilnand K
- Seynnes OR
- Horwath O
- Psilander N
- Sundberg CJ
- Raastad T
year: 2024
venue: J Physiol 602(17):4171-4193
doi: 10.1113/JP285675
pmid: '39159314'
url: https://pubmed.ncbi.nlm.nih.gov/39159314/
design: rct
population: Untrained men and women; 10 wk unilateral elbow-flexor training, 16 wk detraining, 10 wk retraining of
  both arms
sample:
  studies: null
  participants: 12
read_level: abstract
findings:
- claim: Myonuclei added during training were retained through 16 weeks of detraining (33% more in type 2 fibres than
    the control arm), supporting myonuclear permanence in humans, but this did not produce clearly greater regrowth
    on retraining.
  effect: Myonuclei +13% (type 1), +33% (type 2) during training; retained after detraining; delta type 2 fCSA on
    retraining not different between arms
  grade: contested
limitations:
- n = 12; biopsy-based; physiological benefit of retained nuclei unproven.
