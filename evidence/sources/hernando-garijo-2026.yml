  participants: 1214
read_level: abstract
findings:
- claim: Unilateral upper-limb training produced small contralateral strength gains with no detectable
    contralateral hypertrophy, supporting a neural mechanism.
  effect: MVIC SMD 0.42 (95% CI 0.12 to 0.72); 1RM SMD 0.36 (0.04 to 0.69); muscle thickness SMD 0.14
    (-0.23 to 0.51); GRADE low to very low
  grade: established
limitations:
- GRADE low to very low.
