id: colenso-semple-2023-menstrual
title: Current evidence shows no influence of women's menstrual cycle phase on acute strength performance or adaptations to resistance exercise training
authors: [Colenso-Semple LM, D'Souza AC, Elliott-Sale KJ, Phillips SM]
year: 2023
venue: Front Sports Act Living 5:1054542
doi: 10.3389/fspor.2023.1054542
pmid: '37033884'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10076834/
design: umbrella-review
population: Systematic reviews and meta-analyses of eumenorrheic women not using hormonal contraception
sample: {studies: null, participants: null}
read_level: full-text
findings:
- claim: Available reviews show limited effect of cycle phase on strength performance and rest on low-quality studies; there is no high-quality evidence that phase affects acute strength or resistance-training adaptations.
  effect: Umbrella review with quality-of-evidence scoring of each review
  grade: promising
- claim: The two trials usually cited for follicular-phase-based training (Sung 2014; Wikstrom-Frisen 2017) have serious design flaws, including basal-body-temperature phase detection, unsupervised sessions and unequal volume.
  effect: Critical appraisal; no pooled effect
  grade: promising
- claim: Cycle and phase length vary within and between women (within-person cycle length can vary by more than 7 days, and ovulation does not occur every cycle), so calendar-based phase assignment misclassifies phases.
  effect: Cites analysis of 130 women
  grade: established
limitations:
- Narrative umbrella of reviews; authors have argued this position consistently (possible allegiance); searched to January 2022.
topics: [frontiers/menstrual-cycle]
