id: alentorn-geli-2017-running-oa
title: "The Association of Recreational and Competitive Running With Hip and Knee Osteoarthritis: A Systematic Review and Meta-analysis"
authors: [Alentorn-Geli E, Samuelsson K, Musahl V, Green CL, Bhandari M, Karlsson J]
year: 2017
venue: "J Orthop Sports Phys Ther 47(6):373-390"
doi: "10.2519/jospt.2017.7137"
pmid: "28504066"
url: https://pubmed.ncbi.nlm.nih.gov/28504066/
design: meta-analysis
population: "Runners vs sedentary/non-running controls; observational studies"
sample: {studies: 25, participants: 125810}
read_level: abstract
findings:
  - claim: "Recreational runners had less hip and knee OA than both sedentary controls and competitive runners, suggesting a U-shaped exposure-response."
    effect: "Prevalence: competitive 13.3% (11.6 to 15.2), recreational 3.5% (3.4 to 3.6), controls 10.2% (9.9 to 10.6); OR competitive 1.34 (0.97 to 1.86), recreational 0.86 (0.69 to 1.07)"
    grade: promising
limitations:
  - "Observational; confounding by prior injury, body mass and self-selection; heterogeneous OA definitions."
topics: [connective-tissue/cartilage]
