id: sabag-2018-hiit-concurrent
title: 'The compatibility of concurrent high intensity interval training and resistance training for muscular strength and
  hypertrophy: a systematic review and meta-analysis'
authors:
- Sabag A
- Najafi A
- Michael S
- Esgin T
- Halaki M
- Hackett D
year: 2018
venue: J Sports Sci 36(21):2472-2483
doi: 10.1080/02640414.2018.1464636
pmid: '29658408'
url: https://pubmed.ncbi.nlm.nih.gov/29658408/
design: meta-analysis
population: Adults in trials comparing HIIT plus resistance training with resistance training alone
sample:
  studies: null
  participants: null
read_level: abstract
findings:
- claim: Concurrent HIIT and resistance training produced slightly smaller lower-body strength gains than resistance training
    alone, with no difference in hypertrophy or upper-body strength.
  effect: Lower-body strength ES = -0.248, p = 0.049
  grade: promising
- claim: The lower-body strength deficit trended larger with cycling HIIT than running HIIT; longer inter-modal rest was suggested
    to help.
  effect: Cycling HIIT ES = -0.377, p = 0.074; running HIIT ES = -0.176, p = 0.261
  grade: contested
limitations:
- Abstract does not report number of studies or CIs; borderline p-value; modality subgroup is a non-significant trend that
  contradicts Wilson 2012 (running worse).
topics:
