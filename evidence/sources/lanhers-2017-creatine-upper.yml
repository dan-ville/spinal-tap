id: lanhers-2017-creatine-upper
title: "Creatine Supplementation and Upper Limb Strength Performance: A Systematic Review and Meta-Analysis"
authors: [Lanhers C, Pereira B, Naughton G, Trousselard M, Lesage FX, Dutheil F]
year: 2017
venue: "Sports Medicine 47(1):163-173"
doi: "10.1007/s40279-016-0571-4"
pmid: "27328852"
url: https://pubmed.ncbi.nlm.nih.gov/27328852/
design: meta-analysis
population: "Placebo-controlled RCTs; upper-limb strength in tasks under 3 min"
sample: {studies: 53, participants: 1138}
read_level: abstract
findings:
  - claim: "Creatine improved upper-limb strength by a small amount independent of population or protocol."
