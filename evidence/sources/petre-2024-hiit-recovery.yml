findings:
- claim: Ten minutes after very intense cycling intervals, peak force, RFD and jump height were reduced; after 6 h or 24 h
    none were impaired.
  effect: '10 min: peak force -7%, peak RFD -17%, jump height -4%, peak power -2% (all p<0.05); 6 h and 24 h: no reductions'
  grade: promising
limitations:
- Acute only; n=15; one HIIT protocol.
