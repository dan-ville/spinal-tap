findings:
- claim: 'Over two years, elite weightlifters made small gains: competition total rose 2.8% while maximal
    IEMG, isometric force and mean fibre area changed non-significantly by about 4-6%.'
  effect: Total +2.8% (P < 0.05); IEMG +4.2% (NS); isometric force +4.9% (NS); fibre area +5.9% (NS)
  grade: promising
limitations:
- n = 9; underpowered; surface IEMG; the competition-lift gain exceeded no single mechanism measured.
