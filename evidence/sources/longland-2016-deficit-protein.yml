id: longland-2016-deficit-protein
title: "Higher compared with lower dietary protein during an energy deficit combined with intense exercise promotes greater lean mass gain and fat mass loss: a randomized trial"
authors: [Longland TM, Oikawa SY, Mitchell CJ, Devries MC, Phillips SM]
year: 2016
venue: "American Journal of Clinical Nutrition 103(3):738-746"
doi: "10.3945/ajcn.115.119339"
pmid: "26817506"
url: https://pubmed.ncbi.nlm.nih.gov/26817506/
design: rct
population: "Young overweight recreationally active men; 4 wk, ~40% energy deficit, resistance training plus HIIT 6 d/wk; 1.2 vs 2.4 g/kg/day protein"
sample: {studies: null, participants: 40}
read_level: abstract
findings:
  - claim: "During a severe energy deficit with hard training, 2.4 g/kg/day protein increased lean mass and fat loss more than 1.2 g/kg/day."
    effect: "LBM +1.2 +/- 1.0 kg (2.4 g/kg) vs +0.1 +/- 1.0 kg (1.2 g/kg); fat mass -4.8 +/- 1.6 vs -3.5 +/- 1.4 kg (P < 0.05); performance improved similarly"
    grade: promising
limitations:
  - "Four weeks; overweight not lean athletes; single-blind; 4-compartment model but short duration."
topics: [nutrition/energy-deficit, nutrition/protein]
cited_in: [research/theses/strength-and-mobility/chapters/10-recovery-and-nutrition.md]
