id: walker-2016
title: Greater Strength Gains after Training with Accentuated Eccentric than Traditional Isoinertial Loads in Already
  Strength-Trained Men.
authors:
- Walker S
- Blazevich AJ
- Haff GG
- Tufano JJ
- Newton RU
- Häkkinen K
year: 2016
venue: Front Physiol 7:149
doi: 10.3389/fphys.2016.00149
pmid: '27199764'
url: https://pubmed.ncbi.nlm.nih.gov/27199764/
design: rct
population: Strength-trained men (2.6 +/- 2.2 y); accentuated eccentric (+40%) vs traditional leg press and knee extension
  vs control, 10 wk
sample:
  studies: null
  participants: 28
read_level: full-text
findings:
- claim: In already trained men, accentuated eccentric loading increased isometric and eccentric strength and voluntary
    activation more than traditional loading, but hypertrophy was similar.
  effect: Isometric torque +18 +/- 10% (AEL) vs control +1 +/- 5%; eccentric torque +10 +/- 9% (AEL only); similar
    muscle mass changes (panoramic ultrasound, DXA)
  grade: promising
limitations:
- Small groups; 10 weeks; ultrasound and DXA.
topics:
- hypertrophy/eccentric
- hypertrophy/accentuated-eccentric
- hypertrophy/trained
