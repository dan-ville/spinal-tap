id: manresa-rocamora-2021-hrv-guided
title: "Heart Rate Variability-Guided Training for Enhancing Cardiac-Vagal Modulation, Aerobic Fitness, and Endurance Performance: A Methodological Systematic Review with Meta-Analysis"
authors: [Manresa-Rocamora A, Sarabia JM, Javaloyes A, Flatt AA, Moya-Ramon M]
year: 2021
venue: "International Journal of Environmental Research and Public Health 18(19):10299"
doi: "10.3390/ijerph181910299"
pmid: "34639599"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8507742/
design: meta-analysis
population: "Sedentary, physically active and endurance-trained adults; controlled trials of HRV-guided vs predefined endurance (6) or combined endurance-strength (2) training"
sample: {studies: 8, participants: 199}
read_level: full-text
findings:
  - claim: "HRV-guided endurance training improved vagal HRV more than predefined training, but fitness and performance advantages were small and not significant."
    effect: "VO2max SMD 0.20 (95% CI -0.07 to 0.47); endurance performance SMD 0.20 (-0.09 to 0.48); vagal HRV SMD 0.50"
    grade: promising
limitations:
  - "Endurance training only; no meta-analysis of HRV-guided resistance training exists; one author declares small industry fees."
topics: [monitoring/hrv]
cited_in: [research/theses/strength-and-mobility/chapters/10-recovery-and-nutrition.md, research/theses/strength-and-mobility/notes/recovery-and-nutrition.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Full text (Europe PMC XML) read. Correction: population was sedentary, physically active AND endurance-trained participants (8 studies, 199 participants, 7 randomised), not endurance athletes only; 2 of 8 interventions were combined endurance and strength training. Numbers confirmed: vagal HRV SMD 0.50 (0.09 to 0.91); VO2max 0.20 (-0.07 to 0.47); endurance performance 0.20 (-0.09 to 0.48); resting HR 0.04. An earlier meta-analysis (Granero-Gallegos 2020) reported a significant VO2max benefit, so 'at most small' rests on this better-specified analysis."}
