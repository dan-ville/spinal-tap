title: "Acute and Chronic Changes in Muscle Androgen Receptor Markers Are Not Associated with Muscle Hypertrophy in Women and Men"
authors: [Bergamasco JGA, Scarpelli MC, Godwin JS, Mesquita PHC, Chaves TS, Da Silva DG, Bittencourt D, Dias NF, Medalha Junior RA, Carello Filho PC, Angleri V, Costa LAR, Michel JM, Vechin FC, Kavazis AN, Ugrinowitsch C, Roberts MD, Libardi CA]
