id: jakubowski-2020-hmb
title: "Supplementation with the Leucine Metabolite beta-hydroxy-beta-methylbutyrate (HMB) does not Improve Resistance Exercise-Induced Changes in Body Composition or Strength in Young Subjects: A Systematic Review and Meta-Analysis"
authors: [Jakubowski JS, Nunes EA, Teixeira FJ, Vescio V, Morton RW, Banfield L, Phillips SM]
year: 2020
venue: "Nutrients 12(5):1523"
doi: "10.3390/nu12051523"
pmid: "32456217"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7285233/
design: meta-analysis
population: "Young adults 18-45 y in resistance training trials"
sample: {studies: 11, participants: 302}
read_level: abstract
findings:
  - claim: "HMB did not increase fat-free mass or strength gains from resistance training in young adults."
    effect: "No significant effect on FFM, fat mass or 1RM (248 in strength analysis); small effect on total body mass only"
    grade: promising
limitations:
  - "Three of 14 studies excluded after funnel-plot analysis; earlier positive HMB trials disputed."
