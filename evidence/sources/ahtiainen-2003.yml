findings:
- claim: Over 21 weeks, strength athletes gained far less isometric force and no quadriceps CSA compared
    with non-athletes, illustrating the training-age ceiling.
  effect: Non-athletes force +20.9%, CSA +5.6%; strength athletes force +3.9%, CSA -1.8%
  grade: promising
limitations:
- n = 8 per group; isometric test; MRI CSA.
