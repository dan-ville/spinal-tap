id: held-2022-vbt-nma
title: 'The effectiveness of traditional vs. velocity-based strength training on explosive and maximal strength performance: A network meta-analysis'
authors: [Held S, Speer K, Rappelt L, Wicker P, Donath L]
year: 2022
venue: Frontiers in Physiology 13:926972
doi: 10.3389/fphys.2022.926972
pmid: '36035476'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9399433/
design: meta-analysis
population: Healthy participants 18-40 y
sample: {studies: 14, participants: 311}
read_level: abstract
findings:
- claim: Velocity-loss-based training (low and high VL) ranked above generic VBT, traditional 1RM-based and RIR training for strength, jump and sprint, with low VL best for jumps.
  effect: lowVL P-score >= 0.59, SMD >= 0.33; highVL P-score >= 0.50, SMD >= 0.12; VBT, TRT and RIR P-scores <= 0.47, SMD <= 0.12
  grade: speculative
limitations:
- Rankings (P-scores) overstate small, imprecise differences; few studies per node.
topics: [programming/autoregulation, strength/velocity-based-training, technology/velocity-based-training]
