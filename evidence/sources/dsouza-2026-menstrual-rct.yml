id: dsouza-2026-menstrual-rct
title: 'Menstrual Cycle Phase Does Not Influence Training-Induced Muscle Hypertrophy or Strength: A Randomized Controlled Trial'
authors: [D'Souza AC, Van Every DW, Bhinder A, Elango S, Lamont GAC, Lees MJ, Lim C, McKendry J, Newbold JP, Naphin C, Rebalka IA, Roxburgh L, et al]
year: 2026
venue: Med Sci Sports Exerc 58(10):2255-73
doi: 10.1249/MSS.0000000000004031
pmid: '42160459'
url: https://pubmed.ncbi.nlm.nih.gov/42160459/
design: rct
population: Healthy eumenorrheic women; within-participant unilateral design over three consecutive cycles (12.2 +/- 1.3 wk)
sample: {studies: null, participants: 24}
read_level: full-text
findings:
- claim: Concentrating high volume in the follicular phase or the luteal phase gave no more hypertrophy or strength than continuous training spread evenly across the cycle; all training conditions beat the non-exercised control.
  effect: All RET conditions > CON for thigh lean mass, VL CSA, FFM and 1RM (all p < 0.001); no differences among EX, HV-FOL and HV-LUT (all p >= 0.17); HV = 5 sets x 2/wk (>=10 sets/muscle/wk), LV = 1 set x 2/wk; thigh lean mass +0.07 +/- 0.01 kg vs CON in each training condition; adherence 96 +/- 3%
  grade: promising
- claim: Training volume-load, not phase-based timing, was associated with several adaptations.
  effect: 'Total volume load predicted change in DXA thigh lean mass (marginal R2 0.47), VL CSA (0.30), leg press 1RM (0.39) and leg extension 1RM (0.25), not MVIC; the paper does not state whether zero-volume control legs were in these models'
  grade: promising
limitations:
- n = 24 with four conditions spread across two legs per person (each participant contributes two of four conditions); previously untrained or recreationally active women (no lower-body RT for >= 6 months); unilateral quadriceps model; three cycles only; one participant with luteal-phase deficiency and two with a cycle > 35 d kept in the ITT analysis; same McMaster group as colenso-semple-2025-mps. Volume (issue) and page numbers not checked.
topics: [frontiers/menstrual-cycle]
cited_in: [research/theses/strength-and-mobility/chapters/11-frontiers.md, research/theses/strength-and-mobility/notes/frontiers.md]
