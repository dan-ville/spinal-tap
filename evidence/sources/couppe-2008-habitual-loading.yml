id: couppe-2008-habitual-loading
title: "Habitual loading results in tendon hypertrophy and increased stiffness of the human patellar tendon"
authors: [Couppe C, Kongsgaard M, Aagaard P, Hansen P, Bojsen-Moller J, Kjaer M, Magnusson SP]
year: 2008
venue: "J Appl Physiol 105(3):805-810"
doi: "10.1152/japplphysiol.90361.2008"
pmid: "18556433"
url: https://pubmed.ncbi.nlm.nih.gov/18556433/
design: cross-sectional
population: "Elite fencers and badminton players with >=15% side-to-side strength difference (within-person comparison)"
sample: {studies: null, participants: 7}
read_level: abstract
findings:
  - claim: "Years of asymmetric sport loading were associated with larger distal and proximal patellar tendon CSA and higher stiffness on the lead leg, with no modulus difference."
    effect: "Distal CSA 139 +/- 11 vs 116 +/- 7 mm2; proximal 106 +/- 7 vs 83 +/- 4 mm2; stiffness 4766 +/- 716 vs 3494 +/- 446 N/mm; modulus 2.27 vs 2.16 GPa (ns)"
    grade: promising
limitations:
  - "n=7; side differences may partly predate adulthood (loading during growth)."
topics: [connective-tissue/tendon, connective-tissue/time-course]
