id: haun-2019
title: Muscle fiber hypertrophy in response to 6 weeks of high-volume resistance training in trained young men is
  largely attributed to sarcoplasmic hypertrophy.
authors:
- Haun CT
- Vann CG
- Osburn SC
- Mumford PW
- Roberson PA
