year: 2019
venue: PLoS One 14(6):e0215267
doi: 10.1371/journal.pone.0215267
pmid: '31166954'
url: https://pubmed.ncbi.nlm.nih.gov/31166954/
design: other
population: Resistance-trained young men (5 +/- 3 y); very high-volume 6-week programme
sample:
  studies: null
  participants: 30
read_level: abstract
findings:
- claim: In 15 hypertrophic responders, fibre CSA rose 23% while actin and myosin concentrations per fibre fell about
    30%, suggesting disproportionate sarcoplasmic expansion rather than myofibrillar accretion.
  effect: fCSA +23%; myosin and actin about -30% (post hoc P < 0.05; ANOVA P = 0.052-0.055)
  grade: contested
limitations:
- Borderline statistics; responders only; very high volume; industry gift-in-kind funding declared.
- Implies some trained-lifter hypertrophy may add little force per unit size.
