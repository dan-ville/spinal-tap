id: panidi-2023-fascicle-meta
title: 'Muscle Architecture Adaptations to Static Stretching Training: A Systematic Review with Meta-Analysis'
authors:
- Panidi I
- Donti O
- Konrad A
- Dinas PC
- Terzis G
- Mouratidis A
- Gaspari V
- Donti A
- Bogdanis GC
year: 2023
venue: Sports Med Open 9(1):47
doi: 10.1186/s40798-023-00591-7
pmid: '37318696'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10271914/
design: meta-analysis
population: RCTs and controlled trials of static stretching training with ultrasound architecture outcomes; 15 of
  19 studies on the ankle; one athletic sample
sample:
  studies: 19
  participants: 467
read_level: full-text
findings:
- claim: Static stretching training produced a trivial increase in resting fascicle length and a small increase in
    fascicle length measured during stretch, with no change in fascicle angle or muscle thickness.
  effect: 'Resting FL SMD = 0.17 (95% CI 0.01 to 0.33); FL during stretch SMD = 0.39 (95% CI 0.05 to 0.74); authors''
    GRADE: considerable confidence (FL during stretch downgraded for imprecision)'
  grade: contested
- claim: Fascicle lengthening appeared only with high total volume (>=5400 s, i.e. >=90 min over the programme) and
    high (discomfort or pain) intensity.
  effect: High volume SMD = 0.29 (95% CI 0.09 to 0.49) vs low volume -0.06 (95% CI -0.30 to 0.17), subgroup p = 0.025;
    high intensity 0.28 (0.08 to 0.47) vs low -0.05 (-0.28 to 0.20), p = 0.042
  grade: contested
limitations:
- Pooled several regions and heads of the same muscle from single studies without fully modelling clustering, which
  Ingram 2025 argues inflated effects.
- Excluded contralateral-control studies; did not report prediction intervals (criticised by Arntz 2024).
- High-volume groups also stretched for longer programmes (10.6 vs 5.1 weeks), confounding volume with duration.
- Ultrasound FL estimates are sensitive to method.
topics:
