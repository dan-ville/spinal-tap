id: blazevich-2025-sarcomerogenesis
title: 'Triggering sarcomerogenesis: Examining key stimuli and the role attributed to eccentric training-Historical,
  systematic, and meta-analytic review'
authors:
- Blazevich AJ
- Herzog W
- Nunes JP
year: 2025
venue: J Sport Health Sci 14:101073
doi: 10.1016/j.jshs.2025.101073
pmid: '40623648'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12590150/
design: meta-analysis
population: Mainly animal models (eccentric or fibre-lengthening exercise vs control); historical review of human
  and animal work
sample:
  studies: null
  participants: null
read_level: full-text
findings:
- claim: In animal models, eccentric resistance training did not increase serial sarcomere number; high active or
    passive forces at long fibre lengths, not eccentric contraction or large excursion as such, appear to be the key
    stimulus, and too few human studies exist to judge eccentric training's effect on sarcomere number.
  effect: 'Eccentric resistance training vs control (animals): change 1%; Cohen''s d = 0.19 (95% CI -0.29 to 0.67),
    p = 0.449. Pooling all ''apparently eccentric'' animal studies (incl. downhill running) gave a ~3% (moderate)
    SSN increase (Fig. 7A)'
  grade: promising
limitations:
- Animal-dominant evidence; authors state human SSN data are too few and conflicting to draw conclusions and that
  human studies lack non-exercise controls.
topics:
- mobility/mechanisms
- hypertrophy/architecture
