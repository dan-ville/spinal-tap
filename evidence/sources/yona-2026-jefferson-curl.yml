id: yona-2026-jefferson-curl
title: 'Surface EMG Characterization of the Jefferson Curl at a Submaximal Load Matched to the Romanian Deadlift:
  A Cross-Sectional Study in Resistance-Trained Adults'
authors:
- Yona T
- Kalifa B
- Gildar S
- Margi R
- Har-Nir I
- Fischer AG
year: 2026
venue: Int J Sports Phys Ther 21:1100-1116
doi: 10.26603/001c.172559
pmid: '42974576'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13727010/
design: cross-sectional
population: Resistance-trained adults 18-45 y who deadlift regularly; Jefferson curl at RPE 16 vs RDL at the same
  absolute load
sample:
  studies: null
  participants: 21
read_level: full-text
findings:
- claim: At the same submaximal load, the Jefferson curl produced higher upper and lower erector spinae and biceps
    femoris EMG than the Romanian deadlift; middle erector spinae and gluteus maximus did not differ.
  effect: Upper ES 62.84 vs 44.52 %MVIC (g = 0.83); lower ES 60.07 vs 47.85 (g = 0.49); biceps femoris 54.18 vs 41.54
    (g = 0.60); FDR-adjusted p = 0.003-0.035
  grade: promising
limitations:
- Single session; EMG amplitude is not a measure of training adaptation; load matched to the Jefferson curl (submaximal
  for the RDL), which biases comparison; the only peer-reviewed Jefferson-curl study located besides rosenfeldt-2024-rt-vs-stretch.
topics:
- mobility/practitioner-systems
- mobility/loaded-flexion
