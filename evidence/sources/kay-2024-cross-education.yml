id: kay-2024-cross-education
title: Cross-Education Effects of Isokinetic Eccentric Plantarflexor Training on Flexibility, Strength, and Muscle-Tendon
  Mechanics
authors:
- Kay AD
- Blazevich AJ
- Tysoe JC
- Baxter BA
year: 2024
venue: Med Sci Sports Exerc 56(7):1242-1255
doi: 10.1249/MSS.0000000000003418
pmid: '38451696'
url: https://pubmed.ncbi.nlm.nih.gov/38451696/
design: rct
population: Young adults; 6 wk unilateral maximal isokinetic eccentric plantar-flexor training vs control
sample:
  studies: null
  participants: 26
read_level: abstract
findings:
- claim: Unilateral eccentric training increased dorsiflexion ROM, stretch tolerance and strength in both the trained
    and the untrained limb, while structural changes (fascicle length, thickness, stiffness) occurred only in the
    trained limb.
  effect: 'Dorsiflexion ROM +4.0-9.5 deg; stretch tolerance +40.3-95.9%; isometric torque +38-41%; trained limb only:
    GM fascicle length +7.6%, thickness +5.4-6.1%, passive MTU stiffness +30.1%, Achilles stiffness +5.3%'
  grade: promising
- claim: Because the untrained limb gained ROM without structural change, the ROM gain is at least partly neural (stretch
    tolerance).
  effect: Trained vs contralateral ROM change r = 0.59
  grade: promising
limitations:
- n = 13 per group; isokinetic dynamometer training; untrained participants.
topics:
- mobility/eccentric-training
- mobility/mechanisms
- flexibility/resistance-training
