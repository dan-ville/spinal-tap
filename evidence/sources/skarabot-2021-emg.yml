- research/theses/strength-and-mobility/notes/neuromuscular-basis-of-strength.md
- research/theses/strength-and-mobility/verification/neuromuscular-basis-of-strength.md
checked:
  date: '2026-11-24'
  by: verification pass
  notes: "Abstract re-read; numbers confirmed. Only the knee extensors had higher absolute voluntary EMG in trained men (P < 0.001); elbow-flexor EMG did not differ even before normalisation (P = 0.195). Authors' wording is that EMG 'might be confounded' by morphology. | Prior check: chapter 2 researcher 2026-11-24"
