id: lecce-2024
title: 'Cross-education: motor unit adaptations mediate the strength increase in non-trained muscles following
  8 weeks of unilateral resistance training.'
authors:
- Lecce E
- Conti A
- Del Vecchio A
- Felici F
- Scotto di Palumbo A
- Sacchetti M
- Bazzucchi I
year: 2024
venue: Front Physiol 15:1512309
doi: 10.3389/fphys.2024.1512309
pmid: '39839528'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11747592/
design: rct
population: Young adults, unilateral elbow-flexor training vs no-training controls
sample:
  studies: null
  participants: 18
read_level: abstract
findings:
- claim: Eight weeks of unilateral training increased MVF in the trained arm and, to about half the extent,
    in the untrained arm, with lower recruitment thresholds and higher net discharge rates in tracked
    motor units of both arms.
  effect: Untrained arm MVF +7% (4 wk), +10% (8 wk); trained arm +11%, +19%; recruitment threshold P <
    0.01; net discharge rate P < 0.05
  grade: promising
limitations:
- Nine per group (randomised); short duration.
- Biceps brachii isometric testing only.
