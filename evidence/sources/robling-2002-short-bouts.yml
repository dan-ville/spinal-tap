id: robling-2002-short-bouts
title: "Improved bone structure and strength after long-term mechanical loading is greatest if loading is separated into short bouts"
authors: [Robling AG, Hinant FM, Burr DB, Turner CH]
year: 2002
venue: "J Bone Miner Res 17(8):1545-1554"
doi: "10.1359/jbmr.2002.17.8.1545"
pmid: "12162508"
url: https://pubmed.ncbi.nlm.nih.gov/12162508/
design: mechanistic
population: "Adult female rats; ulnar loading 360 cycles/day, 3 d/wk for 16 wk, as 1 x 360 or 4 x 90 with 3 h between bouts"
sample: {studies: null, participants: 26}
read_level: abstract
findings:
  - claim: "Splitting the same daily loading into four short bouts improved bone strength and structure more than one continuous bout, with only small BMD changes."
    effect: "Ultimate force +64% (360x1) vs +87% (90x4); energy to failure +94% vs +165%; Imin +69% vs +96%; aBMD/BMC +5-12%"
    grade: promising
limitations:
  - "Animal model with controlled loading; direct human trials of bout distribution are lacking."
topics: [connective-tissue/bone, connective-tissue/short-bout-loading]
cited_in: [research/theses/strength-and-mobility/chapters/08-connective-tissue.md, research/theses/strength-and-mobility/notes/connective-tissue.md]
