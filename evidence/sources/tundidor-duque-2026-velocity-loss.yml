id: tundidor-duque-2026-velocity-loss
title: 'Velocity Loss During Resistance Training: Implications for Concurrent Training Adaptations'
authors:
- Tundidor-Duque RM
- Loturco I
- Paéz-Maldondado JA
- Asín-Izquierdo I
- Lovillo-Fuentes F
- Sánchez-Valdepeñas J
