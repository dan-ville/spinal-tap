- Pain MTG
- Folland JP
year: 2024
venue: Med Sci Sports Exerc 56(10):1893-1905
doi: 10.1249/MSS.0000000000003490
pmid: '38857522'
url: https://pubmed.ncbi.nlm.nih.gov/38857522/
design: rct
population: Healthy young men; Nordic hamstring vs lengthened-state eccentric (hip-flexed) training vs control, 12
  wk, MRI
sample:
  studies: null
  participants: 42
read_level: full-text
findings:
- claim: Lengthened-state eccentric knee-flexor training grew the whole hamstrings and biceps femoris long head more
    than Nordic hamstring training; each grew different muscles according to whether they also extend the hip.
  effect: Hamstrings +18% vs +11%; BFlh +19% vs +5%; BFlh aponeurosis +9% vs +3% (all P <= 0.001); hip-extending knee
    flexors 2.2-fold vs NHT; non-hip-extending knee flexors 1.9-fold with NHT
  grade: promising
limitations:
- n = 14 per group; untrained in these exercises; machine LSET vs bodyweight NHT also differ in load control.
