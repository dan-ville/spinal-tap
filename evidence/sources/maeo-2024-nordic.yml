id: maeo-2024-nordic
title: 'Hamstrings Hypertrophy Is Specific to the Training Exercise: Nordic Hamstring versus Lengthened State Eccentric
  Training.'
authors:
- Maeo S
- Balshaw TG
- Nin DZ
- Mc Dermott EJ
- Osborne T
- Cooper NB
- Massey GJ
