id: fyfe-2016-intensity
title: Endurance Training Intensity Does Not Mediate Interference to Maximal Lower-Body Strength Gain during Short-Term Concurrent
  Training
authors:
- Fyfe JJ
- Bartlett JD
- Hanson ED
- Stepto NK
- Bishop DJ
year: 2016
venue: Front Physiol 7:487
doi: 10.3389/fphys.2016.00487
pmid: '27857692'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5093324/
design: rct
population: Recreationally active males, 29.6 y, VO2peak 44 ml/kg/min; 8 wk, 3 sessions/wk
sample:
  studies: null
  participants: 23
read_level: full-text
findings:
- claim: Adding either HIIT or work-matched continuous cycling to resistance training reduced leg-press 1RM gains by a similar
    amount.
  effect: '1RM: RT +38.5 +/- 8.5%, HIT+RT +28.7 +/- 5.3%, MICT+RT +27.5 +/- 4.6%; RT vs HIT+RT 7.4 +/- 8.7% (ES 0.40 +/- 0.40),
    vs MICT+RT 8.2 +/- 9.9% (ES 0.60 +/- 0.45) (mean +/- 90% CL)'
  grade: promising
- claim: RT alone produced larger countermovement-jump force and RFD gains than concurrent training; HIIT blunted lower-body
    lean mass gain.
  effect: CMJ RFD RT vs HIT+RT 24.1 +/- 26.1% (ES 0.72 +/- 0.88); lean mass RT +4.1%, MICT+RT +3.6%, HIT+RT +1.8%
  grade: speculative
limitations:
- n=7-8 per group, 8 weeks; magnitude-based inference; cycling only.
topics:
- concurrent/moderators
- concurrent/hiit
- concurrent/explosive-strength
