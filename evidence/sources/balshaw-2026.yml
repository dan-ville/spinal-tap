  by: verification pass
  notes: "Full text (PMC13652124) read; read_level raised to full-text. Ultrasound thickness was measured at 11 sites (2-3 per muscle), not a single site. Group-level underestimation was significant for the whole quadriceps, VL and VM but not VI or RF; quadriceps mean offset -7.3% (vs ACSA) and -7.8% (vs volume), more than half the MRI change. Individual changes uncorrelated with MRI. Pre-training MT vs MRI size r = 0.455-0.525 for the whole quadriceps. Same 39 men as marques-2025. | Prior check: chapter 2 researcher 2026-11-24; Full text downloaded but numbers taken from its abstract section."
