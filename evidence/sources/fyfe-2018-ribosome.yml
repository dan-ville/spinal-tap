id: fyfe-2018-ribosome
title: Enhanced skeletal muscle ribosome biogenesis, yet attenuated mTORC1 and ribosome biogenesis-related signalling, following
  short-term concurrent versus single-mode resistance training
authors:
- Fyfe JJ
- Bishop DJ
- Bartlett JD
- Hanson ED
- Anderson MJ
- Garnham AP
- Stepto NK
year: 2018
venue: Sci Rep 8:560
doi: 10.1038/s41598-017-18887-6
pmid: '29330460'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5766515/
design: rct
population: Recreationally active males, 8 wk (same cohort as Fyfe 2016)
sample:
  studies: null
  participants: 23
read_level: full-text
findings:
- claim: After 8 weeks, basal ribosome-biogenesis markers (45S pre-rRNA, 5.8S and 28S rRNA) rose more with concurrent than
    resistance-only training, but in the final session resistance-only training produced larger mTORC1 and rRNA-transcription
    signalling (p70S6K1, rps6, TIF-1A, UBF).
  effect: e.g. RT p-UBF Ser388 +125% at 3 h (ES 1.15); RT 5.8S rRNA PRE-POST -51% (ES -0.69)
  grade: speculative
limitations:
- Small groups, many outcomes, magnitude-based inference; molecular markers not linked to measured hypertrophy differences.
topics:
- concurrent/molecular
- concurrent/training-status
