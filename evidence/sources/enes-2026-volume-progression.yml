title: How Often Should Volume Increase? Effects of Different Volume-Progression Frequencies on Strength and Hypertrophy Adaptations in Women
authors: [Enes A, Macedo ACG, Nass G, Costa-Rodrigues J, Alves-Marques F, Santana C, Dell'Avanzi FG, Rodrigues BG, Alves RC, De Souza EO, Souza-Junior TP]
