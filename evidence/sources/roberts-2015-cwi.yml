id: roberts-2015-cwi
title: "Post-exercise cold water immersion attenuates acute anabolic signalling and long-term adaptations in muscle to strength training"
authors: [Roberts LA, Raastad T, Markworth JF, Figueiredo VC, Egner IM, Shield A, Cameron-Smith D, Coombes JS, Peake JM]
year: 2015
venue: "Journal of Physiology 593(18):4285-4301"
doi: "10.1113/JP270570"
pmid: "26174323"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4594298/
design: rct
population: "Physically active men; Study 1: 12 wk strength training 2x/wk with 10 min CWI vs active recovery (n = 21); Study 2: acute biopsies (n = 9)"
sample: {studies: null, participants: 30}
read_level: full-text
findings:
  - claim: "Twelve weeks of CWI after strength sessions reduced gains in strength and muscle mass; type II fibre area and myonuclei rose only with active recovery."
    effect: "Active recovery: isokinetic work +19%, type II fibre CSA +17%, myonuclei per fibre +26% (all P < 0.05); no significant change with CWI"
    grade: promising
  - claim: "CWI blunted the acute rise in satellite cells and p70S6K phosphorylation after exercise, a plausible mechanism."
    effect: "NCAM+ and Pax7+ satellite cells and p70S6K(Thr421/Ser424) greater after active recovery (P < 0.05)"
    grade: promising
limitations:
  - "Small samples; recreationally active men; CWI compared with active (not passive) recovery."
topics: [recovery/cold-water-immersion, hypertrophy/recovery]
cited_in: [research/theses/strength-and-mobility/chapters/10-recovery-and-nutrition.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Full text read via NCBI PMC (PMC4594298, efetch). Confirmed: 21 physically active men, 12 wk, 2 d/wk, 10 min CWI vs active recovery; ACT gains in type II fibre CSA (17%) and myonuclei per fibre (26%) not seen with CWI; acute study (n = 9) blunted Pax7+/NCAM+ satellite cells and p70S6K phosphorylation."}
