id: pritchard-2018-training-cessation
title: Short-Term Training Cessation as a Method of Tapering to Improve Maximal Strength
authors: [Pritchard HJ, Barnes MJ, Stewart RJC, Keogh JWL, McGuigan MR]
year: 2018
venue: Journal of Strength and Conditioning Research 32(2):458-465
doi: 10.1519/JSC.0000000000001803
pmid: '29369954'
url: https://pubmed.ncbi.nlm.nih.gov/29369954/
design: crossover
population: Resistance-trained men (deadlift 1.9x BW); two 4-wk blocks then 3.5 or 5.5 days off
sample: {studies: null, participants: 8}
read_level: abstract
findings:
- claim: A few days of complete rest after a training block raised jump height and isometric bench force, with no difference between 3.5 and 5.5 days.
  effect: CMJ T1 to T3 p = 0.022 (ES 0.30); isometric bench p = 0.008 (ES 0.21); no other significant differences
  grade: speculative
limitations: ['n = 8; isometric and jump outcomes, not 1RM.']
