id: harris-2016-strongman-acute
title: Acute Physiological Responses to Strongman Training Compared to Traditional Strength Training
authors:
- Harris NK
- Woulfe CJ
- Wood MR
- Dulson DK
- Gluchowski AK
- Keogh JB
year: 2016
venue: J Strength Cond Res 30(5):1397-1408
doi: 10.1519/JSC.0000000000001217
pmid: '26439778'
url: https://pubmed.ncbi.nlm.nih.gov/26439778/
design: crossover
population: Healthy men, 23.6 y, 85.8 kg
sample:
  studies: null
  participants: 10
read_level: abstract
findings:
- claim: A strongman session (sled drag, farmer's walk, one-arm dumbbell clean and press, tyre flip; ~30 s near-maximal sets)
    elicited heart-rate, energy-expenditure and lactate responses equivalent to a duration-matched traditional lifting session.
  effect: Lactate rose significantly after both sessions; HR and energy expenditure elevated during both (values not in abstract)
  grade: promising
limitations:
- n=10, acute, not trained strongmen; 'cardiovascular conditioning' adaptation is the authors' conjecture.
topics:
- conditioning/strongman
