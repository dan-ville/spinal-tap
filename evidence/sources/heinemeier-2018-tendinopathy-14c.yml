id: heinemeier-2018-tendinopathy-14c
title: "Carbon-14 bomb pulse dating shows that tendinopathy is preceded by years of abnormally high collagen turnover"
authors: [Heinemeier KM, Schjerling P, Ohlenschlaeger TF, Eismark C, Olsen J, Kjaer M]
year: 2018
venue: "FASEB J 32(9):4763-4775"
