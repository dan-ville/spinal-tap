design: systematic-review
population: Acute and chronic trials of lower-body accentuated eccentric loading vs traditional loading
sample:
  studies: 20
  participants: null
read_level: abstract
findings:
- claim: Chronic accentuated eccentric loading programmes increased maximal strength by about 9-22% and jump height
    by 4-11%, generally comparable or superior to traditional training; transfer to sprint and change of direction
    was inconsistent.
  effect: Narrative; GRADE moderate for strength, low to very low for speed
  grade: promising
limitations:
- No pooling; heterogeneous AEL methods; hypertrophy not a primary outcome.
