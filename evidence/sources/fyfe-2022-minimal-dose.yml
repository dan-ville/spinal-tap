id: fyfe-2022-minimal-dose
title: 'Minimal-Dose Resistance Training for Improving Muscle Mass, Strength, and Function: A Narrative Review of Current Evidence and Practical Considerations'
authors: [Fyfe JJ, Hamilton DL, Daly RM]
year: 2022
venue: Sports Med 52(3):463-479
doi: 10.1007/s40279-021-01605-8
pmid: '34822137'
url: https://pubmed.ncbi.nlm.nih.gov/34822137/
design: narrative-review
population: Younger and older adults
sample: {studies: null, participants: null}
read_level: abstract
findings:
- claim: Minimal doses of resistance training, either low-volume high-load sessions at low frequency or frequent low-load 'exercise snacks', can improve strength and function in younger and older adults.
  effect: Narrative synthesis
  grade: promising
- claim: Strength and power decline up to eight times faster than muscle mass across the lifespan and are more strongly linked to function and mortality, so ageing programmes should prioritise strength and power.
  effect: Narrative (cited literature)
  grade: promising
limitations: [Narrative review; minimal-dose trials are short and mostly in untrained people.]
topics: [frontiers/ageing, strength/minimal-dose]
