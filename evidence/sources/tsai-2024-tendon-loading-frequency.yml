id: tsai-2024-tendon-loading-frequency
title: "Effect of the temporal coordination and volume of cyclic mechanical loading on human Achilles tendon adaptation in men"
authors: [Tsai MS, Domroes T, Pentidis N, Koschinski S, Schroll A, Bohm S, Arampatzis A, Mersmann F]
year: 2024
venue: "Sci Rep 14(1):6875"
doi: "10.1038/s41598-024-56840-6"
pmid: "38519507"
url: https://pubmed.ncbi.nlm.nih.gov/38519507/
design: rct
population: "Young adult men; legs randomised to five isometric plantar-flexion protocols at 90% MVC (~4.5-6.5% tendon strain) or control; 16 wk; 91 legs included, 72 analysed"
sample: {studies: null, participants: null}
read_level: full-text
findings:
  - claim: "Sessions per week (2.5 vs 5) and weekly loading volume (180 vs 300 s at high strain) did not systematically change Achilles tendon adaptation; low-volume protocols were at least as effective."
    effect: "Normalised stiffness Cohen d (95% CI): HFHV 0.49 (-0.01 to 0.99), HFLV 1.31 (0.73 to 1.89), LFHV 0.61 (0.11 to 1.11), LFLV 0.85 (0.33 to 1.38), REF 0.90 (0.34 to 1.45), control -0.12 (-0.6 to 0.35); pooled low vs high volume p=0.04 favouring low volume"
    grade: promising
  - claim: "Most of the stiffness gain occurred within the first 8 weeks and was material rather than morphological."
    effect: "Reference protocol +34% normalised stiffness at 16 wk; CSA d 0.09 to 0.36"
    grade: promising
  - claim: "Individual responses varied widely."
    effect: "CV of stiffness change 76.5% to 126.0% across protocols"
    grade: promising
limitations:
  - "Legs (not people) as units, n=11-13 legs per protocol; 20.9% drop-out; recreationally active men; isometric home device."
topics: [connective-tissue/tendon, connective-tissue/loading-parameters, connective-tissue/time-course]
cited_in: [research/theses/strength-and-mobility/chapters/08-connective-tissue.md, research/theses/strength-and-mobility/notes/connective-tissue.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Ch8 verification: Full text (PMC10960029) re-read. Confirmed: one set = 4 x 3 s at 90% MVC; HF = 5 sessions/wk (24-48 h apart), LF = 2.5/wk (48-96 h); low volume 180 s/wk = 15 sets/wk (HFLV 3 sets x 5 sessions, LFLV 6 sets x 2.5 sessions); REF 5 sets x 4/wk = 240 s. Pooled low vs high volume p=0.04; d values confirmed; REF +34%; mean CSA +4.3% vs stiffness ~33%. Note 'material' changes are inferred from stiffness vs CSA; modulus was not reported. The first 3 weeks were a 70% MVC habituation phase. Strain during MVC in the home device was 6.8 +/- 1.3% (subgroup of 18). | Prior check: chapter 8 literature researcher"}
