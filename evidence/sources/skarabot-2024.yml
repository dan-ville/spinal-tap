id: skarabot-2024
title: Greater motor unit discharge rate during rapid contractions in chronically strength-trained individuals.
authors:
- Skarabot J
- Casolo A
- Balshaw TG
- Maeo S
- Lanza MB
- Holobar A
- Del Vecchio A
- Folland JP
year: 2024
venue: J Neurophysiol 132(6):1896-1906
doi: 10.1152/jn.00017.2024
pmid: '39527019'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11687832/
design: cross-sectional
population: Chronically strength-trained men (elbow flexors 6 +/- 4 y; knee extensors 9 +/- 4 y) vs untrained
  men
sample:
  studies: null
  participants: 46
read_level: full-text
findings:
- claim: Strength-trained men showed higher initial motor unit discharge rates during rapid (maximal RFD)
    contractions in both biceps brachii and vastus lateralis.
  effect: BB 74 [68, 80] vs 56 [50, 63] pps (P < 0.0001); VL 102 [90, 115] vs 76 [63, 90] pps (P = 0.0025)
  grade: promising
- claim: Despite greater spinal output, relative (to MVT) RFD did not differ, consistent with slower intrinsic
    contractile properties or greater maximal force in trained muscle.
  effect: absolute RFD higher in first 150 ms; relative RFD no difference
  grade: promising
limitations:
- Cross-sectional; cannot show the discharge-rate difference is caused by training.
- Isometric single-joint tasks; motor units decoded only early in the contraction.
- "Loughborough cohort: untrained and long-term-trained men overlap across balshaw-2021, maden-wilkinson-2020, skarabot-2021-emg, balshaw-2022, casolo-2021 and skarabot-2024; treat them as one evidence base, not independent replications."
