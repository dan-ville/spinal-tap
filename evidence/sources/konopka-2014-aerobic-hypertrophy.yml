id: konopka-2014-aerobic-hypertrophy
title: Skeletal muscle hypertrophy after aerobic exercise training
authors:
- Konopka AR
- Harber MP
year: 2014
venue: Exerc Sport Sci Rev 42(2):53-61
doi: 10.1249/JES.0000000000000007
pmid: '24508740'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4523889/
design: narrative-review
population: Review, mostly untrained young and older adults on cycle training
sample:
  studies: null
  participants: null
read_level: abstract
findings:
- claim: Aerobic (mainly cycle) training can acutely and chronically raise muscle protein synthesis and produce whole-muscle
    hypertrophy in untrained people.
  effect: Narrative review; no pooled effect
  grade: promising
limitations:
- Effect seen mainly in untrained/older people; unlikely to add measurable hypertrophy in trained lifters.
