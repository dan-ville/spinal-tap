id: lee-2024-collagen-dose
title: "The Collagen Synthesis Response to an Acute Bout of Resistance Exercise Is Greater when Ingesting 30 g Hydrolyzed Collagen Compared with 15 g and 0 g in Resistance-Trained Young Men"
authors: [Lee J, Tang JCY, Dutton J, Dunn R, Fraser WD, Enright K, Clark DR, Stewart CE, Erskine RM]
year: 2024
venue: "J Nutr 154(7):2076-2086"
doi: "10.1016/j.tjnut.2023.10.030"
pmid: "38007183"
url: https://pubmed.ncbi.nlm.nih.gov/38007183/
design: crossover
population: "Resistance-trained young men; 0, 15 or 30 g hydrolysed collagen + 50 mg vitamin C 1 h before 4 x 10RM back squats"
sample: {studies: null, participants: 10}
read_level: full-text
findings:
  - claim: "30 g, but not 15 g, hydrolysed collagen before heavy squats raised the whole-body collagen synthesis marker PINP over 6 h compared with placebo."
    effect: "PINP AUC 30 g 267 +/- 79 vs 15 g 235 +/- 70 (P=0.013) vs 0 g 219 +/- 88 ug/L/h (P=0.002); 0 vs 15 g P=0.225; beta-CTX fell similarly in all"
    grade: promising
limitations:
  - "n=10; blood marker of whole-body (largely bone) collagen synthesis, not tendon; 6 h window."
  - "n=10 crossover, 6-h window; PINP is a whole-body (mainly bone) marker. The authors note Aussieker 2023 found 30 g collagen taken after exercise did not raise PINP more than the comparator."
topics: [connective-tissue/collagen-supplement]
cited_in: [research/theses/strength-and-mobility/chapters/08-connective-tissue.md]
