id: claassen-2026-load-velocity
title: 'Reliability, Device Agreement and Validity of Load-Velocity Profiles: A Systematic Review with Meta-analysis'
authors: [Claassen N, Siegel SD, Sproll M, Lebelt N, Bargende AV, Fasold AM, Warneke K]
year: 2026
venue: Sports Med Open 12(1):131
doi: 10.1186/s40798-026-01102-0
pmid: '42690493'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13542044/
design: meta-analysis
population: Validity/reliability studies of commercial velocity sensors (63) and velocity-based 1RM prediction (38)
sample: {studies: 101, participants: null}
read_level: full-text
findings:
- claim: Commercial velocity sensors show good-to-excellent relative validity, device agreement and reliability on average, with linear position transducers more consistent than IMUs.
  effect: Validity/agreement ICC 0.91-0.92 (0.83-0.97; k = 55 and 439); intra/inter-day reliability ICC 0.90-0.91 (0.85-0.95; k = 228 and 608)
  grade: promising
- claim: Velocity-based 1RM prediction had high average relative validity, but large heterogeneity in lower-body exercises and scarce absolute-agreement data prevent firm conclusions.
  effect: Reliability ICC 0.90 (0.83-0.94; k = 124); validity ICC 0.91 (0.72-0.98; k = 9)
  grade: contested
limitations:
- Relies on ICCs, which reflect ranking consistency rather than absolute error; only 9 validity effects for 1RM prediction; adapted COSMIN quality.
topics: [technology/velocity-based-training, technology/devices]
