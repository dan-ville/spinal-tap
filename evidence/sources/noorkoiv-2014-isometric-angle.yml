id: noorkoiv-2014-isometric-angle
title: Neuromuscular adaptations associated with knee joint angle-specific force change
authors:
- Noorkoiv M
- Nosaka K
- Blazevich AJ
year: 2014
venue: Med Sci Sports Exerc 46(8):1525-1537
doi: 10.1249/MSS.0000000000000269
pmid: '24504427'
url: https://pubmed.ncbi.nlm.nih.gov/24504427/
design: rct
population: Men; isometric knee-extension training at short (38 deg) vs long (87.5 deg) muscle length, 6 wk
sample:
  studies: null
  participants: 16
read_level: abstract
findings:
- claim: Isometric training at short muscle lengths gave angle-specific strength gains explained by neural changes,
    whereas training at long lengths gave gains across angles accompanied by hypertrophy.
  effect: 'SL: +13.4 +/- 9.7% near training angle, related to EMG/Mmax (r = 0.84-0.88); LL: muscle volume and CSA
    increased; fascicle length +5.4 +/- 4.9% in both groups'
  grade: promising
limitations:
- n = 8 per group; 6 wk; fascicle increase not linked to angle-specific force.
topics:
- strength/joint-angle
- strength/isometric
- mobility/mechanisms
