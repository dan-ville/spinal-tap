id: walsh-2021-sleep-consensus
title: "Sleep and the athlete: narrative review and 2021 expert consensus recommendations"
authors: [Walsh NP, Halson SL, Sargent C, Roach GD, Nedelec M, Gupta L, Leeder J, Fullagar HH, Coutts AJ, Edwards BJ, Pullinger SA, Robertson CM, Burniston JG, Lastella M, Le Meur Y, Hausswirth C, Bender AM, Grandner MA, Samuels CH]
year: 2021
venue: "British Journal of Sports Medicine 55(7):356-368"
doi: "10.1136/bjsports-2020-102025"
pmid: "33144349"
url: https://pubmed.ncbi.nlm.nih.gov/33144349/
design: consensus
population: "Athletes (mostly elite); narrative review"
sample: {studies: null, participants: null}
read_level: abstract
findings:
  - claim: "Elite athletes commonly sleep less than 7 h and have fragmented sleep; one or more nights without sleep reduces performance, but the effect of partial restriction over 1-3 nights is unclear."
    effect: "Narrative synthesis"
    grade: promising
  - claim: "Experts recommend an individualised sleep target based on perceived need rather than a fixed 7-9 h, plus education, screening and research into napping and sleep banking."
    effect: "Expert consensus"
    grade: convention
limitations:
  - "Narrative review; studies criticised for poor control, few women and questionable sleep-assessment validity."
