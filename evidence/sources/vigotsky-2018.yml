findings:
- claim: The variance in strength explained by hypertrophy ranged from 0 to 24% depending on site and
    method of size measurement and statistical model; analyses ignoring inter-individual differences may
    underestimate the relationship.
  effect: VAF 0-24.1%; size measures intercorrelated r = 0.326-0.945; within-individual slopes vs strength
    gain rho = 0.36-0.55
  grade: promising
limitations:
- Reanalysis of a small dataset.
