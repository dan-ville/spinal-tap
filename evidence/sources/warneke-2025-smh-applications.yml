design: narrative-review
population: Current opinion on stretch-mediated hypertrophy
sample:
  studies: null
  participants: null
read_level: full-text
findings:
- claim: Only one RCT in athletes (Warneke 2023, JSCR) and one case study of a drug-free bodybuilder have shown
    stretch-mediated hypertrophy in resistance-trained people; >15 min per muscle appears necessary, based on a
    handful of mostly untrained studies of 8 weeks or less; replacing RT with stretching in healthy athletes 'seems
    unreasonable', but supplementary use and immobilisation, diabetes and spaceflight settings merit study.
  effect: Narrative
  grade: speculative
limitations:
- Opinion paper from the group producing most positive trials.
