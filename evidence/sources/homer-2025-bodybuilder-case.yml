id: homer-2025-bodybuilder-case
title: 'The effect of a combined long-duration static stretching and resistance training regimen on a competitive
  bodybuilder: A case study'
authors:
- Homer KA
- Helms ER
- Spence AJ
year: 2025
venue: Physiol Rep 13(2):e70156
doi: 10.14814/phy2.70156
pmid: '39825474'
url: https://pubmed.ncbi.nlm.nih.gov/39825474/
design: other
population: One competitive drug-free bodybuilder; 60 min plantar-flexor stretching 6 x/week for 12 weeks on top
  of habitual RT
sample:
  studies: null
  participants: 1
read_level: abstract
findings:
- claim: Adding an hour of daily calf stretching to habitual training was followed by gains in ROM, strength and
    gastrocnemius thickness, several exceeding a baseline-derived measurement-error band.
  effect: ROM +25.9%; isometric strength +11.4%; MT +7.4-23.4% (4 MT sites beyond 2SD band)
  grade: speculative
limitations:
- n = 1, no control; cannot separate stretching from RT or measurement drift.
