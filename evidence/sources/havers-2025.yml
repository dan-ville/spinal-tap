- research/theses/strength-and-mobility/chapters/07-strength-through-range.md
checked:
  date: '2026-11-24'
  by: verification pass
  notes: 'Ch7 verification: PubMed abstract re-read; n = 13 trained; MVC 100 deg SMD 0.24 and 1RM SMD 0.17 favour
    full ROM; consistent. | Prior check: verification pass 2026-11-24; Ch5 verification: full text re-read (Europe
    PMC PMC12621570): distal SMD 0.10, BF 4.87 favouring partials; 1RM SMD 0.17, BF 1.95 favouring full ROM. Confirmed.
    BF 4.87 is moderate evidence FOR a (trivial) difference, so "not greater" is slightly too strong. | Prior check:
    chapter 5 literature researcher 2026-11-24; Chapter 7 researcher corrected DOI against PubMed (10.1002/ejsc.70087).'
