id: oranchuk-2019
title: 'Isometric training and long-term adaptations: Effects of muscle length, intensity, and intent: A systematic
  review.'
authors:
- Oranchuk DJ
- Storey AG
- Nelson AR
- Cronin JB
year: 2019
venue: Scand J Med Sci Sports 29(4):484-503
doi: 10.1111/sms.13375
pmid: '30580468'
url: https://pubmed.ncbi.nlm.nih.gov/30580468/
design: systematic-review
population: Isometric training studies >= 3 weeks
sample:
  studies: 26
  participants: null
read_level: abstract
findings:
- claim: Isometric training at long muscle lengths produced more hypertrophy and more transfer to dynamic performance
    than short-length training; ballistic intent increased activation and rapid force more.
  effect: Long-length hypertrophy 0.86-1.69%/week vs 0.08-0.83%/week; ballistic intent activation 1.04-10.5%/week
    vs 1.64-5.53%/week
  grade: promising
limitations:
- Systematic review without pooled estimates; few studies.
