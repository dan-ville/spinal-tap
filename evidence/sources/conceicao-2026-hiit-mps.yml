- Camera DM
- Hawley JA
- Ugrinowitsch C
year: 2026
venue: J Appl Physiol 140(2):415-427
doi: 10.1152/japplphysiol.00642.2025
pmid: '41369592'
url: https://pubmed.ncbi.nlm.nih.gov/41369592/
design: rct
population: Previously untrained young men, 16 wk
sample:
  studies: null
  participants: 19
read_level: abstract
findings:
- claim: Over 16 weeks, concurrent training with long-interval HIIT preserved myofibrillar protein synthesis (deuterium oxide),
    satellite-cell and myonuclear responses and type II fibre growth, yet strength gains were smaller than with resistance
    training alone.
  effect: MPS rose 48 h post-exercise at wk 4 and 16 with no group difference (P=0.0105 time); strength gains greater in RT
    (P=0.016); VO2peak improved only in CT (P<0.001)
  grade: promising
limitations:
- n=19 untrained men; 48-h integrated MPS is a proxy; strength vs hypertrophy dissociation suggests neural or fatigue mechanisms.
