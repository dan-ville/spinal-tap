id: conceicao-2026-hiit-mps
title: 'Concurrent training with long-interval HIIT does not impair skeletal muscle protein synthesis or hypertrophy: little
  evidence of an "interference effect"'
authors:
- Conceição M
- Vechin FC
- Telles G
- Lixandrão M
- Ribeiro N
- Riani Costa LA
- Hevia-Larraín V
- Scarpelli MC
- Damas F
