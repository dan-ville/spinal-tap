sample: {studies: null, participants: null}
read_level: abstract
findings:
  - claim: "In engineered ligaments, stretch-induced signalling peaked by 10 min and cells stayed refractory for up to 6 h; 10 min of stretch every 6 h raised collagen content more than continuous stretch."
    effect: "Collagen content: control 3.1 +/- 0.44%, continuous 4.8 +/- 0.30%, intermittent 5.9 +/- 0.56% after 7 d"
    grade: speculative
limitations:
