id: paxton-2012-intermittent-stretch
title: "Optimizing an intermittent stretch paradigm using ERK1/2 phosphorylation results in increased collagen synthesis in engineered ligaments"
authors: [Paxton JZ, Hagerty P, Andrick JJ, Baar K]
year: 2012
venue: "Tissue Eng Part A 18(3-4):277-284"
doi: "10.1089/ten.TEA.2011.0336"
