id: siegel-2026-quadriceps-smh
title: Stretch-mediated hypertrophy and strength increases and their impact on dynamic balance performance - a randomized
  controlled intervention study
authors:
- Siegel SD
- Sproll M
- Lohmann LH
- Lebelt N
- Fasold AM
- Zech A
- Warneke K
year: 2026
venue: Sci Rep 16(1):8482
doi: 10.1038/s41598-026-43038-1
pmid: '41796242'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12972296/
design: rct
population: 49 recreationally active participants; twelve 15-min supervised unilateral hip-flexor stretches per
  leg over 4-5 weeks vs control
sample:
  studies: null
  participants: 49
read_level: abstract
findings:
- claim: Hip-flexor stretching increased rectus femoris thickness and isometric knee-extension strength in the shortened
    (70 deg) but not the lengthened (110 deg) position, with inconsistent vastus lateralis effects.
  effect: RF proximal eta_p2 = 0.24-0.41; distal 0.14-0.40; VL eta_p2 = 0.18 left leg only; strength at 70 deg eta_p2
    = 0.09-0.21; n.s. at 110 deg
  grade: speculative
limitations:
- 4-5 weeks; ultrasound; intensity by perceived pain; effect sizes as partial eta squared, not comparable with SMDs;
  authors note small effects relative to RT.
topics:
- flexibility/stretch-hypertrophy
