id: cramer-2015-yoga-safety
title: 'The Safety of Yoga: A Systematic Review and Meta-Analysis of Randomized Controlled Trials'
authors:
- Cramer H
- Ward L
- Saper R
- Fishbein D
- Dobos G
- Lauche R
year: 2015
venue: Am J Epidemiol 182(4):281-293
doi: 10.1093/aje/kwv071
pmid: '26116216'
url: https://pubmed.ncbi.nlm.nih.gov/26116216/
design: meta-analysis
population: RCTs of yoga reporting adverse events (1975-2014)
sample:
  studies: 94
  participants: 8430
read_level: abstract
findings:
- claim: Yoga had adverse-event rates similar to usual care and other exercise, though more non-serious events than
    psychological or educational controls.
  effect: 'vs psychological/educational controls: intervention-related AEs OR 4.21 (95% CI 1.01 to 17.67); non-serious
    AEs OR 7.30 (1.91 to 27.92); no difference vs usual care or exercise'
  grade: promising
limitations:
- Only 94 of 301 RCTs reported adverse events; mostly clinical populations; poor safety reporting.
topics:
- mobility/practitioner-systems
- flexibility/yoga
