id: wolf-2023-rom
title: 'Partial Vs Full Range of Motion Resistance Training: A Systematic Review and Meta-Analysis'
authors:
- Wolf M
- Androulakis-Korakakis P
- Fisher JP
- Schoenfeld BJ
- Steele J
year: 2023
venue: International Journal of Strength and Conditioning 3(1)
doi: 10.47206/ijsc.v3i1.182
pmid: null
url: https://doi.org/10.47206/ijsc.v3i1.182
design: meta-analysis
population: Trials comparing partial vs full ROM resistance training; mostly untrained young adults
sample:
  studies: 23
  participants: null
read_level: full-text
findings:
- claim: Across all outcomes full ROM was trivially better than partial ROM; for muscle size the difference was trivial.
  effect: All outcomes SMD 0.12 (95% CI -0.02 to 0.26) favouring full ROM; muscle size SMD 0.04 (-0.17 to 0.25); strength
    0.14 (-0.01 to 0.29)
  grade: promising
- claim: Exploratory subgroups suggested partial ROM at long muscle lengths may produce more hypertrophy than full
    ROM, whereas partial ROM at short lengths was slightly worse than full ROM.
  effect: Long-length partial vs full SMD -0.28 (-0.81 to 0.16) favouring partial; short-length partial vs full SMD
    0.08 (-0.24 to 0.42) favouring full
  grade: speculative
- claim: 'Strength gains were specific to the ROM trained: outcomes biased toward the full-ROM condition favoured
    full ROM.'
  effect: SMD 0.32 (0.14 to 0.49) when the test favoured full ROM; -0.12 (-0.31 to 0.07) when it favoured partial
  grade: promising
limitations:
- Bayesian multilevel model; subgroup analyses exploratory and underpowered; 19 of 23 studies trained partial ROM
  mostly at short lengths; theses included; lenient quality assessment.
topics:
- hypertrophy/range-of-motion
- hypertrophy/muscle-length
- strength/range-of-motion
- strength/specificity
