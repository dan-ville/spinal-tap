id: wohlann-2024-pec-stretch
title: Influence of 8-weeks of supervised static stretching or resistance training of pectoral major muscles on
  maximal strength, muscle thickness and range of motion
authors:
- Wohlann T
- Warneke K
- Kalder V
- Behm DG
- Schmidt T
- Schiemann S
year: 2024
venue: Eur J Appl Physiol 124(6):1885-1893
doi: 10.1007/s00421-023-05413-y
pmid: '38240811'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11129965/
design: rct
population: Recreationally active adults; supervised pectoral static stretching 15 min/day 4 d/wk vs resistance
  training 3x/wk (5 x 12) vs control, 8 wk
sample:
  studies: null
  participants: 81
read_level: abstract
findings:
- claim: High-volume pectoral stretching (about 1 h/week) increased bench-press-related maximal strength and pectoral
    thickness as much as resistance training, while only stretching increased shoulder ROM more than resistance
    training.
  effect: Stretch vs RT strength and thickness d = 0.036-0.087 (p = 0.905-0.983); flexibility stretch > RT d = 0.789
    (p = 0.001)
  grade: speculative
limitations:
- Recreationally active, not trained lifters; equipment-assisted stretching; same research group as most stretch-hypertrophy
  trials; abstract-level read.
topics:
- mobility/loaded-stretching
- hypertrophy/muscle-length
- flexibility/stretching
