findings:
- claim: 'Relative intensity and velocity loss both shaped adaptations: 70-85% 1RM gave the largest strength and size gains; among VL thresholds of 0, 15, 25 and 50%, 25% gave the largest 1RM gains and 50% the most hypertrophy and endurance.'
