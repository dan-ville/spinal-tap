id: hickson-1980
title: Interference of strength development by simultaneously training for strength and endurance
authors:
- Hickson RC
year: 1980
venue: Eur J Appl Physiol Occup Physiol 45(2-3):255-263
doi: 10.1007/BF00421333
pmid: '7193134'
url: https://pubmed.ncbi.nlm.nih.gov/7193134/
design: rct
population: Healthy young adults (men and women), previously not strength-trained
sample:
  studies: null
  participants: null
read_level: abstract
findings:
- claim: Adding very high-volume endurance training (6 d/wk, ~40 min/d running and cycling intervals) to heavy leg strength
    training 5 d/wk let strength rise at the same rate as strength-only for ~7 weeks, after which it levelled off and declined
    in weeks 9-10; VO2max gains were unaffected.
  effect: VO2max +~25% (cycle) and +~20% (treadmill) in E and S+E; S+E leg strength plateaued/declined after week 7 (no between-group
    effect size reported in abstract)
  grade: established
limitations:
- Very small sample, untrained participants, extreme combined volume (11 sessions/wk) unlike most practice; group sizes and
  effect sizes not in abstract; non-standardised order with 15 min to 2 h between modes (per Baar 2014).
topics:
- concurrent/interference
- concurrent/history
