  notes: "Ch11 verification: Europe PMC full text re-read. SD_IR^2 values, CLs and r values confirmed, but biceps curl r is 0.393 in the abstract and 0.383 in the Results (both p = 0.095). 4 of 20 were below MDC in both periods, all on one strength variable each (1 leg press, 3 biceps curl); single-period non-response was common for biceps curl 1RM (11 of 20 after RT2). Non-response classification by MDC is itself a responder count (atkinson-2019). | Earlier check (verification pass): Chapter 2 verifier re-read the abstract; numbers confirmed. Untrained participants, so not evidence about training age. | Prior check: chapter 2 researcher 2026-11-24; Full text downloaded but numbers taken from its abstract section. | Chapter 11 researcher read PMC full text (PMC12659766) and upgraded read_level."
