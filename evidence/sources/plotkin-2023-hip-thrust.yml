id: plotkin-2023-hip-thrust
title: Hip thrust and back squat training elicit similar gluteus muscle hypertrophy and transfer similarly to the
  deadlift.
authors:
- Plotkin DL
- Rodas MA
- Vigotsky AD
- McIntosh MC
- Breeze E
- Ubrik R
- Robitzsch C
