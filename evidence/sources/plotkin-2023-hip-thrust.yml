- Beyers RJ
- Henselmans M
- Contreras BM
- Roberts MD
year: 2023
venue: Front Physiol 14:1279170
doi: 10.3389/fphys.2023.1279170
pmid: '37877099'
url: https://pubmed.ncbi.nlm.nih.gov/37877099/
design: rct
population: Untrained college-aged adults; set-matched back squat vs hip thrust, 9 wk, MRI
sample:
  studies: null
  participants: 34
read_level: abstract
findings:
- claim: Hip thrusts and back squats produced similar gluteus maximus growth, but squats grew the quadriceps and adductors
    more; first-session EMG favoured the hip thrust but did not predict gluteal growth.
  effect: 'Gluteal mCSA differences (negative favours HT): lower -1.6 cm2 (95% CI -6.1 to 2.0), mid -0.5 (-4.0 to
    2.6), upper -0.5 (-5.8 to 4.1); quadriceps +3.6 (0.7 to 6.4) and adductors +2.5 (1.2 to 3.9) favouring squat'
  grade: promising
limitations:
- Untrained; 9 weeks; set-volume (not effort) matched.
topics:
- hypertrophy/exercise-selection
- hypertrophy/regional
