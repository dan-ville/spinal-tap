id: behm-2016-acute-stretching
title: 'Acute effects of muscle stretching on physical performance, range of motion, and injury incidence in healthy
  active individuals: a systematic review'
authors:
- Behm DG
- Blazevich AJ
- Kay AD
- McHugh M
year: 2016
venue: Appl Physiol Nutr Metab 41(1):1-11
doi: 10.1139/apnm-2015-0235
pmid: '26642915'
url: https://pubmed.ncbi.nlm.nih.gov/26642915/
design: systematic-review
population: Healthy active individuals
sample:
  studies: null
  participants: null
read_level: abstract
findings:
- claim: 'Performance changes tested immediately after stretching were small: static -3.7%, dynamic +1.3%, PNF -4.4%;
    static deficits were larger with >=60 s per muscle group than with <60 s.'
  effect: SS -3.7%; DS +1.3%; PNF -4.4%; SS >=60 s -4.6% vs <60 s -1.1%
  grade: established
- claim: Static stretching gave a moderate (2.2%) performance benefit at long muscle lengths, and when post-stretch
    dynamic activity was included no clear performance effect was seen.
  effect: +2.2% at longer muscle lengths
  grade: promising
- claim: Acute ROM gains from all stretching forms typically lasted under 30 min; static and PNF stretching had
    no clear effect on all-cause or overuse injury.
  effect: Qualitative
  grade: promising
limitations:
- Pooled percentage changes; testing usually 3-5 min after stretching without re-warm-up, unlike practice.
topics:
