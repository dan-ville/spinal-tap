id: sivaramakrishnan-2019-yoga
title: The effects of yoga compared to active and inactive controls on physical function and health related quality
  of life in older adults- systematic review and meta-analysis of randomised controlled trials
authors:
- Sivaramakrishnan D
- Fitzsimons C
- Kelly P
- Ludwig K
- Mutrie N
- Saunders DH
- Baker G
year: 2019
venue: Int J Behav Nutr Phys Act 16(1):33
doi: 10.1186/s12966-019-0789-2
pmid: '30953508'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6451238/
design: meta-analysis
population: Older adults (>= 60 y) without specific disease; yoga vs inactive or active controls
sample:
  studies: 22
  participants: null
read_level: full-text
findings:
- claim: Yoga improved lower-body flexibility and lower-limb strength versus inactive controls by moderate amounts,
    and by smaller but significant amounts versus active exercise controls.
  effect: 'vs inactive: lower-body flexibility g = 0.50 (95% CI 0.30 to 0.69), lower-limb strength 0.45 (0.22 to 0.68),
    upper-body flexibility 0.28 (-0.02 to 0.58); vs active: strength 0.49 (0.10 to 0.88), lower-body flexibility 0.28
    (0.01 to 0.54)'
  grade: promising
limitations:
- Older, mostly untrained adults; field tests (chair sit-and-reach, chair stand); comparators heterogeneous; indirect
  for trained strength athletes.
topics:
- mobility/practitioner-systems
- flexibility/yoga
