id: weakley-2021-devices
title: "The Validity and Reliability of Commercially Available Resistance Training Monitoring Devices: A Systematic Review"
authors: [Weakley J, Morrison M, Garcia-Ramos A, Johnston R, James L, Cole MH]
year: 2021
venue: "Sports Medicine 51(3):443-502"
doi: "10.1007/s40279-020-01382-w"
pmid: "33475985"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7900050/
design: systematic-review
population: "Validation studies of commercial velocity and power devices (linear transducers, accelerometers, optical systems, apps)"
sample: {studies: 44, participants: null}
read_level: full-text
findings:
  - claim: "Linear position transducers are the most accurate and reliable commercial devices for measuring bar velocity; most validation studies lacked a gold-standard criterion."
    effect: "Qualitative synthesis of 44 studies"
    grade: promising
  - claim: "Many reliability studies did not separate technological from biological variability, so device precision is uncertain."
    effect: "Methodological critique"
    grade: established
limitations:
  - "Device models change faster than validation studies; mostly squat and bench, few weightlifting movements."
