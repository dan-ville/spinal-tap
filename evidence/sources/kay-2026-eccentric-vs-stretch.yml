id: kay-2026-eccentric-vs-stretch
title: Within-session dose-response and between-session carry-over effects of eccentric contractions versus static
  stretches on range of motion and muscle-tendon mechanics
authors:
- Kay AD
- Baross AW
- Baxter BA
- Blazevich AJ
year: 2026
venue: Eur J Appl Physiol 126:1079-1095
doi: 10.1007/s00421-025-05979-9
pmid: '40968159'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12948847/
design: crossover
population: Recreationally active adults; isokinetic eccentric plantar-flexor contractions vs static stretching
  matched for time under tension (150 s)
sample:
  studies: null
  participants: 18
read_level: full-text
findings:
- claim: Within a session, eccentric contractions produced more than twice the acute dorsiflexion ROM gain of time-matched
    static stretching, and only eccentric contractions increased stretch tolerance and reduced Achilles tendon stiffness.
  effect: 'ROM +2.2 to 6.0 deg across conditions; EC1 stretch tolerance +30.7%, Achilles stiffness -12.0%; carry-over
    after two sessions: ROM +5.9 deg, stretch tolerance +38.0% (collapsed)'
  grade: speculative
limitations:
- Acute and two-session data only; 18 analysed of 20 recruited; laboratory isokinetic eccentrics.
