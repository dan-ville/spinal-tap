id: kong-2025-sleep-deprivation
title: "Effects of sleep deprivation on sports performance and perceived exertion in athletes and non-athletes: a systematic review and meta-analysis"
authors: [Kong Y, Yu B, Guan G, Wang Y, He H]
year: 2025
venue: "Frontiers in Physiology 16:1544286"
doi: "10.3389/fphys.2025.1544286"
pmid: "40236824"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11996801/
design: meta-analysis
population: "Athletes (28 studies) and healthy non-athletes (17 studies), 670 participants; 42 randomised crossovers and 3 RCTs to September 2024"
sample: {studies: 45, participants: 670}
read_level: full-text
findings:
  - claim: "Sleep deprivation reduced maximal force in athletes, with the largest effect when sleep was cut at the end of the night (early waking)."
    effect: "Maximal force in athletes SMD -0.35 (95% CI -0.56 to -0.14); end-of-night partial deprivation (PSDE) SMD -0.57 (-0.94 to -0.19); afternoon tests SMD -0.30 (-0.51 to -0.09)"
    grade: promising
  - claim: "Sleep deprivation raised ratings of perceived exertion."
    effect: "RPE SMD 0.39 (95% CI 0.11 to 0.66)"
    grade: promising
limitations:
  - "The abstract labels PSDE 'early sleep deprivation', but the methods define it as deprivation at the end of the night, which matches late restriction in Craven 2022."
  - "Pooled SMDs across varied tests; only 10 maximal-force studies; RoB 2 used but no GRADE."
  - "Maximal force pooled with a fixed-effect model (overall SMD -0.24, 95% CI -0.40 to -0.09, 10 articles); outcomes mostly isometric MVC and handgrip, not dynamic 1RM."
  - "Total sleep deprivation did not significantly reduce maximal force (SMD -0.16, -0.39 to 0.06), unlike Craven 2022 where only total deprivation was significant."
topics: [recovery/sleep]
cited_in: [research/theses/strength-and-mobility/chapters/10-recovery-and-nutrition.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Full text re-read. Numbers confirmed (athlete MF SMD -0.35; PSDE -0.57; PM -0.30; RPE 0.39 in athletes). Added: overall MF pooled SMD -0.24 (-0.40 to -0.09), fixed-effect, 10 articles; non-athletes -0.10 (NS); TSD -0.16 (-0.39 to 0.06) and PSDB -0.19 (NS) for MF. Kong therefore DISAGREES with Craven on total deprivation (significant in Craven, not in Kong). 'Maximum force' is mostly isometric MVC/handgrip, not 1RM. 42 of 45 included studies are crossovers. | Earlier note (chapter 10 literature researcher): PSDB/PSDE definitions checked in methods"}
