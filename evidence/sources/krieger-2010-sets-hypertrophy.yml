findings:
- claim: Multiple sets per exercise produced about 40% larger hypertrophy effect sizes than single sets.
  effect: Difference 0.10 +/- 0.04 (95% CI 0.02 to 0.19), p = 0.016; ES 0.24 (1 set), 0.34 (2-3 sets), 0.44 (4-6 sets)
  grade: established
limitations:
- Eight studies, 55 effect sizes; many indirect hypertrophy measures.
