id: krieger-2010-sets-hypertrophy
title: 'Single vs. multiple sets of resistance exercise for muscle hypertrophy: a meta-analysis'
authors: [Krieger JW]
year: 2010
venue: Journal of Strength and Conditioning Research 24(4):1150-1159
doi: 10.1519/JSC.0b013e3181d4d436
