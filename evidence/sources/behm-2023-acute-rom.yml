year: 2023
venue: Sports Med Open 9(1):107
doi: 10.1186/s40798-023-00652-x
pmid: '37962709'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10645614/
design: meta-analysis
population: Healthy participants in single-bout stretching studies vs non-active control
sample:
  studies: 47
  participants: null
read_level: full-text
findings:
- claim: A single bout of stretching gave a small acute ROM increase, not moderated by technique, intensity, trained
    state, sex, age or duration; hip adductor ROM did not improve.
  effect: SMD = -0.555 (95% CI -0.677 to -0.434), I2 = 33%; technique p = 0.72; intensity p = 0.76; trained state
    p = 0.99; duration meta-regression p = 0.39; GRADE moderate
  grade: established
limitations:
- Averaged dependent effects (CMA software); acute ROM gains typically last under 30 min (Behm 2016).
