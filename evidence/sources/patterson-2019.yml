findings:
- claim: 'Recommended BFR resistance prescription: 20-40% 1RM, 2-4 sets (commonly 30-15-15-15 reps, 75 total), 30-60
    s rest with cuff kept inflated, 5-10 min restriction per exercise, 2-3 sessions per week, pressure 40-80% of individually
    measured arterial occlusion pressure.'
  effect: Table 1 and text
  grade: convention
- claim: The authors report minimal adverse events for venous thromboembolism in the BFR literature but advise screening
    for thrombosis risk factors and note higher pressures increase cardiovascular responses.
  effect: Narrative safety review
  grade: promising
limitations:
- Expert position stand; safety evidence largely from healthy volunteers and case reports.
