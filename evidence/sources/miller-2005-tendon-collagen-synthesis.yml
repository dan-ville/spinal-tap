id: miller-2005-tendon-collagen-synthesis
title: "Coordinated collagen and muscle protein synthesis in human patella tendon and quadriceps muscle after exercise"
authors: [Miller BF, Olesen JL, Hansen M, Dossing S, Crameri RM, Welling RJ, Langberg H, Flyvbjerg A, Kjaer M, Babraj JA, Smith K, Rennie MJ]
year: 2005
venue: "J Physiol 567(Pt 3):1021-1033"
doi: "10.1113/jphysiol.2005.093690"
pmid: "16002437"
url: https://pubmed.ncbi.nlm.nih.gov/16002437/
design: mechanistic
population: "Healthy young men; 1 h one-legged kicking at 67% Wmax; biopsies 6-72 h"
sample: {studies: null, participants: 14}
read_level: abstract
findings:
  - claim: "Tendon collagen synthesis rose by 6 h, peaked at about 24 h and was still elevated at 72 h after a single bout, a time course similar to myofibrillar protein synthesis."
    effect: "Peak FSR at 24 h: tendon collagen 0.077%/h, muscle collagen 0.054%/h, myofibrillar 0.121%/h, sarcoplasmic 0.134%/h"
    grade: promising
limitations:
  - "Endurance-type kicking, not heavy resistance; stable-isotope FSR reflects a labile pool, which may overstate bulk-matrix turnover (see heinemeier-2013-tendon-14c)."
  - "Single study: n=8 and n=6 young men, separate groups per time point; one exercise mode (1 h kicking at 67% Wmax). Grade lowered from established to promising by verification pass."
topics: [connective-tissue/tendon, connective-tissue/time-course]
cited_in: [research/theses/strength-and-mobility/chapters/08-connective-tissue.md, research/theses/strength-and-mobility/notes/connective-tissue.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Ch8 verification: PubMed abstract re-read; numbers confirmed. Full text (PMC1474228) blocked by a browser check. Grade lowered to promising: one small study with a non-resistance exercise; the time course has not been replicated in tendon proper after heavy resistance exercise. | Prior check: chapter 8 literature researcher"}
