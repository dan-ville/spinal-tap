id: momma-2022-msa
title: 'Muscle-strengthening activities are associated with lower risk and mortality in major non-communicable diseases: a
  systematic review and meta-analysis of cohort studies'
authors:
- Momma H
- Kawakami R
- Honda T
- Sawada SS
year: 2022
venue: Br J Sports Med 56(13):755-763
doi: 10.1136/bjsports-2021-105061
pmid: '35228201'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9209691/
design: meta-analysis
population: Adults in prospective cohort studies
sample:
  studies: 16
  participants: null
read_level: full-text
findings:
- claim: Muscle-strengthening activity was associated with 10-17% lower all-cause, CVD and cancer mortality, and combining
    it with aerobic activity was associated with lower risk than either alone vs none.
  effect: 'MSA vs none: 10-17% lower risk; J-shaped curve with maximal benefit at ~30-60 min/wk; combined MSA + aerobic vs
    none: lower all-cause, CVD and cancer mortality (values not in abstract)'
  grade: promising
limitations:
- Self-reported activity; observational; J-shape at higher volumes is uncertain and may reflect sparse data or confounding.
topics:
- conditioning/health
cited_in:
