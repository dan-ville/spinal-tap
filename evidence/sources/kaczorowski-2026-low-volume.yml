id: kaczorowski-2026-low-volume
title: 'Effects of Low-Volume Static Stretching and Full Range-of-Motion Resistance Training on Flexibility in Physically
  Active Young Adults: A Randomized Controlled Trial'
authors:
- Kaczorowski M
- Jaskulski K
- Góra K
- Usiądek S
- Pytko W
- Wiszomirska I
year: 2026
venue: J Clin Med 15(15):5783
doi: 10.3390/jcm15155783
pmid: '42589887'
url: https://pubmed.ncbi.nlm.nih.gov/42589887/
design: rct
population: Physically active adults 18-25 y; one supervised session per week for 6 weeks; posterior-chain flexibility
  (Romanian deadlift vs forward-bend stretch)
sample:
  studies: null
  participants: 48
read_level: full-text
findings:
- claim: Once-weekly low-volume static stretching (2 x 60 s, maximal tolerable intensity) and time-matched full-ROM
    Romanian deadlifts both improved posterior-chain flexibility versus control; the two did not differ significantly,
    though stretching gained about twice as much.
  effect: SS +3.93 +/- 3.45 cm (d vs control 1.65, 95% CI 0.81 to 2.50); RT +1.81 +/- 1.75 cm (d vs control 1.47,
    0.65 to 2.29); control -0.25 +/- 0.93 cm; SS vs RT p > 0.05
  grade: promising
limitations:
- n = 16 per group; no allocation concealment or blinding; RT group older at baseline and had extra familiarisation
  sessions; single outcome test.
topics:
- flexibility/resistance-training-rom
- flexibility/stretching-dose
