checked:
  date: '2026-11-24'
  by: verification pass
  notes: "Earlier: chapter 9 literature researcher. Verification pass (ch 9): PubMed abstract re-read. The -0.53 CMJ estimate pools short AND long HIIT (all non-sprint HIIT), not long HIIT alone. Overall CMJ -0.12 and squat 1RM -0.06, both n.s."
