id: behm-2021-stretch-impairment-mechanisms
title: Mechanisms underlying performance impairments following prolonged static stretching without a comprehensive
  warm-up
authors:
- Behm DG
- Kay AD
- Trajano GS
- Blazevich AJ
year: 2021
venue: Eur J Appl Physiol 121(1):67-94
doi: 10.1007/s00421-020-04538-8
pmid: '33175242'
url: https://pubmed.ncbi.nlm.nih.gov/33175242/
design: narrative-review
population: Review of acute static stretching studies
sample:
  studies: null
  participants: null
read_level: abstract
findings:
- claim: Proposed mechanisms of stretch-induced deficits include reduced voluntary activation, reduced persistent-inward-current
    motoneuron excitability, force-length and Ca2+ sensitivity changes and altered parallel elastic component, plus
    psychological (nocebo) effects; appropriate durations within a full warm-up have trivial effects, with some
    evidence of improved force at long muscle lengths.
  effect: Narrative
  grade: speculative
limitations:
- Mechanisms remain not fully defined (authors' words); many source studies used long durations without re-warm-up.
