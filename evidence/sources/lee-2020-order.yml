id: lee-2020-order
title: Order of same-day concurrent training influences some indices of power development, but not strength, lean mass, or
  aerobic fitness in healthy, moderately-active men after 9 weeks of training
authors:
- Lee MJ
- Ballantyne JK
- Chagolla J
- Hopkins WG
- Fyfe JJ
- Phillips SM
- Bishop DJ
- Bartlett JD
year: 2020
venue: PLoS One 15:e0233134
doi: 10.1371/journal.pone.0233134
pmid: '32407361'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7224562/
design: rct
population: Healthy moderately active men, 24.5 y; HIIT ~3 h before or after RT, 3 d/wk, 9 wk
sample:
  studies: null
  participants: 29
read_level: full-text
findings:
- claim: With ~3 h between modes, both concurrent orders matched resistance-only gains in leg-press 1RM and lean mass while
    improving aerobic fitness.
  effect: 1RM ~+24-28% all groups; lean mass ~+3-4%; VO2peak ~+8-9% in both CT groups
  grade: promising
- claim: RT followed 3 h later by HIIT attenuated countermovement-jump displacement, force and power gains versus RT alone.
  effect: CMJ displacement -5.1 +/- 4.3%, absolute force -8.2 +/- 7.1%, absolute power -6.0 +/- 4.7% (mean difference +/-
    90% CI)
  grade: speculative
limitations:
- ~10 per group; cycling HIIT; 9 weeks; moderately active not strength-trained.
topics:
- concurrent/sequence
- concurrent/explosive-strength
- concurrent/timing
