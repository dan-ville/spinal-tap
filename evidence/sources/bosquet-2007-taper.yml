findings:
- claim: The most effective taper was ~2 weeks with volume reduced exponentially by 41-60% while keeping intensity and frequency.
  effect: 2-wk duration effect 0.59 +/- 0.33; 41-60% volume cut 0.72 +/- 0.36; intensity unchanged 0.33 +/- 0.14; frequency unchanged 0.35 +/- 0.17
  grade: established
