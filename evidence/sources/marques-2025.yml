checked:
  date: '2026-11-24'
  by: verification pass
  notes: "Full text (PMC12893175) checked; numbers confirmed. Verifier check of the two-time-point caveat: with Table 1 means and SDs (volume +12.7 +/- 7.1%, iMVT +21.6 +/- 9.2%, 1RM +28.6 +/- 12.9%) the uncentred correlation of change scores is about 0.80 even if the between-person r were 0, and 0.92 (iMVT) / 0.87 (1RM) with the reported between-person r, matching the published rrm. Same 39-man collagen-trial dataset as balshaw-2026; study part-funded by the Collagen Research Institute. | Prior check: chapter 2 researcher 2026-11-24"
