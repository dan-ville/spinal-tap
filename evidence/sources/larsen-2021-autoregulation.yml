id: larsen-2021-autoregulation
title: 'Effects of subjective and objective autoregulation methods for intensity and volume on enhancing maximal strength during resistance-training interventions: a systematic review'
authors: [Larsen S, Kristiansen E, van den Tillaar R]
year: 2021
venue: PeerJ 9:e10663
doi: 10.7717/peerj.10663
pmid: '33520457'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7810043/
design: systematic-review
population: Healthy trained participants in >4-wk interventions
sample: {studies: 14, participants: 356}
read_level: abstract
findings:
- claim: All autoregulation protocols (RPE/RIR, flexible DUP, velocity targets, velocity loss) increased 1RM, with small to large within-group effects; no method was clearly superior.
  effect: 14 studies, 30 training groups; ES and % differences computed for 13 studies; no pooled estimate
  grade: promising
limitations: [No meta-analysis; within-group effects do not test superiority over fixed loading.]
topics: [programming/autoregulation]
