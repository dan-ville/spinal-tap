findings:
- claim: Proposed mechanisms for long-length advantages include passive tension from titin and other elastic elements
    adding to active tension, greater Akt/mTOR signalling with stretch in animal models, and possibly greater metabolic
    stress; all require human testing.
  effect: Narrative synthesis
  grade: speculative
- claim: The authors hypothesise that long-length benefits may diminish over time if sarcomerogenesis shifts the
    length-tension relationship, and that the advantage depends on the exercise and muscle.
  effect: Hypothesis
  grade: speculative
