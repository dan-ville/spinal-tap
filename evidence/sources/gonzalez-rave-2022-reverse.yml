id: gonzalez-rave-2022-reverse
title: 'Reverse Periodization for Improving Sports Performance: A Systematic Review'
authors: [González-Ravé JM, González-Mohino F, Rodrigo-Carranza V, Pyne DB]
year: 2022
venue: Sports Medicine - Open 8:56
doi: 10.1186/s40798-022-00445-8
pmid: '35445953'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9023617/
design: systematic-review
population: Athletes (swimming, running, strength) in reverse vs traditional or block periodization
sample: {studies: 11, participants: 200}
read_level: full-text
findings:
- claim: Reverse periodization is no more effective than traditional or block periodization for maximal strength, muscular endurance, endurance performance or VO2max.
  effect: Narrative synthesis; 2 studies level 1b, rest 2b; mean PEDro 4.9 (range 0-7)
  grade: promising
limitations: ['Few, small, low-quality studies; mostly endurance outcomes.', 'Maximal-strength evidence rests on a few resistance-training studies; two reported larger 1RM gains with traditional than reverse periodization (Prestes 2009 and one other); 2 of 11 studies were Oxford level 1b, the rest 2b.']
topics: [programming/periodization]
