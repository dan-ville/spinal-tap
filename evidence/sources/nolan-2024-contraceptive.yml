id: nolan-2024-contraceptive
title: 'The Effect of Hormonal Contraceptive Use on Skeletal Muscle Hypertrophy, Power and Strength Adaptations to Resistance Exercise Training: A Systematic Review and Multilevel Meta-analysis'
authors: [Nolan D, McNulty KL, Manninen M, Egan B]
year: 2024
venue: Sports Med 54(1):105-125
doi: 10.1007/s40279-023-01911-3
pmid: '37755666'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10798924/
design: meta-analysis
population: Women using oral contraceptive pills vs non-users completing RT (no studies of other contraceptive forms)
sample: {studies: 8, participants: 325}
read_level: full-text
findings:
- claim: Oral contraceptive use did not affect hypertrophy, strength or power adaptations to resistance training.
  effect: Hypertrophy 0.01 (95% CI -0.11 to 0.13), power -0.04 (-0.93 to 0.84), strength 0.10 (-0.08 to 0.28); 54 effects
  grade: promising
limitations:
- Only 8 studies, all OCP; heterogeneous pill types; quality assessed with TESTEX; non-hormonal-IUD, implant and injection users not studied.
topics: [frontiers/hormonal-contraception, frontiers/sex-differences]
cited_in: [research/theses/strength-and-mobility/chapters/11-frontiers.md, research/theses/strength-and-mobility/notes/frontiers.md]
checked:
  date: 2026-11-24
  by: verification pass
