id: kinoshita-2026
title: 'Hypertrophic Effects of Single- versus Multi-Joint Exercise: A Direct Comparison between Knee Extension and
  Leg Press.'
authors:
- Kinoshita M
- Maeo S
- Kobayashi Y
- Eihara Y
- Nishizawa N
- Kusagawa Y
- Sugiyama T
