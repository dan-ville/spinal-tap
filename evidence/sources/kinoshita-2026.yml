year: 2026
venue: Med Sci Sports Exerc 58(7):1566-1580
doi: 10.1249/MSS.0000000000003957
pmid: '41630124'
url: https://pubmed.ncbi.nlm.nih.gov/41630124/
design: rct
population: Untrained adults; within-subject knee extension vs leg press, 12 wk, MRI of 17 muscles
sample:
  studies: null
  participants: 17
read_level: full-text
findings:
- claim: Leg press and knee extension grew the vasti and whole quadriceps similarly, but only knee extension grew
    the rectus femoris, and only leg press grew the gluteus maximus and adductor magnus.
  effect: Rectus femoris +13.2% (KE) vs +1.1% (LP), P <= 0.001; vasti +5.0-7.2% vs +4.4-6.2%; whole QF +7.1% vs +4.9%
    (P >= 0.319); gluteus maximus +15.4% and adductor magnus +6.2% with LP only
  grade: promising
- claim: Surface EMG excitation patterns during each exercise mirrored the muscle-specific hypertrophy.
  effect: Follow-up EMG experiment
  grade: promising
limitations:
- Untrained; within-subject; 70% 1RM, 5 x 10.
