id: ruple-2023
title: The effects of resistance training to near failure on strength, hypertrophy, and motor unit adaptations
  in previously trained adults.
authors:
- Ruple BA
- Plotkin DL
- Smith MA
- Godwin JS
- Sexton CL
- McIntosh MC
- Kontos NJ
- Beausejour JP
- Pagan JI
- Rodriguez JP
- Sheldon D
- Knowles KS
- Libardi CA
- Young KC
- Stock MS
- Roberts MD
year: 2023
venue: Physiol Rep 11(9):e15679
doi: 10.14814/phy2.15679
pmid: '37144554'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10161210/
design: rct
population: Resistance-trained men and women (6 +/- 4 y training)
sample:
  studies: null
  participants: 19
read_level: abstract
findings:
- claim: Five weeks of squat, bench and deadlift training at 0-1 vs 4-6 repetitions in reserve produced
    similar 1RM gains and no group difference in vastus lateralis hypertrophy in trained lifters.
  effect: time effects for all 1RMs (P < 0.05); no condition x time interactions
  grade: promising
- claim: Training near failure shifted the motor unit mean firing rate vs recruitment threshold relationship,
    suggesting increased firing rates of lower-threshold units.
  effect: significant interactions for slope and y-intercept
  grade: speculative
limitations:
- Very small groups (10 vs 9); short; surface EMG decomposition at 80% MVC.
