id: kubo-2019
title: Effects of squat training with different depths on lower limb muscle volumes.
authors:
- Kubo K
- Ikebukuro T
- Yata H
year: 2019
venue: Eur J Appl Physiol 119(9):1933-1942
doi: 10.1007/s00421-019-04181-y
pmid: '31230110'
url: https://pubmed.ncbi.nlm.nih.gov/31230110/
design: rct
population: Young men; full squat vs half squat, 10 wk, MRI
sample:
  studies: null
  participants: 17
read_level: abstract
findings:
- claim: Full and half squats grew the knee extensors similarly, but full squats grew the adductors and gluteus maximus
    more; neither grew the rectus femoris or hamstrings.
  effect: Knee extensors +4.9% vs +4.6%; adductors +6.2% vs +2.7% (p = 0.026); gluteus maximus +6.7% vs +2.2% (p =
    0.008); RF and hamstrings no change
  grade: promising
- claim: Strength gains were specific to the trained depth.
  effect: Full squat 1RM +31.8% (FST) vs +11.3% (HST); half squat 1RM +24.2% vs +32.0% (ns)
  grade: promising
limitations:
- Small groups (8 and 9); untrained or recreationally active men.
topics:
- hypertrophy/range-of-motion
- hypertrophy/exercise-selection
- strength/range-of-motion
- strength/joint-angle
cited_in:
