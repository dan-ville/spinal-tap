id: brown-2017-compression
title: "Compression Garments and Recovery from Exercise: A Meta-Analysis"
authors: [Brown F, Gissane C, Howatson G, van Someren K, Pedlar C, Hill J]
year: 2017
venue: "Sports Medicine 47(11):2245-2267"
doi: "10.1007/s40279-017-0728-9"
pmid: "28434152"
url: https://pubmed.ncbi.nlm.nih.gov/28434152/
design: meta-analysis
population: "Healthy participants after resistance, running or cycling exercise"
sample: {studies: 23, participants: null}
read_level: abstract
findings:
  - claim: "Compression garments gave small overall benefits for recovery, largest for strength recovery after resistance exercise beyond 24 h."
    effect: "Overall ES 0.38 (95% CI 0.25 to 0.51); strength ES 0.62 (0.39 to 0.84); 2-8 h ES 1.14 (0.72 to 1.56); >24 h ES 1.03 (0.48 to 1.57); after resistance exercise ES 0.49 (0.37 to 0.61)"
    grade: promising
limitations:
  - "Placebo impossible; acute recovery only; pressure poorly reported; no adaptation outcomes."
topics: [recovery/compression]
cited_in: [research/theses/strength-and-mobility/chapters/10-recovery-and-nutrition.md, research/theses/strength-and-mobility/notes/recovery-and-nutrition.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Abstract re-read: 23 studies; overall ES 0.38 (0.25 to 0.51); strength recovery 0.62 (0.39 to 0.84), 2-8 h 1.14 (0.72 to 1.56), >24 h 1.03 (0.48 to 1.57); after resistance exercise 0.49 (0.37 to 0.61). Confirmed. Note the claim's 'short-term strength recovery' covers recovery up to and beyond 24 h after a bout, not training adaptation."}
