findings:
- claim: Eight weeks of isometric knee-extension training increased MVC about 33% without changing agonist
    maximal EMG, while hamstring coactivation fell about 20% within the first week; the untrained leg
    showed smaller parallel changes.
  effect: MVC +32.8%; hamstring coactivation about -20% after week 1; untrained leg MVC +16.2%, coactivation
    -13%
  grade: promising
limitations:
- Surface EMG; small sample; isometric.
