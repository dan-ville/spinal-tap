id: myrholt-2023-velocity-loss
title: Effects of Low- Versus High-Velocity-Loss Thresholds With Similar Training Volume on Maximal Strength and Hypertrophy in Highly Trained Individuals
authors: [Myrholt RB, Solberg P, Pettersen H, Seynnes O, Paulsen G]
year: 2023
venue: International Journal of Sports Physiology and Performance 18(4):368-377
doi: 10.1123/ijspp.2022-0161
pmid: '36754062'
url: https://pubmed.ncbi.nlm.nih.gov/36754062/
design: rct
population: Strength-trained women and men (7 F, 9 M); 6 wk, 3x/wk, 75-90% 1RM
sample: {studies: null, participants: 16}
read_level: abstract
findings:
- claim: With total volume matched (more sets for the low-VL group), low and high velocity-loss thresholds gave similar 1RM gains in strength-trained lifters; high VL gave slightly more vastus lateralis thickness.
  effect: Squat and bench 1RM +7 to 11% in both groups; VL thickness group difference 6 +/- 6%, P < .05
  grade: promising
limitations: [n = 8 per group; 6 weeks.]
topics: [programming/autoregulation, strength/velocity-based-training]
