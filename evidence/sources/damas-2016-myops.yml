id: damas-2016-myops
title: Resistance training-induced changes in integrated myofibrillar protein synthesis are related to hypertrophy
  only after attenuation of muscle damage.
authors:
- Damas F
- Phillips SM
- Libardi CA
- Vechin FC
- Lixandrão ME
- Jannig PR
- Costa LA
- Bacurau AV
- Snijders T
- Parise G
- Tricoli V
- Roschel H
- Ugrinowitsch C
year: 2016
venue: J Physiol 594(18):5209-22
doi: 10.1113/JP272472
pmid: '27219125'
url: https://pubmed.ncbi.nlm.nih.gov/27219125/
design: cohort
population: Untrained young men; 10 wk RT with deuterium-oxide myofibrillar protein synthesis and biopsies
sample:
  studies: null
  participants: 10
read_level: abstract
findings:
- claim: Integrated myofibrillar protein synthesis after the first sessions (when Z-band damage was highest) was not
    related to hypertrophy; by weeks 3 and 10, with damage attenuated, MyoPS correlated strongly with fibre growth.
  effect: MyoPS change at T2 and T3 vs hypertrophy r about 0.9 (P < 0.04); no relation at T1
  grade: promising
limitations:
- n = 10 untrained men; correlational; vastus lateralis only.
topics:
- hypertrophy/mechanisms
- mechanisms/hypertrophy
