id: guissard-2004-stretch-training
title: Effect of static stretch training on neural and mechanical properties of the human plantar-flexor muscles
authors:
- Guissard N
- Duchateau J
year: 2004
venue: Muscle Nerve 29(2):248-255
doi: 10.1002/mus.10549
pmid: '14755490'
url: https://pubmed.ncbi.nlm.nih.gov/14755490/
design: mechanistic
population: Healthy adults; plantar flexors; 30 sessions of static stretching
sample:
  studies: null
  participants: 12
read_level: abstract
findings:
- claim: Thirty sessions of plantar-flexor stretching increased maximal dorsiflexion by 30.8%, associated with reduced
    passive stiffness and reduced H- and T-reflex amplitudes; MVC and rate of torque development were unaffected.
  effect: Dorsiflexion +30.8%; ROM change vs passive stiffness r2 = 0.88; T-reflex -36%, H-reflex -14%
  grade: promising
- claim: 'Neural and mechanical adaptations followed different time courses: one month after training, flexibility
    and stiffness changes were partly retained but reflex activity had returned to baseline.'
  effect: Qualitative (abstract)
  grade: speculative
limitations:
- n = 12, no control group reported in abstract; tonic reflex changes may not generalise to other muscles.
topics:
- flexibility/mechanisms
- flexibility/stiffness
- flexibility/detraining
