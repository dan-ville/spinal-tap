id: glover-2020
title: Cortical, Corticospinal, and Reticulospinal Contributions to Strength Training.
authors:
- Glover IS
- Baker SN
year: 2020
venue: J Neurosci 40(30):5820-5832
doi: 10.1523/JNEUROSCI.1923-19.2020
pmid: '32601242'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7380966/
design: mechanistic
population: Two female macaque monkeys, unilateral weighted-pull training
sample:
  studies: null
  participants: 2
read_level: abstract
findings:
- claim: Over 8-9 weeks of progressive weighted pulling (to ~6 kg, near body weight), muscle responses
    to motor cortex and reticulospinal tract stimulation increased, whereas responses to direct corticospinal
    tract stimulation did not.
  effect: M1 and RST MEPs increased; CST responses unchanged; changes persisted after 2-week washout
  grade: speculative
- claim: After a further 3 months of training, spinal input-output gain was higher on the trained side
    for reticulospinal but not corticospinal stimulation.
  effect: RST spinal gain increased in intermediate zone and motor nuclei; no CST change
  grade: speculative
limitations:
- Two animals; one task; non-human primate.
- Human reticulospinal function can only be inferred indirectly (StartReact, ipsilateral MEPs).
topics:
- strength/reticulospinal
- strength/neural-adaptations
