id: beedle-2008-stretch-1rm
title: Pretesting static and dynamic stretching does not affect maximal strength
authors:
- Beedle B
- Rytter SJ
- Healy RC
- Ward TR
year: 2008
venue: J Strength Cond Res 22(6):1838-1843
doi: 10.1519/JSC.0b013e3181821bc9
pmid: '18841081'
url: https://pubmed.ncbi.nlm.nih.gov/18841081/
design: crossover
population: College-aged men (n = 19) and women (n = 32), moderately to very active, most with weight-training experience
sample:
  studies: null
  participants: 51
read_level: abstract
findings:
- claim: Short moderate-intensity static stretching (3 x 15 s per muscle) or dynamic stretching before testing did
    not change free-weight bench press or leg press 1RM compared with no stretching.
  effect: No significant difference among static, dynamic and no-stretch conditions (repeated-measures ANOVA, p >
    0.05); means not given in the abstract
  grade: promising
limitations:
- Short stretch durations (45 s per muscle); recreationally trained, not competitive lifters; abstract only.
