id: appleby-2012
title: Changes in strength over a 2-year period in professional rugby union players.
authors:
- Appleby B
- Newton RU
- Cormie P
year: 2012
venue: J Strength Cond Res 26(9):2538-2546
doi: 10.1519/JSC.0b013e31823f8b86
pmid: '22076095'
url: https://pubmed.ncbi.nlm.nih.gov/22076095/
design: cohort
population: Professional rugby union players
sample:
  studies: null
  participants: 20
read_level: abstract
findings:
- claim: Over two years, highly trained players gained 6.5-11.5% in bench and squat 1RM; gains were smaller
    in stronger players and lower-body gains tracked changes in lean mass index.
  effect: 1RM +6.5-11.5% (bench P = 0.000-0.002; squat P = 0.165-0.277, NS); gain vs initial strength r = -0.569 to -0.712; lower-body gain vs change in
    LMI r = 0.692-0.880
  grade: promising
limitations:
- Observational; DXA lean mass index is a crude hypertrophy proxy; concurrent sport training.
topics:
- strength/training-age
- strength/hypertrophy-strength
cited_in:
- research/theses/strength-and-mobility/chapters/02-neuromuscular-basis-of-strength.md
checked:
  date: '2026-11-24'
  by: verification pass
  notes: "Abstract re-read; numbers confirmed. Squat gains were not statistically significant (P = 0.165-0.277); only bench press gains were. The lean-mass correlation applies to lower-body gains in 20 players. | Prior check: chapter 2 researcher 2026-11-24"
