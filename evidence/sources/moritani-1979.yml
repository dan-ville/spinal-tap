findings:
- claim: Neural factors accounted for most of the initial strength gain, with hypertrophy becoming the
    dominant factor after 3-5 weeks; the untrained arm also gained strength.
  effect: qualitative partitioning from EMG-force relationships
  grade: contested
limitations:
- Indirect method (EMG/force slope) and girth-based size estimate; small sample; the classic time-course
  model has been challenged in both directions (seynnes-2007, damas-2016, pearcey-2021).
