id: maeo-2023
title: Triceps brachii hypertrophy is substantially greater after elbow extension training performed in the overhead
  versus neutral arm position.
authors:
- Maeo S
- Wu Y
- Huang M
- Sakurai H
- Kusagawa Y
- Sugiyama T
- Kanehisa H
- Isaka T
year: 2023
venue: Eur J Sport Sci 23(7):1240-1250
doi: 10.1080/17461391.2022.2100279
pmid: '35819335'
url: https://pubmed.ncbi.nlm.nih.gov/35819335/
design: rct
population: Untrained adults; within-subject overhead vs neutral cable elbow extension, 12 wk, MRI
sample:
  studies: null
  participants: 21
read_level: abstract
findings:
- claim: Overhead elbow extensions (long head lengthened) produced 1.4-1.5-fold more triceps growth than neutral-arm
    extensions, including in the monoarticular heads, despite 34-39% lower absolute loads.
  effect: Long head +28.5% vs +19.6% (d = 0.61); lateral+medial +14.6% vs +10.5% (d = 0.39); whole triceps +19.9%
    vs +13.9% (d = 0.54), all P <= 0.002
  grade: promising
limitations:
- Untrained; within-subject (possible cross-education); greater monoarticular growth is unexplained by length alone.
topics:
- hypertrophy/muscle-length
- hypertrophy/exercise-selection
