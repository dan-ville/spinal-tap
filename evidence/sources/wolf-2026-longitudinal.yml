id: wolf-2026-longitudinal
title: Does longer-muscle length resistance training cause greater longitudinal growth in humans? A systematic review.
authors:
- Wolf M
- Korakakis PA
- Roberts MD
- Plotkin DL
- Franchi MV
- Contreras B
- Henselmans M
- Larsen S
- Schoenfeld BJ
year: 2026
venue: Sports Med Health Sci 8(1):34-42
doi: 10.1016/j.smhs.2025.03.001
pmid: '41646176'
url: https://pubmed.ncbi.nlm.nih.gov/41646176/
design: systematic-review
population: Studies comparing longer vs shorter muscle-length RT with fascicle length and size outcomes
sample:
  studies: 8
  participants: 120
read_level: full-text
findings:
- claim: Longer-length training may increase both muscle size and fascicle length more than shorter-length training,
    suggesting more longitudinal growth, but the evidence is mixed.
  effect: Narrative (e.g. McMahon 2014 FL +36.5% vs +19.8% proximal)
  grade: speculative
- claim: No study has measured serial sarcomere number after long- vs short-length training in humans, and all but
    one estimated fascicle length by linear extrapolation, which has questionable validity.
  effect: 7 of 8 studies used extrapolation
  grade: established
limitations:
- Narrative synthesis; small, mostly untrained samples.
topics:
- hypertrophy/muscle-length
- hypertrophy/architecture
- mobility/mechanisms
cited_in:
- research/theses/strength-and-mobility/chapters/05-hypertrophy-methods.md
- research/theses/strength-and-mobility/chapters/07-strength-through-range.md
checked:
  date: '2026-11-24'
  by: verification pass
  notes: 'Ch5 verification: full text re-read (Europe PMC PMC12869050): 8 studies, n = 120; no SSN estimates for long
    vs short; all but one used linear extrapolation. Confirmed. Note pincheira-2022-sarcomere: the one human SSN estimate
    after eccentric (Nordic) training found longer sarcomeres, not more in series. | Prior check: chapter 5 literature
    researcher 2026-11-24; Chapter 7 researcher corrected DOI against PubMed (10.1016/j.smhs.2025.03.001).'
