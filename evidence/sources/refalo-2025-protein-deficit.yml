id: refalo-2025-protein-deficit
title: "Effect of Dietary Protein on Fat-Free Mass in Energy Restricted, Resistance-Trained Individuals: An Updated Systematic Review with Meta-Regression"
authors: [Refalo MC, Trexler ET, Helms ER]
year: 2025
venue: "Strength and Conditioning Journal (published online 2025-01-22)"
doi: "10.1519/SSC.0000000000000888"
pmid: null
url: https://openrepository.aut.ac.nz/items/1aa54baf-6885-4739-aba7-df0087c3eae8
design: meta-analysis
population: "Non-obese, energy-restricted adults with at least 3 months resistance-training experience"
sample: {studies: 29, participants: null}
read_level: full-text
findings:
  - claim: "In trained people losing fat, fat-free mass change improved roughly linearly with protein intake, with no clear plateau, especially when intake is scaled to fat-free mass."
    effect: ">97% probability of a linear relationship; g/kg BM beta 0.07 (95% HDI -0.01 to 0.14); g/kg FFM beta 0.06 (0.01 to 0.12)"
    grade: promising
  - claim: "The relationship was stronger in interventions longer than 4 weeks, in men and in leaner people."
    effect: "Moderator analysis; authors call findings exploratory because of heterogeneity"
    grade: speculative
limitations:
  - "Bayesian meta-regression across arms (not randomised comparisons of protein doses); heterogeneous; journal is practitioner-oriented."
