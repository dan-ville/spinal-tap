id: andrews-2026-nhe-mechanics
title: Adaptations in biceps femoris long-head muscle-tendon mechanics during the Nordic hamstring exercise in response
  to 9 weeks of training
authors:
- Andrews MH
- Pai S A
- Gurchiek RD
- Hodges PW
- Lichtwark GA
- Delp SL
- Pincheira PA
year: 2026
venue: J Sport Health Sci 15:101134
doi: 10.1016/j.jshs.2026.101134
pmid: '41862162'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13279503/
design: cohort
population: Same 12 recreationally active adults as andrews-2025-multiscale
sample:
  studies: null
  participants: 12
read_level: full-text
findings:
- claim: After 9 weeks of Nordic training, participants produced peak torque at more extended knee angles and longer
    muscle-tendon lengths, with fascicles operating 25% longer, yet estimated active sarcomere length at peak torque
    was unchanged.
  effect: Peak torque +40%; knee extension at peak torque +37% (p = 0.012); MTU length at peak torque +4% (p = 0.001);
    fascicle length at peak torque +25% (p < 0.001); active sarcomere length p = 0.266
  grade: promising
- claim: During most of the Nordic descent, fascicle and muscle-tendon lengths are decoupled, with tendon lengthening
    taking up most of the MTU excursion until the final 10-20%.
  effect: Descriptive (introduction and results)
  grade: promising
limitations:
- Uncontrolled; sarcomere lengths during exercise are estimated from fascicle length and previously measured sarcomere
  number.
topics:
