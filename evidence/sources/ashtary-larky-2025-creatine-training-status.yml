title: "Creatine supplementation and resistance training: a comparison between novice and experienced lifters - a systematic review and dose-response meta-analysis"
authors: [Ashtary-Larky D, Mohammadi S, Hajizadeh L, Mousavi SAH, Forbes SC, Candow DG, Antonio J]
year: 2025
