checked: {date: 2026-11-24, by: "verification pass", notes: "Full text (Europe PMC XML) read (results and discussion). Confirmed: 61 trials; FFM +1.39 kg (1.07 to 1.70); body mass +0.89 kg; trained 1.82 vs untrained 1.23 kg (difference NS). The authors argue FFM gains in trained people 'likely reflect muscle accretion' and in untrained people water, but state that no study directly quantified water vs muscle. Authors Forbes, Candow and Antonio declare creatine-industry ties."}
