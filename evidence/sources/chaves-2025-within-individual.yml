id: chaves-2025-within-individual
title: Within-individual design for assessing true individual responses in resistance training-induced muscle hypertrophy
authors: [Chaves TS, da Silva DG, Lixandrão ME, Libardi CA]
year: 2025
venue: Front Sports Act Living 7:1517190
doi: 10.3389/fspor.2025.1517190
