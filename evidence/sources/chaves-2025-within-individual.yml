design: other
population: Methodological proposal
sample: {studies: null, participants: null}
read_level: full-text
findings:
- claim: Training one limb while the contralateral limb stays untrained lets each person serve as their own control for biological variation in muscle mass over time, so the true individual response can be estimated as the trained-limb change minus the control-limb change.
  effect: Methodological framework
  grade: promising
limitations:
- Cross-education and systemic effects may contaminate the control limb; isolated single-muscle training reduces ecological validity.
