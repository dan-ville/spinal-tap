findings:
- claim: Adding long-length partial reps after full-ROM failure produced the same gastrocnemius growth with half
    the sets, when volume load was equated.
  effect: MT +8% vs +8% (equivalence P < 0.05); per-set +0.16% vs +0.08%
  grade: speculative
limitations:
- Untrained; per-set efficiency depends on how sets are counted; ultrasound.
