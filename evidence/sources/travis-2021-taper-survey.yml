  date: 2026-11-24
  by: verification pass
  notes: 'Ch4 verification: PubMed abstract re-read: n = 364; 7-10-day step taper, volume -41-50%, final heavy squat/deadlift 7-10 days out, bench <7 days, cessation 2.8 +/- 1.1 days. Confirmed. Only tapering lifters were included, so prevalence cannot be inferred. | Earlier check by chapter 4 literature researcher'
