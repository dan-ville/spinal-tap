findings:
- claim: Mechanisms supported by rodent and human data include mTORC1 signalling, ribosome biogenesis (translational
    capacity), satellite cell proliferation and myonuclear accretion, and repeated post-exercise rises in muscle protein
    synthesis; the review lists areas of active disagreement about each.
  effect: Narrative synthesis (Physiol Rev 2023)
  grade: established
limitations:
- Narrative; much mechanistic evidence is from rodent synergist-ablation models with loads far beyond human training.
