id: barsuhn-2025-volume-increase
title: 'Training volume increases or maintenance based on previous volume: the effects on muscular adaptations in trained males'
authors: [Barsuhn A, Wadhi T, Murphy A, Zazzo S, Thompson B, Barakat C, Bradshaw J, Walters J, Andersen JC, Schoenfeld BJ, Ugrinowitsch C, De Souza EO]
year: 2025
venue: Journal of Applied Physiology 138(1):259-269
doi: 10.1152/japplphysiol.00476.2024
pmid: '39665246'
url: https://pubmed.ncbi.nlm.nih.gov/39665246/
design: rct
population: Resistance-trained men; lower-body RT 2x/wk for 8 wk; maintain habitual sets vs +30% vs +60%
sample: {studies: null, participants: 29}
read_level: abstract
findings:
- claim: Raising weekly sets by 30% or 60% over habitual volume did not increase thigh hypertrophy, and the maintenance group had the greatest overall 1RM gain.
  effect: No group differences in muscle size; CON (maintenance) greatest overall 1RM; G30 largest increase in reps to failure (abstract numbers truncated in source)
  grade: promising
limitations:
- 55 randomised, 29 completed (high attrition); 8 weeks; abstract p-values garbled in the indexed record.
topics: [hypertrophy/volume, strength/volume]
