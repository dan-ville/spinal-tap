id: travis-2021-step-exponential
title: Skeletal Muscle Adaptations and Performance Outcomes Following a Step and Exponential Taper in Strength Athletes
authors: [Travis SK, Zwetsloot KA, Mujika I, Stone MH, Bazyler CD]
year: 2021
venue: Frontiers in Physiology 12:735932
doi: 10.3389/fphys.2021.735932
pmid: '34777004'
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8582352/
design: rct
population: Powerlifters (squat ~175 kg); 6-wk program ending in a 1-wk overreach then a 1-wk step or 3-wk exponential taper
sample: {studies: null, participants: 16}
read_level: abstract
findings:
- claim: Both a 1-week step taper and a 3-week exponential taper after an overreach increased squat, bench, deadlift and total; muscle-level changes (type IIA fibre CSA) favoured the step taper.
  effect: Main time effects for 1RM squat (p < 0.001), bench (p < 0.001), deadlift (p = 0.024), total (p < 0.001); MHC-IIA fCSA interaction p = 0.014 (step only)
  grade: promising
limitations: [n = 8 per group; no between-group 1RM difference reported in abstract.]
topics: [programming/taper]
