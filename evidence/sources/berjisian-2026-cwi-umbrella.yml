id: berjisian-2026-cwi-umbrella
title: "Strategic Application of Post-exercise Cold-Water Immersion to Enhance Performance Recovery and Adaptation: An Umbrella Review of 15 Published Systematic Reviews with Meta-analysis"
authors: [Berjisian E, Miraftabi H, Ihsan M, Homer KA, Kendall K, Roberts L, Abbiss C]
year: 2026
venue: "Sports Medicine - Open 12:145"
doi: "10.1186/s40798-026-01116-8"
pmid: "42816732"
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13627639/
design: umbrella-review
population: "15 systematic reviews with meta-analysis (2011-2025) covering 161 unique studies of post-exercise CWI in healthy humans"
sample: {studies: 15, participants: null}
read_level: full-text
findings:
  - claim: "CWI reduces soreness (up to 96 h) and creatine kinase (24-72 h) and speeds recovery of power and jump at 24-72 h, but impairs strength and hypertrophy gains when used repeatedly after resistance training."
    effect: "Qualitative umbrella synthesis; review quality low to critically low (AMSTAR 2); certainty low to very low (GRADE)"
    grade: promising
  - claim: "Strength blunting appears with immersion of the exercised limb but not clearly with whole-body immersion."
    effect: "Limb-only SMD -0.31 vs whole-body SMD -0.08 (from Grgic 2023)"
    grade: speculative
limitations:
  - "Reviews on chronic adaptation overlap heavily (64%), so conclusions rest on few primary trials."
topics: [recovery/cold-water-immersion]
cited_in: [research/theses/strength-and-mobility/chapters/10-recovery-and-nutrition.md, research/theses/strength-and-mobility/notes/recovery-and-nutrition.md]
checked: {date: 2026-11-24, by: "verification pass", notes: "Full text (Europe PMC XML) and abstract re-read: 15 SRMAs, 161 unique studies; soreness reduced up to 96 h, CK 24-72 h; power at 24 h after high-intensity and 24-48 h after eccentric exercise; CWI did not improve acute strength recovery and impaired strength and hypertrophic gains with chronic use; AMSTAR 2 low to critically low, GRADE low to very low. Confirmed."}
