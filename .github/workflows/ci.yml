name: CI
on: [push, pull_request]
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx freeweights-evidence check
  spinal-tap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/spinal-tap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/spinal-tap/package-lock.json
            apps/spinal-tap/atlas/package-lock.json
      - run: npm ci
      - run: npm --prefix atlas ci
      - run: npm run build
      - run: npm test
      - run: node scripts/check-sources.mjs
      - run: node scripts/check-links.mjs
      - run: node scripts/check-plan.mjs
